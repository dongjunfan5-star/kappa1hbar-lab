        lineSelect.value=selected;
      }
      function observations() {
        if(!on||!aligned)return [];
        const lines=availableLines();
        if(mode==='prism'&&!direct)return lines.flatMap(l=>{
          const {inside,deviation:phi}=prismAngles(l.wave,incidence);
          return Number.isFinite(phi)?[{l,k:1,phi,inside}]:[];
        });
        const center={l:{id:'zero',label:mode==='reflect'?'正反射':'零级／直射',color:lamps[lamp].color},k:0,phi:0};
        if(direct)return [center];
        return [center,...lines.flatMap(l=>[-2,-1,1,2].flatMap(k=>{
          const phi=lineAngle(l,k);
          return phi===null?[]:[{l,k,phi:phi+readingDrift(l,Math.abs(k))}];
        }))];
      }
      const visibleLines=lines=>lines.filter(({phi})=>Math.abs(phi-angle)<2.05);
      function aimValue() {
        const l=chosen(), k=mode==='prism'?1:side*order;
        const phi=lineAngle(l,k);
        if(phi===null||!Number.isFinite(phi)||Math.abs(phi)>87)return null;
        return phi+(mode==='prism'?0:readingDrift(l,Math.abs(k)));
      }
      function rayPath(angle,length,color,opacity,start=[0,0,axis+.8]) {
        const offset=polar(angle,length,0);
        return `<path d="${path([start,start.map((value,i)=>value+offset[i])])}" fill="none" stroke="${color}" stroke-opacity="${opacity}" stroke-width="1.35" vector-effect="non-scaling-stroke"/>`;
      }
      function prismRays(light,seen) {
        const normal=incidence*rad;
        const entryX=(-prismRadius/2+prismOffsetY*Math.sin(normal))/Math.cos(normal);
        const entry=[entryX,0,axis+.8];
        const outward=incidence-prismApex;
        return rayPath(0,73+entryX,lamps[lamp].color,.42,[-73,0,axis+.8])+light.map(o=>{
          // Each face is half a circumradius from the prism center. Start from the entry point.
          const entryProjection=entryX*Math.cos(outward*rad)-prismOffsetY*Math.sin(outward*rad);
          const insideLength=(prismRadius/2-entryProjection)/Math.cos((o.inside-outward)*rad);
          const offset=polar(o.inside,insideLength,0);
          const exit=entry.map((value,i)=>value+offset[i]);
          const visible=seen.includes(o);
          return rayPath(o.inside,insideLength,o.l.color,visible ? .68 : .25,entry)+
            rayPath(o.phi,visible?64:48,o.l.color,visible?1:.34,exit);
        }).join('');
      }
      function redrawGeometry(light,seen) {
        const place=(key,contents)=>q(`[data-hs-${key}]`).innerHTML=contents;
        const turn=worldAngle();
        place('scope-art',telescope(turn,focused?0:-4));
        place('lamp-art',lampTubes(lamp));
        place('optic-art',mode==='prism'&&direct?'':stageOptic(mode,incidence));
        place('rays',!on?'':mode==='prism'&&!direct?prismRays(light,seen):
          rayPath(180,73,lamps[lamp].color,.42)+light
            .filter(o=>o.k===0||Math.abs(o.k)===order)
            .map(o=>rayPath(worldAngle(o.phi),seen.includes(o)?68:53,o.l.color,seen.includes(o)?1:.34)).join(''));
        const preserveFocus=document.activeElement?.dataset.rigHit;
        place('hits',[
          svgHit('hs-power','开关当前灯管',...at(-217,2,103),24),
          svgHit('hs-focus','调焦至无穷远',...at(...polar(turn,166,axis+13)),20),
          svgHit('hs-align','共轴与等高调整',...at(-127,6,axis+10),22),
          svgHit('hs-telescope','拖动望远镜，按 Enter 辅助居中',...at(...polar(turn,115,axis+14)),23),
          svgHit('hs-optic','换装色散元件',...at(3,-3,117),23),
        ].join(''));
        if(preserveFocus)q(`[data-rig-hit="${preserveFocus}"]`)?.focus({preventScroll:true});
      }
      function redrawFinder(seen) {
        q('[data-hs-spectral-image]').innerHTML=seen.map(o=>{
          const x=220+100*(o.phi-angle), spread=slit*.55+(focused?0:8), strength=o.l.id==='hd'?.45:.82;
          return `<path d="M${x} 18v59" stroke="${o.l.color}" stroke-width="${spread+3}" stroke-opacity=".20"/><path d="M${x} 18v59" stroke="${o.l.color}" stroke-width="${Math.max(1.5,spread)}" stroke-opacity="${strength}"/>`;
        }).join('');
        q('[data-hs-finder]').textContent=!on?'灯未亮':!aligned?'先调焦并让两管共轴':seen.length
          ?seen.map(o=>o.k===0?o.l.label:`${o.l.label}${mode==='prism'?'':o.k>0?'（+'+o.k+' 级）':'（'+o.k+' 级）'}`).join('、')
          :'这个方向暂未看到谱线';
      }
      function gratingEstimate(rows) {
        const cal=rows.filter(row=>row.line.id==='hg546');
        if(!cal.length)return null;
        const d=cal.map(row=>period(546.1,row.phi,row.order));
        const u=Math.hypot(meanUncertainty(d),mean(cal.map(row=>period(546.1,row.phi,row.order)/
          Math.tan(row.phi*rad)*rad/60/Math.sqrt(24)))/Math.sqrt(cal.length));
        return {count:cal.length,d:mean(d),u};
      }
      function evaluateRecord(row,grating,prism) {
        if(row.method==='prism'){
          const n=prismIndexFromDeviation(row.phi);
          if(row.lamp==='mercury')return {index:n, text:'n ＝ '+n.toFixed(5)};
          const wave=prism?invertPrism(prism,n):null;
          return {wave,text:wave===null?'n ＝ '+n.toFixed(5)+'，待标定或超出拟合区间':
            'λ ≈ '+wave.toFixed(1)+' nm'+(wave>576.96?'（外推）':'')};
        }
        if(row.lamp==='mercury')return {text:'d ＝ '+period(546.1,row.phi,row.order).toFixed(2)+' nm'};
        if(!grating)return {text:'待汞绿线标定'};
        const wave=grating.d*Math.sin(row.phi*rad)/row.order;
        const dispersion=row.order/(grating.d*Math.cos(row.phi*rad))/rad;
        return {wave,text:'λ ≈ '+wave.toFixed(2)+' nm，D ≈ '+dispersion.toFixed(4)+' °/nm'};
      }
      function redrawRecords() {
        const rows=records.filter(row=>row.context===context());
        const grating=mode==='prism'?null:gratingEstimate(rows);
        const prism=mode==='prism'?fitPrism(rows.filter(row=>row.lamp==='mercury').map(row=>({
          wave:row.line.wave,index:prismIndexFromDeviation(row.phi),
        }))):null;
        const constants=[];
        q('[data-hs-rows]').innerHTML=rows.length?rows.map(row=>{
          const value=evaluateRecord(row,grating,prism);
          if(row.line.upper&&value.wave)constants.push({...row,wave:value.wave});
          return `<tr><td>${row.line.label} · ${row.trial} ${mode==='prism'?'次':'组 · '+row.order+' 级'}</td><td>${row.reads.map(([direction,pair])=>`${direction} ${readingText(pair)}`).join('<br>')}</td><td>${row.phi.toFixed(4)}°</td><td>${value.text}</td></tr>`;
        }).join(''):'<tr><td colspan="4">等待第一次谱线记录</td></tr>';
        const baseResult=mode==='prism'?(prism
          ?`柯西拟合（λ 用 μm）　a ＝ ${prism.a.toFixed(6)}，b ＝ ${prism.b.toFixed(6)} μm²，c ＝ ${prism.c.toFixed(6)} μm³`
          :'棱镜标定　先记录至少三条不同的已知汞线。')
          :grating?`光栅周期 d ＝ ${grating.d.toFixed(2)} nm（${grating.count} 组；标准不确定度约 ${grating.u.toFixed(2)} nm）`
          :'光栅标定　先记汞绿线左右各一次。';
        const byLine=hydrogen.flatMap(l=>{
          const a=constants.filter(row=>row.line.id===l.id);
          if(!a.length)return [];
          const wave=mean(a.map(row=>row.wave));
          const rmsD=grating?Math.sqrt(mean(a.map(row=>(grating.u*Math.sin(row.phi*rad)/row.order)**2))):0;
          const rmsAngle=grating?Math.sqrt(mean(a.map(row=>(grating.d*Math.cos(row.phi*rad)*rad/60/Math.sqrt(24)/row.order)**2))/a.length):0;
          const u=Math.hypot(meanUncertainty(a.map(row=>row.wave)),rmsD,rmsAngle);
          return [{wave,l,count:a.length,u,R:ryt(wave,l.upper)}];
        });
        const waveResult=byLine.map(({l,wave,count,u,R})=>
          `${l.label.split(' ')[0]} ${wave.toFixed(2)} nm${grating?' ± '+u.toFixed(2)+' nm':''}（${count} ${grating?'组':'次'}；逐线 R ≈ ${(R/1e7).toFixed(4)} × 10⁷ m⁻¹）`).join('；');
        const x=l=>1/4-1/l.upper**2;
        const fitted=byLine.length?byLine.reduce((sum,{wave,l})=>sum+x(l)/(wave*1e-9),0)/
          byLine.reduce((sum,{l})=>sum+x(l)**2,0):null;
        q('[data-hs-result]').innerHTML=`<p>${baseResult}</p>${waveResult?`<p>${waveResult}</p>`:'<p>记录氢线后，这里会显示波长、里德伯常量和普朗克常量。</p>'}
          ${fitted?`<p data-hs-constants>${byLine.length===1?'单线估计':'多线拟合'}　R<sub>空气</sub> ≈ ${(fitted/1e7).toFixed(4)} × 10⁷ m⁻¹，R<sub>真空</sub> ≈ ${(fitted/1.00029/1e7).toFixed(4)} × 10⁷ m⁻¹，h ≈ ${(planck(fitted)*1e34).toFixed(3)} × 10⁻³⁴ J·s</p>`:''}`;
      }
      function refresh({inputs=true,recordsChanged=false}={}) {
        const light=observations(),seen=visibleLines(light);
        redrawGeometry(light,seen);
        redrawFinder(seen);
        if(inputs){
          q('[data-hs-angle]').value=angle.toFixed(4);
          q('[data-hs-sweep]').value=angle;
          q('[data-hs-incidence]').value=incidence;
        }
        q('[data-hs-density-wrap]').hidden=mode==='prism';
        q('[data-hs-order-wrap]').hidden=mode==='prism';
        q('[data-hs-side-wrap]').hidden=mode==='prism';
        q('[data-hs-prism-controls]').hidden=mode!=='prism';
        q('[data-hs-incidence-view]').textContent=incidence.toFixed(2)+'°';
        q('[data-hs-power]').textContent=on?'关闭光源':'开启光源';
        q('[data-hs-power]').setAttribute('aria-pressed',String(on));
        q('[data-hs-focus]').textContent=focused?'已调焦':'调焦至无穷远';
        q('[data-hs-align]').textContent=aligned?'已共轴等高':'共轴与等高';
        q('[data-hs-readout]').textContent=`${elements[mode]} · 双游标 ${readingText(getReadings(angle))} · ${reference()?'已存参考 '+readingText(reference()):'未记录参考方向'}`;
        q('[data-hs-note]').textContent=note;
        if(recordsChanged)redrawRecords();
      }
      function tell(message) {
        note=message;
        q('[data-hs-note]').textContent=note;
      }
      function power() {
        on=!on;
        tell(on?(aligned?'光路已对准。转到零级或直射方向。':'光源已亮。先调焦，再共轴。'):'光源关闭，角度记录仍保留。');
        refresh();
      }
      function focus() {
        focused=true;
        tell('望远镜已调焦。接着校正两管共轴和等高。');
        refresh();
      }
      function align() {
        if(!focused){tell('先调焦至无穷远，再做共轴与等高校正。');return;}
        aligned=true;
        tell('两管已共轴等高。转到零级或直射方向记录参考。');
        refresh();
      }
      function changeElement(next) {
        mode=next;
        pending=null;
        order=1;
        q('[data-hs-order]').value='1';
        angle=0;
        direct=mode==='prism';
        q('[data-hs-optic]').value=mode;
        updateLineSelect();
        tell(mode==='prism'?'先读无棱镜时的直射方向。装回棱镜后，跟踪折返点。':mode==='reflect'?
          '已换装反射式光栅。正反射方向在入射侧，先读参考方向。':'已换装透射光栅。继续用汞绿线左右一级标定。');
        refresh({recordsChanged:true});
      }
      function aim() {
        if(!on||!aligned){tell('开启灯管、调焦并共轴后，才能对准谱线。');return;}
        direct=false;
        const target=aimValue();
        if(target===null){
          tell('该谱线在当前配置没有可达的出射方向。降低级次或改变载物台角度，再试一次。');
          refresh();
          return;
        }
        angle=roundAngle(target);
        tell(mode==='prism'?'已辅助对准当前谱线。转动棱镜观察它的折返点。':'已辅助居中。核对谱线、级次和游标，再记录。');
        refresh();
      }
      function zeroPosition() {
        direct=mode==='prism';
        angle=0;
        tell(mode==='prism'?'暂移出棱镜。让直射狭缝像与十字丝重合，记下两只游标。':'已转到零级参考方向，可记录双游标。');
        refresh();
      }
      function setZero() {
        if(!on||!aligned){tell('需先开灯并对准光路。');return;}
        if(Math.abs(angle)>.07||mode==='prism'&&!direct){
          tell('先把零级或直射狭缝像移到十字丝上。');
          return;
        }
        if(mode==='reflect')zeroReflection=getReadings(angle);
        else zeroDirect=getReadings(angle);
        tell('已记下参考方向。透射光栅接着找左右一级；棱镜接着找谱线折返点。');
        refresh();
      }
      function record() {
        if(!on||!aligned){tell('开启光源并完成调焦与共轴后才能记录。');return;}
        if(!reference()){tell('先记录零级或直射参考方向。');return;}
        if(direct){tell('直射方向请用「记录参考方向」。测谱线时装回棱镜。');return;}
        const l=chosen();
        if(mode!=='prism'&&lamp==='mercury'&&l.id!=='hg546'){
          tell('基础光栅标定采用 546.1 nm 汞绿线。选择这条线再测左右一级。');
          return;
        }
        if(mode==='grating'&&lamp==='mercury'&&order!==1){
          tell('教材透射光栅标定取第一级。切换到一级重测。');
          return;
        }
        const trial=repeatCount(l,mode==='prism'?1:order)+1;
        const target=aimValue();
        if(target===null||Math.abs(target-angle)>.13){
          tell('当前谱线未对准十字丝。检查方向与级次，再转动望远镜到谱线中心。');
          return;
        }
        const pair=getReadings(angle);
        if(mode==='prism'){
          if(Math.abs(incidence-minIncidence(l.wave))>.45){
            tell('继续转棱镜，让谱线移动到折返处。此时再把望远镜对准并记录。');
            return;
          }
          const phi=mean(pair.map((value,i)=>shortArc(value,reference()[i])));
          records.push({context:context(),method:mode,line:l,trial,lamp,order:1,phi,
            reads:[['直射',reference()],['折返',pair]]});
          tell(`已记录${l.label}的最小偏向角。汞灯标定请选择另外的已知谱线。`);
        }else{
          const token=`${context()}|${lamp}|${l.id}|${order}`;
          if(pending?.token!==token)pending={token,pairs:{}};
          pending.pairs[side]=pair;
          if(!pending.pairs[-side]){
            tell(`已暂存${side<0?'左':'右'}侧读数。保持谱线和级次，换到另一侧再记录。`);
            return;
          }
          const left=pending.pairs[-1],right=pending.pairs[1];
          const phi=mean(left.map((value,i)=>shortArc(value,right[i])/2));
          records.push({context:context(),method:mode,line:l,trial,lamp,order,phi,
            reads:[['左',left],['右',right]]});
          pending=null;
          tell(`第 ${trial} 组${l.label}已记录。重新对准做下一组，或切换要测的谱线。`);
        }
        refresh({recordsChanged:true});
      }
        const listen=(selector,event,handler)=>q(selector).addEventListener(event,handler);
        const button=(name,handler)=>listen(`[data-hs-${name}]`,'click',handler);
        const change=(name,handler)=>listen(`[data-hs-${name}]`,'change',event=>handler(event.target.value));
        const input=(name,handler)=>listen(`[data-hs-${name}]`,'input',event=>handler(event.target));
        button('power',power);
        button('focus',focus);
        button('align',align);
        button('aim',aim);
        button('zero-position',zeroPosition);
        button('zero',setZero);
        button('record',record);
        button('clear',()=>{
          const selectedContext=context();
          for(let i=records.length-1;i>=0;i--)if(records[i].context===selectedContext)records.splice(i,1);
          pending=null;
          tell('当前配置的记录已清除，参考方向和其他配置的记录保留。');
          refresh({recordsChanged:true});
        });
        button('min',()=>{
          if(mode!=='prism')return;
          direct=false;
          incidence=minIncidence(chosen().wave);
          tell('已将载物台转到近似折返点。现在转动望远镜，使这条谱线与十字丝重合。');
          refresh();
        });
        function setAngle(next,updateInputs=true) {
          if(!Number.isFinite(next))return;
          angle=clamp(next,-87,87);
          refresh({inputs:updateInputs});
        }
        button('left',()=>setAngle(roundAngle(angle)-1/60));
        button('right',()=>setAngle(roundAngle(angle)+1/60));
        change('optic',changeElement);
        change('lamp',next=>{
          lamp=next;
          pending=null;
          updateLineSelect();
          tell(`已换用${lamps[lamp].label}。先确定待测谱线颜色，再转动望远镜。`);
          refresh();
        });
        change('density',next=>{
          density=Number(next);
          pending=null;
          tell('光栅刻线密度已改变。选汞绿线为新光栅标定，比较同级谱线间距。');
          refresh({recordsChanged:true});
        });
        change('side',next=>{side=Number(next);refresh();});
        change('order',next=>{order=Number(next);pending=null;refresh();});
        change('line',next=>{selected=next;pending=null;refresh();});
        input('slit',el=>{slit=Number(el.value);refresh({inputs:false});});
        input('angle',el=>{
          if(el.value.trim()==='')return;
          setAngle(Number(el.value),false);
          q('[data-hs-sweep]').value=angle;
        });
        change('angle',value=>setAngle(value.trim()===''?angle:Number(value)));
        input('sweep',el=>setAngle(Number(el.value)));
        input('incidence',el=>{
          direct=false;
          incidence=Number(el.value);
          refresh({inputs:false});
        });
        bindHits(host,{
          'hs-power':power,'hs-focus':focus,'hs-align':align,'hs-telescope':aim,
          'hs-optic':()=>{
            const choices=Object.keys(elements);
            changeElement(choices[(choices.indexOf(mode)+1)%choices.length]);
          },
        });
        let drag=null;
        drawing.addEventListener('pointerdown',event=>{
          if(!event.target.closest('[data-rig-hit="hs-telescope"]')||event.button!==0)return;
          drag={id:event.pointerId,x:event.clientX,angle,moved:false,scale:200/drawing.getBoundingClientRect().width};
        });
        drawing.addEventListener('pointermove',event=>{
          if(!drag||event.pointerId!==drag.id)return;
          const dx=event.clientX-drag.x;
          if(!drag.moved&&Math.abs(dx)<4)return;
          if(!drag.moved)drawing.setPointerCapture(event.pointerId);
          drag.moved=true;
          setAngle(drag.angle+dx*drag.scale);
        });
        for(const name of ['pointerup','pointercancel'])drawing.addEventListener(name,()=>{drag=null;});
        updateLineSelect();
        refresh({recordsChanged:true});
    },
  });
})();
</script>
<script>const experimentId = "26"; (function renderCourse(chapterName){
  const lesson=lessons.get(experimentId);
  const bench=benchRegistry.get(experimentId);
  if(!lesson||!bench)throw new Error('未找到实验数据');
  const root=document.getElementById('course');
  const article=document.createElement('article');
  const key=`lab-${experimentId}`;
  const sections=lesson.sections.map((section,n)=>({...section,id:`${key}-part-${n+1}`}));
  const pages=value=>/^\d/.test(value)?`第 ${value} 页`:value;
  article.id=key;
  article.className='lesson';
  article.setAttribute('aria-labelledby',`${key}-title`);
  article.innerHTML=`<header class="hero"><p class="kicker">${chapterName} · 实验 ${experimentId} · 教材 ${pages(lesson.pages)}</p><h1 id="${key}-title">${lesson.title}</h1><p class="lead">${lesson.summary}</p><p class="hint">页码按教材印刷页计。仪器画面和数值用于仿真练习。</p></header>
    <nav class="parts" aria-label="本节目录"><a href="#${key}-rig">仿真实验台</a>${sections.map(section=>`<a href="#${section.id}">${section.title}</a>`).join('')}</nav>
    <section class="rig-lab" id="${key}-rig"><div class="rig-head"><h2>${bench.title}</h2><p>${bench.intro}</p><p><strong>第一次操作</strong>　${bench.task}</p></div>
    <div class="rig-instrument"><div class="rig-bar"><strong>实验 ${experimentId} · 仪器台</strong><span>点图上的绿色标记，或用 Tab 找到部件，再按 Enter。</span></div><div class="iso rig-host"></div></div>
    <details class="rig-question"><summary>做完后，试着解释读数</summary><p>${bench.question.prompt}</p><div class="rig-choices"></div><p class="rig-feedback" aria-live="polite"></p></details></section>
    ${sections.map((section,n)=>`<section class="lesson-part" id="${section.id}"><div class="part-head"><h2>${section.title}</h2><span class="page-ref">${pages(section.pages)}</span>${n===0?`<a class="page-ref" href="#${key}-rig">前往仿真实验台 ↑</a>`:''}</div>${section.html}</section>`).join('')}`;
  root.append(article);
  lesson.mount?.(article);
  mountBench(article,bench);
  if(window===window.top){
    const nav=document.createElement('nav');
    nav.className='unit-return';
    nav.setAttribute('aria-label','网站目录');
    nav.innerHTML='<a href="../../index.html">← 实验站首页</a>';
    root.before(nav);
  }
  if(location.hash)requestAnimationFrame(()=>document.getElementById(location.hash.slice(1))?.scrollIntoView());
})("近代物理学实验");</script>
<script id="physlab-lesson-guide">(function mountLessonGuide(groups, partSteps) {
  const article = document.querySelector('.unit-content > .lesson');
  const nav = article?.querySelector(':scope > nav.parts');
  if (!nav) return;

  const desktop = matchMedia('(min-width: 900px)');
  function make(tag, className='', text='') {
    const element = document.createElement(tag);
    element.className = className;
    element.textContent = text;
    return element;
  }

  const rail = make('aside','lesson-rail');
  rail.setAttribute('aria-label','本节学习导引');
  const guide = make('details','lesson-guide');
  guide.open = desktop.matches;
  const summary = make('summary','','学习目录');
  const currentTitle = make('span','lesson-guide-current');
  currentTitle.setAttribute('aria-hidden','true');
  summary.append(currentTitle);
  nav.setAttribute('aria-label','本节学习目录');
  const workspace = make('div','lesson-workspace');
  const body = make('div','lesson-body');
  const lab = article.querySelector('.rig-lab');
  const lessonParts = Array.from(article.querySelectorAll('.lesson-part'));
  const quiz = article.querySelector('.rig-question');
  if (quiz) quiz.id ||= `${lab.id}-check`;

  const task = make('details','lesson-task');
  task.open = desktop.matches;
  const taskSummary = make('summary');
  const taskContent = make('div','lesson-task-content');
  const taskTitle = make('strong','lesson-task-title');
  const taskText = make('p','lesson-task-text');
  taskText.setAttribute('aria-live','polite');
  const pager = make('div','lesson-task-pager');
  const previous = make('button','','上一项');
  const next = make('button','','下一项');
  previous.type = next.type = 'button';
  pager.append(previous,next);
  taskContent.append(taskTitle,taskText,pager);
  task.append(taskSummary,taskContent);

  function sectionOf(target) {
    return target.startsWith('part:') ? lessonParts[Number(target.slice(5)) - 1] : target === 'quiz' ? quiz : lab;
  }

  function resolveTarget(step) {
    if (!step.usesBench) return step.topic || step.section;
    if (step.target === 'rig') return lab;
    return Array.from(lab.querySelectorAll(step.target)).find(element=>element.getClientRects().length) || lab;
  }

  nav.replaceChildren();
  const steps = [];
  for (const [index,[group, items]] of groups.entries()) {
    nav.append(make('p','lesson-guide-group',`${index + 1} · ${group}`));
    for (const [title,target,instructions] of items) {
      const index = steps.length;
      const number = String(index + 1).padStart(2,'0');
      const anchor = make('a');
      const hash = `#${article.id}-step-${number}`;
      anchor.href = hash;
      anchor.dataset.stepTarget = target;
      anchor.append(make('span','lesson-guide-number',number),make('span','lesson-guide-label',title));
      const node = make('section','lesson-reading-step');
      node.id = hash.slice(1);
      const heading = make('h2','lesson-reading-title',`${number} ${title}`);
      heading.tabIndex = -1;
      node.append(heading,make('p','lesson-reading-instructions',instructions));
      const section = sectionOf(target);
      const step = {title,target,instructions,index,number,hash,anchor,section,node,heading,usesBench:section===lab};
      steps.push(step);
      nav.append(anchor);
      anchor.addEventListener('click',event=>{
        if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
        event.preventDefault();
        go(step);
      });
    }
  }
  while (nav.nextSibling) body.append(nav.nextSibling);
  nav.before(workspace);
  guide.append(summary,nav);
  rail.append(guide,task);
  workspace.append(rail,body);
  article.parentElement.classList.add('unit-content-with-guide');

  const supplemental = Array.from(body.children).filter(child=>child!==lab && !lessonParts.includes(child));
  body.append(...steps.map(step=>step.node));
  for (const [index, part] of lessonParts.entries()) steps[partSteps[index]-1].node.append(part);

  function continueIn(stepNumber, nodes, className = 'lesson-part') {
    const step = steps[stepNumber - 1];
    const continuation = make('div',className);
    continuation.append(...nodes);
    step.node.append(continuation);
    step.topic = continuation;
  }

  // Some textbook sections cover multiple steps. Keep each original passage with its task.
  if (article.id === 'lab-1') {
    const subsections = lessonParts[3].querySelectorAll(':scope > h3');
    for (const [index, stepNumber] of [8,9,11].entries()) {
      const heading = subsections[index + 1];
      continueIn(stepNumber,[heading,heading.nextElementSibling]);
    }
  } else if (article.id === 'lab-5') {
    continueIn(10,[lessonParts[2].querySelector('[data-vsim] details:has([data-ct1])')],'lesson-part sim');
  } else if (article.id === 'lab-7') {
    const [,,drive,link,hint] = lessonParts[0].querySelectorAll(':scope > p, :scope > .formula');
    continueIn(9,[drive]);
    continueIn(10,[link,hint]);
  }

  const quizStep = steps.find(step=>step.target==='quiz');
  quizStep?.node.append(quiz);
  for (const node of supplemental) steps.at(-1).node.append(node);

  for (const step of steps) {
    if (step.usesBench) {
      step.benchSlot = make('div','lesson-bench-slot');
      step.openBench = make('button','lesson-open-bench','打开仿真实验台');
      step.openBench.type = 'button';
      step.node.append(step.openBench,step.benchSlot);
      step.openBench.addEventListener('click',()=>{
        moveBench(step);
        mark(step);
        scrollToTarget(resolveTarget(step),true);
      });
    } else if (!step.topic && step.target.startsWith('part:') && step.section?.parentElement!==step.node) {
      const link = make('a','lesson-related-part',step.section.querySelector('h2').textContent);
      link.href = `#${step.section.id}`;
      step.node.append(link);
      step.topic = link;
    }
  }

  let benchStep;
  function moveBench(step) {
    if (step===benchStep) return;
    if (benchStep) benchStep.openBench.textContent = '打开仿真实验台';
    // An instrument can serve multiple steps. Move its mounted node and keep its measurements.
    step.benchSlot.append(lab);
    step.openBench.textContent = '定位本步操作';
    benchStep = step;
  }

  moveBench(steps.find(step=>step.usesBench));

  let active;
  let targetHighlight;
  let heldScroll;
  function mark(step) {
    if (!step || step === active) return;
    active?.anchor.removeAttribute('aria-current');
    active = step;
    step.anchor.setAttribute('aria-current','step');
    currentTitle.textContent = `${step.number} ${step.title}`;
    taskSummary.textContent = `本步任务 ${step.index + 1}/${steps.length}`;
    taskTitle.textContent = step.title;
    taskText.textContent = step.instructions;
    previous.disabled = step.index === 0;
    next.disabled = step.index === steps.length - 1;
    if (guide.open) {
      const row = step.anchor.getBoundingClientRect();
      const list = nav.getBoundingClientRect();
      if (row.top < list.top) nav.scrollTop -= list.top - row.top + 4;
      if (row.bottom > list.bottom) nav.scrollTop += row.bottom - list.bottom + 4;
    }
  }

  function highlight(target, focus) {
    if (!target) return;
    targetHighlight?.classList.remove('lesson-step-target');
    targetHighlight = target;
    target.classList.add('lesson-step-target');
    if (focus) {
      if (!target.matches('a,button,input,select,textarea,summary,[tabindex]')) target.setAttribute('tabindex','-1');
      target.focus?.({preventScroll:true});
    }
  }

  function scrollToTarget(target, focus) {
    if (!target) return;
    if (target === quiz) quiz.open = true;
    if (focus) highlight(target,true);
    const offset = desktop.matches ? 44 : rail.getBoundingClientRect().height + 20;
    window.scrollTo({top:window.scrollY + target.getBoundingClientRect().top - offset,behavior:'instant'});
    heldScroll = window.scrollY;
  }

  function go(step, writeHistory=true) {
    if (!step) return;
    if (writeHistory && location.hash !== step.hash) history.pushState(null,'',step.hash);
    if (!desktop.matches) guide.open = false;
    mark(step);
    task.open = true;
    if (step.usesBench) moveBench(step);
    if (step.target === 'quiz') quiz.open = true;
    highlight(resolveTarget(step),false);
    if (writeHistory) step.heading.focus({preventScroll:true});
    scrollToTarget(step.node,false);
  }

  previous.addEventListener('click',()=>go(steps[active.index - 1]));
  next.addEventListener('click',()=>go(steps[active.index + 1]));
  guide.addEventListener('toggle',()=>{ if (!desktop.matches && guide.open) task.open = false; });
  task.addEventListener('toggle',()=>{ if (!desktop.matches && task.open) guide.open = false; });

  let scheduled = false;
  function track() {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(()=>{
      scheduled = false;
      if (heldScroll !== undefined && Math.abs(window.scrollY - heldScroll) < 12) return;
      heldScroll = undefined;
      const readingLine = desktop.matches ? 92 : rail.getBoundingClientRect().height + 24;
      const atEnd = window.scrollY > 0 && window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 2;
      mark(atEnd ? steps.at(-1) : steps.findLast(step=>step.node.getBoundingClientRect().top <= readingLine) || steps[0]);
    });
  }

  window.addEventListener('scroll',track,{passive:true});
  window.addEventListener('resize',track);
  desktop.addEventListener('change',()=>{guide.open = task.open = desktop.matches;track();});
  const followFragment = () => {
    const step = steps.find(item=>item.hash===location.hash);
    if (step) { go(step,false); return; }
    const target = document.getElementById(location.hash.slice(1));
    if (target === lab || target === quiz || lessonParts.includes(target)) {
      mark(steps.find(item=>item.node===target.closest('.lesson-reading-step')));
      scrollToTarget(target,false);
    }
  };
  window.addEventListener('hashchange',followFragment);
  mark(steps[0]);
  followFragment();
})([["先调好分光计",[["辨认狭缝、载物台与双游标","part:1","沿光路找到灯管、平行光管、色散元件和望远镜。先预测直指零级时是否能分开各种颜色。"],["点汞灯，调焦并校正共轴","[data-hs-setup-controls]","开低压汞灯，先调焦至无穷远，再校正共轴与等高。装上透射光栅，刻线平行狭缝。"],["找到零级并记下参考方向","[data-hs-zero-position]","转到零级，确认目镜亮线与十字丝重合，再点「记录参考方向」记下两只游标。"]]],["用汞绿线定光栅周期",[["在零级两侧找同一条绿色一级线","[data-hs-target-controls]","选汞绿线 546.1 nm 和一级。选左侧后转动望远镜使绿线居中并记录，再选右侧重做。比较两个角盘位置，跨零时沿短弧。"],["独立瞄准五组并平均周期","[data-hs-table]","重新瞄准第一级绿线读五组。对每只游标先求左右短弧半角，再取平均。计算 d＝λ/sin φ 并查看重复性。"]]],["换氢灯，测巴耳末谱线",[["分辨 Hα、Hβ 和 Hγ","[data-hs-eyepiece]","换氢灯。保留原光栅与零级参考。先找红色 Hα，再找蓝绿 Hβ、蓝紫 Hγ；同级中波长较长的谱线偏离零级更远。"],["每种颜色记录五对双游标读数","[data-hs-record]","按同一条谱线、同一级次左右配对，每条各做五组。弱紫线可作为补测。别把左右角差直接代入光栅公式。"],["由测得的波长求 R 和 h","[data-hs-result]","检查各颜色的波长与不确定度，核对 n₁＝3、4、5 到 n₂＝2 的跃迁。查看多线拟合所得 R，并比较空气修正前后的值和 h。"]]],["用三棱镜复测",[["记录直射角，跟踪谱线折返点","[data-hs-optic]","换装 60° 三棱镜并改用汞灯。先确认直射双游标，再装回棱镜转动载物台，跟踪一条汞线找最小偏向角。"],["由三条以上已知汞线拟合折射率","[data-hs-line]","依次用汞紫、蓝、绿、黄线记录折返点。每次在折返点还要把望远镜对准。用最小偏向角换算 n，再拟合教材的柯西公式。"],["用氢线反求波长并比较","[data-hs-result]","切回氢灯，测三条线各自的折返点。比较两种方法的波长。棱镜红线在参考汞谱范围之外，注意外推。"]]],["检查读数，延伸到反射光栅",[["比较反射光栅刻线密度与角分散","part:6","换到反射光栅，重新记录正反射参考。试着改变刻线密度，比较同一波长的角度，并思考支架遮挡和衍射极限。"],["确认左右读数差如何变成衍射角","quiz","先画出零级位置与左右同级谱线，给每一侧相对零级的转角作记号，再判断应怎样由两个读数算出一个 φ。"]]]],[1,6,4,8,9,12]);</script>
