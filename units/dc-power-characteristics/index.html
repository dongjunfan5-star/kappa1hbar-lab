    const terminal = current => cell - 9 * current - .056 * Math.log1p(current / .00012);
    let low = 0, high = cell / (9 + load);
    for (let step=0; step<56; step++) {
      const current = (low + high) / 2;
      if (terminal(current) > current * load) low=current;
      else high=current;
    }
    const i = (low + high) / 2;
    return {i,u:i*load};
  }

  registerBench('12',{
    title:'调电阻箱，让检流计归零',
    intro:'台面上有参考电源、数字表、电阻箱、指针检流计和待测电池盒。灯亮后调节电阻，观察表针怎样移动。',
    task:'先在标准支路找零点，记录 Rₛ。再切换未知支路，重新调到零点并记录 Rₓ。用电阻之比求开路电压。',
    question:{prompt:'补偿法测电池开路电压时，为什么要等检流计归零再读电阻箱？',choices:[
      {label:'此时比较电压等于电池端电压，待测支路基本没有电流',correct:true,feedback:'零差使检流计中没有可见电流，便可把测到的比较电压作为开路电压。标准和未知两次使用同一参考电流。'},
      {label:'归零表明参考主回路也没有电流',feedback:'主回路还要提供稳定比较电压。指针只反映比较支路中两个电压的差。'},
      {label:'归零表明电池内阻变成零',feedback:'内阻仍在。归零让流过待测电池的电流趋近零，从而减小内阻压降。'},
    ]},
    mount(host,{k,svgHit,bindHits,timeline}) {
      const width=660,height=330;
      const P=k.fitProjection([[-176,-84,-10],[176,72,0],[-176,72,-10],[176,-84,0],[-150,-55,62],[153,-50,54],[133,55,40]],width,height,{pad:23,azimuth:35,elevation:29});
      const project=point=>k.iso(point,P);
      const body=(data,tone='mid')=>k.solidSvg(data,{tone});
      const slab=(x,y,w,d,z,h,r=2,tone='mid')=>body(k.slabOf({x,y,w,d,r},z,h,P,6,.52),tone);
      const cylinder=(x,y,r,z,h,tone='hi')=>body(k.cylinder(x,y,r,z,h,P,26,.57),tone);
      const poly=(points,fill,stroke='none')=>`<path d="${k.pathOf(points.map(project),true)}" fill="${fill}" stroke="${stroke}" stroke-width=".65"/>`;
      const line=(points,tone='mid')=>k.lineSvg(k.pathOf(points.map(project),false),{tone});
      const surfaceText=(x,y,z,value,size=5)=>k.faceTextSvg(k.topMatrix([x,y],z,P,'x'),value,{tone:'mid',size});
      const label=(x,y,z,value,size=5,attr='')=>k.faceTextSvg(k.sideMatrix([x,y],z,P,'left'),value,{tone:'hi',size}).replace('<text',`<text ${attr}`);
      const panel=(x,y,z,w,h,fill)=>poly([[x,y,z],[x+w,y,z],[x+w,y,z-h],[x,y,z-h]],fill,'var(--anatomy-lo)');
      const disc=(x,y,z,r,tone='hi')=>body(k.disc(0,1.1,r,k.frameAlong([x,y,z],[0,1,0]),P),tone);
      const screw=(x,y,z)=>k.lineSvg(k.ring(x,y,1.8,z,P,18),{tone:'hi'})+line([[x-1.1,y,z],[x+1.1,y,z]],'lo');
      const button=(x,y,z,r=4)=>disc(x,y,z,r,'lo')+disc(x,y+1,z,r-1,'hi');
      const hit=(id,title,point,r=17)=>svgHit(id,title,...project(point),r);
      const cord=(points,color)=>{
        const path=k.pathOf(points.map(project),false);
        return `<path d="${path}" fill="none" stroke="var(--anatomy-shade-0)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/><path d="${path}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>`;
      };
      const row=(n,fn)=>Array.from({length:n},(_,i)=>fn(i)).join('');
      const footprint={x:-176,y:-84,w:352,d:156};
      const plate=k.corners(footprint,11).map(([x,y])=>cylinder(x,y,7,-10,4,'lo')).join('')+
        slab(footprint.x,footprint.y,footprint.w,footprint.d,-6,6,8,'lo')+
        k.corners(footprint,10).map(([x,y])=>screw(x,y,.25)).join('')+
        slab(-157,51,74,10,0,1,1,'mid')+surfaceText(-154,58,1.2,'COMPENSATION BENCH',3.5);

      const supply=slab(-150,-63,94,67,0,45,4,'hi')+slab(-148,-61,90,63,45,2,3,'mid')+
        row(12,i=>slab(-139+i*6,-51,1.2,20,47,.4,.35,'lo'))+
        panel(-143,4.2,40,52,19,'#142726')+label(-139,4.35,29,'3.000 V',7,'data-dc-svg-supply="" style="fill:#a9efce"')+
        label(-143,4.2,13,'POWER SUPPLY',4)+disc(-74,4.5,30,9,'lo')+disc(-74,5.6,30,7.2,'hi')+
        disc(-136,4.5,9,3)+disc(-124,4.5,9,3)+button(-72,4.5,11,5)+`<circle data-dc-svg-light cx="${project([-82,4.5,11])[0]}" cy="${project([-82,4.5,11])[1]}" r="3" fill="#667f83"/>`;

      const voltmeter=slab(-39,-62,76,65,0,50,5,'hi')+slab(-36,-58,70,56,50,1,3,'mid')+
        row(8,i=>slab(-24+i*6.3,-51,1.35,14,51,.4,.4,'lo'))+
        panel(-32,3.2,44,60,15,'#162927')+label(-28,3.3,34,'−',7,'data-dc-svg-meter="" style="fill:#a9efce"')+
        disc(-6,3.4,19,9,'lo')+disc(-6,4.6,19,6.8,'hi')+line([[-6,5.7,19],[-3,5.7,23]],'hi')+
        label(8,3.3,20,'DC',5)+row(3,i=>disc(-27+i*19,3.35,7,3.2,'lo'))+label(-26,3.3,2,'COM        V/Ω       mA',3.5);

      const box=slab(50,-62,109,68,0,38,4,'hi')+slab(53,-58,104,60,38,1.7,3,'mid')+
        surfaceText(61,-47,40.1,'RESISTANCE BOX',4.5)+
        row(4,i=>{
          const x=65+24*i;
          return cylinder(x,-17,7,40,2,'lo')+cylinder(x,-17,6,42,4,'hi')+
            line([[x,-17,46.2],[x+2.8,-19.8,46.2]],'hi')+surfaceText(x-6,-5,40,`×${10**(3-i)}`,3.4);
        })+panel(58,6.2,32,66,14,'#142726')+label(63,6.3,22,'12500 Ω',7,'data-dc-svg-box="" style="fill:#a9efce"')+
        row(2,i=>disc(135+i*12,6.4,21,3.2,'lo'))+label(63,6.2,11,'DECADE RESISTANCE',4.5);

      const wireBehind=cord([[-132,5,9],[-131,17,6],[-121,29,2],[-98,31,2],[-67,18,3],[-28,5,7]],'#b46f61')+
        cord([[8,4.5,7],[18,19,1],[43,23,1],[65,20,2],[135,7.5,21]],'#6e98a8')+
        cord([[147,7.5,21],[152,23,11],[140,37,2],[118,47,2],[103,55,12]],'#b46f61');
      const indicator=slab(-65,24,87,38,0,28,4,'hi')+slab(-63,27,82,31,28,1.5,3,'mid')+
        panel(-58,62.15,24,70,19,'#e1eaec')+label(-55,62.2,3.5,'CENTER ZERO  /  μA',4.1)+
        row(11,i=>{
          const x=-51+i*5.6;
          const z=16+3.5*Math.sin(Math.PI*i/10);
          return `<path d="${k.pathOf([[x,62.22,z],[x,62.22,z-2.1]].map(project),false)}" stroke="#35515d" stroke-width=".8"/>`;
        })+`<path data-dc-svg-needle fill="none" stroke="#bc563e" stroke-width="2.2" stroke-linecap="round"/>`+
        disc(-46,62.25,4,2.7,'lo')+disc(4,62.25,4,2.7,'lo')+screw(-58,32,29.75)+screw(13,51,29.75);
      const bat=slab(57,24,87,34,0,17,4,'mid')+slab(61,27,78,26,17,1.2,3,'hi')+
        surfaceText(66,39,18.5,'Ex  /  DRY CELL',5)+surfaceText(66,49,18.5,'S1 : Es / Ex',4)+
        disc(104,58.2,12,4,'lo')+disc(124,58.2,12,4,'mid')+cylinder(62,46,3.3,18,1.2,'hi')+
        `<g data-dc-svg-switch>${slab(63,44,13,4,19,3.8,1,'hi')}</g>`+screw(135,31,18.45);

      const art=k.figureSvg({width,height,label:'直流电源实验台。参考电源、数字万用表、电阻箱、中心零位检流计和干电池盒。',body:[plate,wireBehind,supply,voltmeter,box,indicator,bat,
        hit('dc-switch','参考电源开关：开或关',[-72,5.5,11]),
        hit('dc-adjust','电阻箱：增加一档',[110,-17,46],19),
        hit('dc-battery','拨动比较开关，选择标准或待测支路',[67,47,22],19),
        hit('dc-detector','读取检流计并保存',[-23,62,18],19),
      ]});

      host.innerHTML=`<style>
        .dc-dial { display:block; width:100%; max-width:600px; margin:8px 0; border:1px solid var(--line); border-radius:7px; background:var(--anatomy-card); }
        .dc-dial text { fill:var(--muted); font:11px system-ui,sans-serif; }
        .dc-dial path { fill:none; stroke:var(--line); }
        .dc-dial [data-dc-curve] { stroke:var(--accent); stroke-width:1.7; }
        .dc-dial circle { fill:var(--accent); }
        .dc-form input { inline-size:8em; }
      </style>
        <div class="rig-scene">${art}</div>
        <p class="rig-readout" data-dc-live></p>
        <div class="rig-tools dc-form">
          <button type="button" data-dc-power aria-pressed="false">打开参考电源</button>
          <label>测量接法 <select data-dc-mode><option value="compensation">补偿法测开路电压</option><option value="meter">量表头内阻</option><option value="load">负载与等效短路</option><option value="calibration">校准 2 V 表</option></select></label>
          <label data-dc-route>比较支路 <select data-dc-target><option value="standard">标准 Eₛ</option><option value="unknown">待测 Eₓ</option></select></label>
          <label data-dc-cal hidden>参考电压 / V <select data-dc-reference><option>0.5</option><option>1.0</option><option>1.5</option><option selected>2.0</option></select></label>
          <label><span data-dc-resistance-name>电阻箱阻值</span> / Ω <input type="number" inputmode="numeric" min="0" max="1000000" step="1" data-dc-resistance value="12000"></label>
          <button type="button" data-dc-down aria-label="电阻减小一档">−一档</button><button type="button" data-dc-up aria-label="电阻增加一档">＋一档</button>
          <button type="button" data-dc-record>记录读数</button>
        </div>
        <p class="hint" role="status" data-dc-note>打开参考电源，观察检流计的偏转方向。</p>
        <p class="reading" data-dc-result aria-live="polite">记录标准与待测支路的平衡电阻后计算。</p>
        <svg class="dc-dial" viewBox="0 0 420 151" data-dc-plot hidden role="img" aria-label="各次负载测量的电流与端电压关系">
          <path d="M45 13V122H400M45 13H400M45 67H400M222 13V122"/>
          <text x="6" y="17">1.6</text><text x="9" y="71">0.8</text><text x="20" y="126">0</text>
          <text x="85" y="17">端电压 / V</text><text x="318" y="142">电流 / mA</text>
          <text x="45" y="140">0</text><text x="210" y="140">85</text><text x="368" y="140">170</text>
          <path data-dc-curve/><g data-dc-points/>
        </svg>
        <div class="table-wrap"><table><caption>测量记录</caption><thead><tr><th scope="col">接法</th><th scope="col">阻值 / Ω</th><th scope="col">读数</th></tr></thead><tbody data-dc-rows></tbody></table></div>`;

      const by=name=>host.querySelector(`[data-dc-${name}]`);
      const states={compensation:{standard:12000,unknown:14800},meter:540,load:100,calibration:19350};
      const balanced={standard:null,unknown:null};
      const rows=[];
      const loadPoints=[];
      const meter=PhysLabNoise.createSampler();
      let power=false, mode='compensation', target='standard', angle=0, cancel=()=>{};
      const fixed=(value,digits=3)=>value.toFixed(digits);
      const resistance=()=>mode==='compensation'?states.compensation[target]:states[mode];
      const eLabel=()=>target==='standard'?'标准支路':'待测支路';
      const sourceVoltage=()=>Number(by('reference').value);
      function setResistance(value) {
        const next=Math.min(1e6,Math.max(0,Math.round(value)));
        if (mode==='compensation') states.compensation[target]=next;
        else states[mode]=next;
        by('resistance').value=String(next);
        draw();
      }
      function updateMode() {
        by('route').hidden=mode!=='compensation';
        by('cal').hidden=mode!=='calibration';
        by('plot').toggleAttribute('hidden',mode!=='load');
        by('resistance-name').textContent=mode==='load'?'负载电阻':mode==='calibration'?'串联电阻':'电阻箱阻值';
        by('resistance').value=String(resistance());
        draw();
      }
      function values() {
        const r=resistance();
        if (mode==='compensation') return {error:(target==='standard'?standard:cell)-comparisonCurrent*r,u:comparisonCurrent*r};
        if (mode==='meter') return {error:(meterResistance-r)*.000080,u:r*.000080};
        if (mode==='load') return loadedCircuit(r);
        const i=sourceVoltage()/(r+meterResistance);
        return {i,u:i/fullScale*2};
      }
      function observe(ideal) {
        if (mode==='compensation'||mode==='meter') return {
          error:meter.read(`${mode}-${target}-null`,ideal.error,.000025),
          u:meter.read(`${mode}-${target}-comparison`,ideal.u,.00012,{min:0})
        };
        const i=power?meter.read(`${mode}-current`,ideal.i,mode==='load'?.000025:.000000025,{min:0}):ideal.i;
        const u=mode==='load'?(resistance()===0?0:meter.read('load-voltage',ideal.u,.0016,{min:0})):i/fullScale*2;
        return {i,u};
      }
      function zeroResistance(error) {
        const voltagePerOhm=mode==='compensation'?comparisonCurrent:.000080;
        return Math.round((resistance()+error/voltagePerOhm)*10)/10;
      }
      function updateNeedle(next) {
        const drawAt=x=>{
          angle=x;
          const tip=[-23+22*x,62.33,19.5-4*x*x];
          by('svg-needle').setAttribute('d',k.pathOf([[-23,62.32,6.4],tip].map(project),false));
        };
        const from=angle;
        cancel();
        cancel=timeline(320,p=>drawAt(from+(next-from)*(1-(1-p)**3)));
      }
      function showPlot() {
        const mark=point=>[45+355*point.i/.170,122-109*point.u/1.6];
        const points=[...loadPoints].sort((a,b)=>a.i-b.i).map(mark);
        by('curve').setAttribute('d',points.map(([x,y],i)=>`${i?'L':'M'}${x} ${y}`).join(' '));
        by('points').innerHTML=points.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3"/>`).join('');
      }
      function draw(result=observe(values())) {
        const r=resistance();
        const nullMode=mode==='compensation'||mode==='meter';
        const errorMilliVolts=nullMode?1000*result.error:0;
        by('power').setAttribute('aria-pressed',String(power));
        by('power').textContent=power?'关闭参考电源':'打开参考电源';
        by('svg-light').setAttribute('fill',power?'#a9efce':'#667f83');
        by('svg-supply').textContent=power?'3.000 V':'OFF';
        by('svg-box').textContent=`${r} Ω`;
        by('svg-switch').setAttribute('opacity',target==='standard'?'1':'.45');
        by('svg-meter').textContent=power?(nullMode?`${fixed(errorMilliVolts,1)} mV`:`${fixed(result.u)} V`):'—';
        updateNeedle(power?(nullMode?Math.max(-1,Math.min(1,errorMilliVolts/60)):Math.min(1,result.i/(mode==='load'?.17:fullScale))):0);
        const nearZero=nullMode&&Math.abs(errorMilliVolts)<=.051;
        by('live').innerHTML=!power?'电源待开启':nullMode?`<strong>${nearZero?'检流计指零':`检流计${errorMilliVolts>0?'正':'负'}偏转`}</strong>　电压差 ${fixed(errorMilliVolts,2)} mV　比较电压 ${fixed(result.u,4)} V${nearZero?`　示零电阻 ${fixed(zeroResistance(result.error),1)} Ω`:''}`:
          mode==='load'?`<strong>U = ${fixed(result.u)} V</strong>　I = ${fixed(1000*result.i,2)} mA　Rₗ = ${r} Ω`:
            `<strong>实际输入 ${fixed(sourceVoltage(),2)} V</strong>　表头 ${fixed(result.i*1e6,2)} μA　换算指示 ${fixed(result.u)} V`;
      }
      function addRow(name,statement,readingResistance=resistance()) {
        const cells=[name,readingResistance,statement].map(value=>{const td=document.createElement('td');td.textContent=String(value);return td;});
        const tr=document.createElement('tr');
        tr.append(...cells);
        rows.push(tr);
        if(rows.length>32) rows.shift();
        by('rows').replaceChildren(...rows);
      }
      function record() {
        if (!power) { by('note').textContent='先把参考电源打开。'; return; }
        const ideal=values();
        const reading=observe(ideal);
        const {i,u,error}=reading;
        const r=resistance();
        if ((mode==='compensation'||mode==='meter')&&Math.abs(error)>.000051) {
          by('note').textContent=`还未示零。指针偏${error>0?'正，增加':'负，减小'}电阻箱阻值，再试一次。`;
          return;
        }
        if (mode==='compensation') {
          const measured=zeroResistance(error);
          balanced[target]=measured;
          addRow(eLabel(),'示零',fixed(measured,1));
          by('result').textContent=balanced.standard!==null&&balanced.unknown!==null?
            `Eₓ = ${fixed(standard*balanced.unknown/balanced.standard)} V　（Eₛ × Rₓ / Rₛ）`:`已记 ${eLabel()}的平衡阻值 ${fixed(measured,1)} Ω，再量另一支路。`;
        } else if (mode==='meter') {
          const measured=zeroResistance(error);
          addRow('表头内阻','示零',fixed(measured,1));
          by('result').textContent=`Rᵍ = ${fixed(measured,1)} Ω　改装成 2.00 V 档需要串联 ${Math.round(2/fullScale-measured)} Ω。`;
        } else if (mode==='load') {
          addRow('负载',`${fixed(u)} V；${fixed(i*1000,2)} mA`);
          loadPoints.push({i,u});
          showPlot();
          by('result').textContent=r===0?`等效短路电流 Iₛc = ${fixed(i*1000,2)} mA`:`已记录 Rₗ = ${r} Ω，U = ${fixed(u)} V，I = ${fixed(i*1000,2)} mA。`;
        } else {
          if(ideal.i>fullScale+.00000001) { by('note').textContent='表头超过满偏电流。请增大串联阻值或降低参考输入。'; return; }
          addRow('校准',`${fixed(sourceVoltage(),2)} V 标准；${fixed(u)} V 指示`);
          by('result').textContent=`指示偏差（指示−标准） = ${fixed(1000*(u-sourceVoltage()),2)} mV。`;
        }
        draw(reading);
        meter.reset();
        by('note').textContent='这次读数已写入记录。';
      }
      function switchTarget() {
        if(mode!=='compensation') { by('note').textContent='切到补偿法后可以拨动比较开关。'; return; }
        target=target==='standard'?'unknown':'standard';
        by('target').value=target;
        updateMode();
      }
      function powerSwitch() { power=!power; meter.reset(); draw(); }
      const increment=direction=>setResistance(resistance()+direction*(mode==='compensation'?10:mode==='load'?20:5));
      by('power').addEventListener('click',powerSwitch);
      by('mode').addEventListener('change',event=>{
        mode=event.target.value;
        by('result').textContent='完成当前测量以取得结果。';
        updateMode();
      });
      by('target').addEventListener('change',event=>{ target=event.target.value; updateMode(); });
      by('reference').addEventListener('change',()=>draw());
      by('resistance').addEventListener('input',event=>{
        const value=event.target.valueAsNumber;
        if(Number.isFinite(value)&&value>=0&&value<=1e6){
          if(mode==='compensation') states.compensation[target]=value;
          else states[mode]=value;
          draw();
        }
      });
      by('resistance').addEventListener('change',()=>setResistance(resistance()));
      by('up').addEventListener('click',()=>increment(1));
      by('down').addEventListener('click',()=>increment(-1));
      by('record').addEventListener('click',record);
      bindHits(host,{'dc-switch':powerSwitch,'dc-adjust':()=>increment(1),'dc-battery':switchTarget,'dc-detector':record});
      updateMode();
    },
  });
})();
</script>
<script>const experimentId = "12"; (function renderCourse(chapterName){
  const lesson=lessons.get(experimentId);
  const bench=benchRegistry.get(experimentId);
  if(!lesson||!bench)throw new Error('未找到实验数据');
  const root=document.getElementById('course');
  const article=document.createElement('article');
  const key=`lab-${experimentId}`;
  const sections=lesson.sections.map((section,n)=>({...section,id:`${key}-part-${n+1}`}));
  const pages=value=>/^\d/.test(value)?`第 ${value} 页`:value;
  article.id=key;
  article.className='lesson';
  article.setAttribute('aria-labelledby',`${key}-title`);
  article.innerHTML=`<header class="hero"><p class="kicker">${chapterName} · 实验 ${experimentId} · 教材 ${pages(lesson.pages)}</p><h1 id="${key}-title">${lesson.title}</h1><p class="lead">${lesson.summary}</p><p class="hint">页码按教材印刷页计。仪器画面和数值用于仿真练习。</p></header>
    <nav class="parts" aria-label="本节目录"><a href="#${key}-rig">仿真实验台</a>${sections.map(section=>`<a href="#${section.id}">${section.title}</a>`).join('')}</nav>
    <section class="rig-lab" id="${key}-rig"><div class="rig-head"><h2>${bench.title}</h2><p>${bench.intro}</p><p><strong>第一次操作</strong>　${bench.task}</p></div>
    <div class="rig-instrument"><div class="rig-bar"><strong>实验 ${experimentId} · 仪器台</strong><span>点图上的绿色标记，或用 Tab 找到部件，再按 Enter。</span></div><div class="iso rig-host"></div></div>
    <details class="rig-question"><summary>做完后，试着解释读数</summary><p>${bench.question.prompt}</p><div class="rig-choices"></div><p class="rig-feedback" aria-live="polite"></p></details></section>
    ${sections.map((section,n)=>`<section class="lesson-part" id="${section.id}"><div class="part-head"><h2>${section.title}</h2><span class="page-ref">${pages(section.pages)}</span>${n===0?`<a class="page-ref" href="#${key}-rig">前往仿真实验台 ↑</a>`:''}</div>${section.html}</section>`).join('')}`;
  root.append(article);
  lesson.mount?.(article);
  mountBench(article,bench);
  if(window===window.top){
    const nav=document.createElement('nav');
    nav.className='unit-return';
    nav.setAttribute('aria-label','网站目录');
    nav.innerHTML='<a href="../../index.html">← 实验站首页</a>';
    root.before(nav);
  }
  if(location.hash)requestAnimationFrame(()=>document.getElementById(location.hash.slice(1))?.scrollIntoView());
})("电磁学");</script>
<script id="physlab-lesson-guide">(function mountLessonGuide(groups, partSteps) {
  const article = document.querySelector('.unit-content > .lesson');
  const nav = article?.querySelector(':scope > nav.parts');
  if (!nav) return;

  const desktop = matchMedia('(min-width: 900px)');
  function make(tag, className='', text='') {
    const element = document.createElement(tag);
    element.className = className;
    element.textContent = text;
    return element;
  }

  const rail = make('aside','lesson-rail');
  rail.setAttribute('aria-label','本节学习导引');
  const guide = make('details','lesson-guide');
  guide.open = desktop.matches;
  const summary = make('summary','','学习目录');
  const currentTitle = make('span','lesson-guide-current');
  currentTitle.setAttribute('aria-hidden','true');
  summary.append(currentTitle);
  nav.setAttribute('aria-label','本节学习目录');
  const workspace = make('div','lesson-workspace');
  const body = make('div','lesson-body');
  const lab = article.querySelector('.rig-lab');
  const lessonParts = Array.from(article.querySelectorAll('.lesson-part'));
  const quiz = article.querySelector('.rig-question');
  if (quiz) quiz.id ||= `${lab.id}-check`;

  const task = make('details','lesson-task');
  task.open = desktop.matches;
  const taskSummary = make('summary');
  const taskContent = make('div','lesson-task-content');
  const taskTitle = make('strong','lesson-task-title');
  const taskText = make('p','lesson-task-text');
  taskText.setAttribute('aria-live','polite');
  const pager = make('div','lesson-task-pager');
  const previous = make('button','','上一项');
  const next = make('button','','下一项');
  previous.type = next.type = 'button';
  pager.append(previous,next);
  taskContent.append(taskTitle,taskText,pager);
  task.append(taskSummary,taskContent);

  function sectionOf(target) {
    return target.startsWith('part:') ? lessonParts[Number(target.slice(5)) - 1] : target === 'quiz' ? quiz : lab;
  }

  function resolveTarget(step) {
    if (!step.usesBench) return step.topic || step.section;
    if (step.target === 'rig') return lab;
    return Array.from(lab.querySelectorAll(step.target)).find(element=>element.getClientRects().length) || lab;
  }

  nav.replaceChildren();
  const steps = [];
  for (const [index,[group, items]] of groups.entries()) {
    nav.append(make('p','lesson-guide-group',`${index + 1} · ${group}`));
    for (const [title,target,instructions] of items) {
      const index = steps.length;
      const number = String(index + 1).padStart(2,'0');
      const anchor = make('a');
      const hash = `#${article.id}-step-${number}`;
      anchor.href = hash;
      anchor.dataset.stepTarget = target;
      anchor.append(make('span','lesson-guide-number',number),make('span','lesson-guide-label',title));
      const node = make('section','lesson-reading-step');
      node.id = hash.slice(1);
      const heading = make('h2','lesson-reading-title',`${number} ${title}`);
      heading.tabIndex = -1;
      node.append(heading,make('p','lesson-reading-instructions',instructions));
      const section = sectionOf(target);
      const step = {title,target,instructions,index,number,hash,anchor,section,node,heading,usesBench:section===lab};
      steps.push(step);
      nav.append(anchor);
      anchor.addEventListener('click',event=>{
        if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
        event.preventDefault();
        go(step);
      });
    }
  }
  while (nav.nextSibling) body.append(nav.nextSibling);
  nav.before(workspace);
  guide.append(summary,nav);
  rail.append(guide,task);
  workspace.append(rail,body);
  article.parentElement.classList.add('unit-content-with-guide');

  const supplemental = Array.from(body.children).filter(child=>child!==lab && !lessonParts.includes(child));
  body.append(...steps.map(step=>step.node));
  for (const [index, part] of lessonParts.entries()) steps[partSteps[index]-1].node.append(part);

  function continueIn(stepNumber, nodes, className = 'lesson-part') {
    const step = steps[stepNumber - 1];
    const continuation = make('div',className);
    continuation.append(...nodes);
    step.node.append(continuation);
    step.topic = continuation;
  }

  // Some textbook sections cover multiple steps. Keep each original passage with its task.
  if (article.id === 'lab-1') {
    const subsections = lessonParts[3].querySelectorAll(':scope > h3');
    for (const [index, stepNumber] of [8,9,11].entries()) {
      const heading = subsections[index + 1];
      continueIn(stepNumber,[heading,heading.nextElementSibling]);
    }
  } else if (article.id === 'lab-5') {
    continueIn(10,[lessonParts[2].querySelector('[data-vsim] details:has([data-ct1])')],'lesson-part sim');
  } else if (article.id === 'lab-7') {
    const [,,drive,link,hint] = lessonParts[0].querySelectorAll(':scope > p, :scope > .formula');
    continueIn(9,[drive]);
    continueIn(10,[link,hint]);
  }

  const quizStep = steps.find(step=>step.target==='quiz');
  quizStep?.node.append(quiz);
  for (const node of supplemental) steps.at(-1).node.append(node);

  for (const step of steps) {
    if (step.usesBench) {
      step.benchSlot = make('div','lesson-bench-slot');
      step.openBench = make('button','lesson-open-bench','打开仿真实验台');
      step.openBench.type = 'button';
      step.node.append(step.openBench,step.benchSlot);
      step.openBench.addEventListener('click',()=>{
        moveBench(step);
        mark(step);
        scrollToTarget(resolveTarget(step),true);
      });
    } else if (!step.topic && step.target.startsWith('part:') && step.section?.parentElement!==step.node) {
      const link = make('a','lesson-related-part',step.section.querySelector('h2').textContent);
      link.href = `#${step.section.id}`;
      step.node.append(link);
      step.topic = link;
    }
  }

  let benchStep;
  function moveBench(step) {
    if (step===benchStep) return;
    if (benchStep) benchStep.openBench.textContent = '打开仿真实验台';
    // An instrument can serve multiple steps. Move its mounted node and keep its measurements.
    step.benchSlot.append(lab);
    step.openBench.textContent = '定位本步操作';
    benchStep = step;
  }

  moveBench(steps.find(step=>step.usesBench));

  let active;
  let targetHighlight;
  let heldScroll;
  function mark(step) {
    if (!step || step === active) return;
    active?.anchor.removeAttribute('aria-current');
    active = step;
    step.anchor.setAttribute('aria-current','step');
    currentTitle.textContent = `${step.number} ${step.title}`;
    taskSummary.textContent = `本步任务 ${step.index + 1}/${steps.length}`;
    taskTitle.textContent = step.title;
    taskText.textContent = step.instructions;
    previous.disabled = step.index === 0;
    next.disabled = step.index === steps.length - 1;
    if (guide.open) {
      const row = step.anchor.getBoundingClientRect();
      const list = nav.getBoundingClientRect();
      if (row.top < list.top) nav.scrollTop -= list.top - row.top + 4;
      if (row.bottom > list.bottom) nav.scrollTop += row.bottom - list.bottom + 4;
    }
  }

  function highlight(target, focus) {
    if (!target) return;
    targetHighlight?.classList.remove('lesson-step-target');
    targetHighlight = target;
    target.classList.add('lesson-step-target');
    if (focus) {
      if (!target.matches('a,button,input,select,textarea,summary,[tabindex]')) target.setAttribute('tabindex','-1');
      target.focus?.({preventScroll:true});
    }
  }

  function scrollToTarget(target, focus) {
    if (!target) return;
    if (target === quiz) quiz.open = true;
    if (focus) highlight(target,true);
    const offset = desktop.matches ? 44 : rail.getBoundingClientRect().height + 20;
    window.scrollTo({top:window.scrollY + target.getBoundingClientRect().top - offset,behavior:'instant'});
    heldScroll = window.scrollY;
  }

  function go(step, writeHistory=true) {
    if (!step) return;
    if (writeHistory && location.hash !== step.hash) history.pushState(null,'',step.hash);
    if (!desktop.matches) guide.open = false;
    mark(step);
    task.open = true;
    if (step.usesBench) moveBench(step);
    if (step.target === 'quiz') quiz.open = true;
    highlight(resolveTarget(step),false);
    if (writeHistory) step.heading.focus({preventScroll:true});
    scrollToTarget(step.node,false);
  }

  previous.addEventListener('click',()=>go(steps[active.index - 1]));
  next.addEventListener('click',()=>go(steps[active.index + 1]));
  guide.addEventListener('toggle',()=>{ if (!desktop.matches && guide.open) task.open = false; });
  task.addEventListener('toggle',()=>{ if (!desktop.matches && task.open) guide.open = false; });

  let scheduled = false;
  function track() {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(()=>{
      scheduled = false;
      if (heldScroll !== undefined && Math.abs(window.scrollY - heldScroll) < 12) return;
      heldScroll = undefined;
      const readingLine = desktop.matches ? 92 : rail.getBoundingClientRect().height + 24;
      const atEnd = window.scrollY > 0 && window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 2;
      mark(atEnd ? steps.at(-1) : steps.findLast(step=>step.node.getBoundingClientRect().top <= readingLine) || steps[0]);
    });
  }

  window.addEventListener('scroll',track,{passive:true});
  window.addEventListener('resize',track);
  desktop.addEventListener('change',()=>{guide.open = task.open = desktop.matches;track();});
  const followFragment = () => {
    const step = steps.find(item=>item.hash===location.hash);
    if (step) { go(step,false); return; }
    const target = document.getElementById(location.hash.slice(1));
    if (target === lab || target === quiz || lessonParts.includes(target)) {
      mark(steps.find(item=>item.node===target.closest('.lesson-reading-step')));
      scrollToTarget(target,false);
    }
  };
  window.addEventListener('hashchange',followFragment);
  mark(steps[0]);
  followFragment();
})([["辨认电源与表头",[["区分电池、检流计与微安表","part:1","先辨认待测电池盒、参考供电盒和电阻箱。检流计用来找零差，100 μA 表头用来读电流。"],["认清制流与分压的接线","part:3","对照图 12-6、12-7 找到滑片 C。制流串入电阻，分压从 B、C 取输出。合闸前先把输出调小。"]]],["测表头内阻，改装 2 V 档",[["给表头内阻测量供电","[data-dc-power]","打开参考电源，把测量接法切到「量表头内阻」。观察比较支路的偏转和电压差。"],["调电阻箱至零并记录内阻","[data-dc-resistance]","调整电阻箱，使检流计从两侧逼近零位，按「记录读数」。读出 Rᵍ，计算改装到 2.00 V 所需的串联电阻。"]]],["用补偿法测开路电压",[["找标准支路的平衡点","[data-dc-target]","切回「补偿法测开路电压」，在「标准 Eₛ」支路调箱值，指零后记录 Rₛ。"],["切换待测支路重找零点","[data-dc-record]","保持参考主回路条件，切到「待测 Eₓ」，再次调到零并记录 Rₓ。两次比较共用同一个参考电流。"],["用两次平衡阻值求电动势","[data-dc-result]","在读数区核对 Eₓ＝EₛRₓ/Rₛ。解释检流计指零时为何可以近似得到电池的开路电压。"]]],["观察负载，再检验改装表",[["多档负载描出 U–I 曲线","[data-dc-mode]","切到「负载与等效短路」，改变负载电阻并记录相应的端电压和电流。观察串联二极管怎样影响曲线形状。"],["读仿真的等效短路电流","[data-dc-resistance]","在负载模式把设定值逐渐减小，最后调到 0 Ω 并记录等效短路电流。对照已测的非零负载点。"],["校准满度并核查中间点","[data-dc-mode]","切到「校准 2 V 表」。先用 2.0 V 调串联电阻到满偏，再换几个较低标准电压，记录换算示值和偏差。"],["判断补偿法为何要归零再读","quiz","比较检流计偏转和归零时待测支路中的电流。想一想有电流通过电池时，电池内阻如何影响端电压。"]]]],[1,3,2,5,8,11]);</script>
