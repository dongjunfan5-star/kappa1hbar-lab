        <h3>五、失重时改测惯性</h3>
        <div class="formula">T<sub>0</sub>=2π√(m<sub>0</sub>/k)，T=2π√(m/k) → m=m<sub>0</sub>(T/T<sub>0</sub>)²</div>
        <p>在水平气垫导轨上，用同一弹簧系统分别测已知质量和未知质量的周期；测多个完整周期再除以次数。m、m<sub>0</sub>须包含共同运动的滑块及附件。如果目标是附加物质量，要先得到总振动质量再扣除滑块基准质量；弹簧有效质量不可忽略时也要校准。</p>
        <div class="formula">½kx<sub>1</sub>²+½mv<sub>1</sub>²=½kx<sub>2</sub>²+½mv<sub>2</sub>²<br>m=k(x<sub>1</sub>²−x<sub>2</sub>²)/(v<sub>2</sub>²−v<sub>1</sub>²)</div>
        <p>x从弹簧平衡位置量起。教材第74页式(1-7)的印刷式漏了k；这里按式(1-6)的能量守恒式补回，量纲才是质量。应选择位置平方和速度平方差明显不同的两点，避免小差值放大误差。</p>`},
      {title:'交互练习：气泡如何影响称衡结果',pages:'74–76',html:`
        <p>这是理想流体静力称衡模型，质量和体积为教学设定。调整样品，再给表面增加气泡；读取空气中质量和浸液表观质量，比较真实密度与按无气泡公式计算的密度。</p>
        <div class="sim"><div class="sim-controls">
          <label>样品质量 / g <input data-role="ma" type="range" min="50" max="250" value="120" step="1"><output data-role="mao"></output></label>
          <label>真实密度 / (g/cm³) <input data-role="rho" type="range" min="2" max="10" value="7.8" step="0.1"><output data-role="rhoo"></output></label>
          <label>附着气泡体积 / cm³ <input data-role="bubble" type="range" min="0" max="5" value="0" step="0.1"><output data-role="bo"></output></label>
          <label>参照水温 <select data-role="temp"><option value="0.999727">10 °C</option><option value="0.998229" selected>20 °C</option><option value="0.995672">30 °C</option></select></label>
        </div><svg data-role="mass-svg" role="img" aria-label="空气中与完全浸液后的示值比较" style="width:100%;height:245px"></svg>
        <p class="reading" data-role="mass-reading" aria-live="polite"></p><button data-role="clean" type="button">排除气泡再称</button>
        <p class="hint">气泡质量忽略，只增加排液体积。图示为物体由外部称力装置悬挂，容器独立支承；没有模拟空气浮力、细线浮力或表面张力。</p></div>
        <details><summary>另一个操作：用周期比测未知质量</summary><p>保持弹簧不变。已知系统总质量m₀=200.0 g、周期T₀=1.000 s；把未知系统周期输入下方。</p><div class="sim-controls"><label>T / s <input data-role="period" type="number" min="0.1" max="5" step="0.001" value="1.200"></label></div><p data-role="period-reading" class="reading" aria-live="polite"></p></details>`},
      {title:'操作与记录：全部层级',pages:'75–76',html:`
        <h3>基础：称量与金属圆柱密度</h3><ol>
        <li>调天平水平，按仪器要求预热和校准，检查空盘零点。称量前把样品和容器清洁、干燥并与环境温度接近。</li>
        <li>必要时放容器去皮；样品居中，关玻璃门，等示值稳定再读。取下后检查能否回零，记录分度值，保留原始读数。</li>
        <li>用卡尺测圆柱直径与高度，多方向、多位置重复；由几何体积求ρ及不确定度。</li>
        <li>用静力称衡法重测同一圆柱：记录空气中质量、完全浸没示值或排液反力示值、水温及ρ₀；去气泡，不触底壁，求ρ及不确定度，与几何法比较。</li></ol>
        <h3>提升：小块固体与浮在水上的石蜡</h3>
        <p>用比重瓶称m₀、m₁、m₂、m₃，测小块固体（教材例为锌粒），计算密度与不确定度。石蜡密度小于水，需用沉子辅助完全浸没：分别测沉子单独浸没及沉子带石蜡浸没的浮力，作差得到石蜡排液质量；扣除沉子和细线影响，再用石蜡自身质量求密度。也可选密度更小、且不溶解石蜡的适当参照液体，但必须核对相容性。</p>
        <h3>进阶：两种方法测液体</h3>
        <p>对酒精或甘油等，用同一沉体比较参照液体与未知液体的排液质量，或用同一比重瓶比较相同体积液体的净质量。控制温度、挥发、附着液滴和气泡；报告密度及不确定度，比较两种方法的适用条件。</p>
        <h3>高阶：动力学、能量与天体质量</h3>
        <p>在调平的气垫导轨上测已知/未知总质量的弹簧周期，保持同一弹簧和小振幅，设计重复测量与误差分析；也可预先标定k，再测两个位置及速度，按能量差求质量。它们演示如何不靠静态称重测惯性质量，并不要求地面装置真正消除引力。</p>
        <p>教材还要求查阅系外行星或超大质量黑洞质量的间接测量方案。可从“测到什么 → 使用什么动力学模型 → 哪些条件未知”写短报告：例如已知中央天体质量时由伴星轨道求动力学约束，或由绕中心运动的可见天体轨道估计中心质量。只用亮度推质量通常还需辐射/吸积模型，不能把亮度当成质量的直接读数。</p>
        <div class="table-wrap"><table><thead><tr><th>方法</th><th>原始记录</th><th>共同条件</th></tr></thead><tbody><tr><td>圆柱几何</td><td>m；各次D、H及零点；仪器分度</td><td>均匀性、有效几何体积</td></tr><tr><td>静力称衡</td><td>m、m浸或b；液温、ρ₀</td><td>完全浸没、无气泡、不接触容器</td></tr><tr><td>比重瓶</td><td>m₀、m₁、m₂、m₃</td><td>同温、同体积、瓶外干燥</td></tr><tr><td>周期法</td><td>基准总质量；N周期总时间；T₀、T</td><td>同一弹簧/附件、小振幅</td></tr><tr><td>能量法</td><td>k、x₁、x₂、v₁、v₂</td><td>平衡点一致、耗散可忽略</td></tr></tbody></table></div>`},
      {title:'数据处理、误差与水密度表',pages:'74–77',html:`
        <p><strong>教学例：</strong>圆柱m=169.60 g、D=2.000 cm、H=3.000 cm，则V=9.4248 cm³，ρ≈17.995 g/cm³。若同温ρ₀=0.998229 g/cm³、排液等效质量b=9.4081 g，静力法也得到约17.995 g/cm³。它们是为了展示运算而构造的数据，不是教材材料的实测密度。</p>
        <p>比重瓶例：空瓶25.000 g、瓶加固体35.000 g、瓶加固体和水82.000 g、满水瓶75.000 g。固体质量10.000 g，排水质量3.000 g，ρ=(10/3)×0.998229≈3.3274 g/cm³。分母不是“瓶中剩余水的质量”。</p>
        <p>几何法在各输入独立、小误差条件下：u(ρ)/ρ≈√[(u(m)/m)²+(2u(D)/D)²+(u(H)/H)²]，直径的相对误差被放大两倍。静力法若把m和排液质量b视为独立输入，u(ρ)/ρ≈√[(u(m)/m)²+(u(b)/b)²+(u(ρ₀)/ρ₀)²]；若b=m−m浸，m在分子、分母重复出现，严格传播时应从原始读数求偏导并处理相关性。</p>
        <p>主要误差：未校准或未调平、气流和温差、读数漂移、圆柱不规则、悬线/沉子的附加浮力、样品触底壁、附着气泡、液体温度或浓度变化、比重瓶未达同体积、液滴/蒸发。多次读数取平均能减小随机分散，不能消除这些系统偏差。</p>
        ${qa('教材附录：不同温度纯水密度表（第76—77页）',`<p>按教材表1-1转录，ρ₀单位g/cm³。实际温度t=t₁+t₂：先选列t₁，再选行t₂。例如23 °C读20列、3.0行，得0.997563 g/cm³。表内相邻值可在要求允许时作插值；报告注明温度与所用数据来源。</p><div class="table-wrap"><table><thead><tr><th>t₂ / °C</th><th>t₁=0 °C</th><th>10 °C</th><th>20 °C</th><th>30 °C</th></tr></thead><tbody>${waterRows.map(r=>`<tr><td>${r[0].toFixed(1)}</td>${r.slice(1).map(v=>`<td>${v.toFixed(6)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`)}
        <p class="hint">本实验正文在第76页结束，纯水密度续表位于第77页上部；第77页下部才进入实验2。教材要求计算不确定度，但未给本实验统一的置信水平或固定重复次数，应按课程要求选择。</p>`},
      {title:'全部思考题与解析',pages:'76',html:`
        ${qa('预习1：引力质量和惯性质量有什么关系？','<p>前者出现在引力定律，后者出现在F=ma。它们概念和测量路径不同，实验表明成正比；统一单位后数值相等。失重是失去通常的支持力读数，并不是惯性质量消失。</p>')}
        ${qa('预习2：如何自制秤？试举例说明。','<p>可做等臂天平，以已知砝码平衡未知物；或做弹簧秤，用已知质量标定伸长与示值。前者比较同一地点的重力，后者依赖弹性标定和当地g。制作后要检查零点、量程、重复性，不能只画刻度。</p>')}
        ${qa('预习3：如何用流体静力称衡法测量物体密度？','<p>测空气中质量m，完全浸入密度已知的液体，测表观质量差b，即排开液体的质量；ρ=mρ₀/b。排除气泡和容器接触，记录温度并校正悬线等附加浮力。</p>')}
        ${qa('预习4：如何用比重瓶法测量液体密度？','<p>称空瓶、装满参照液体、装满待测液体三种质量。保持同一温度和体积，ρ待=ρ参×(M待满−M空)/(M参满−M空)，擦干瓶外并排气泡。</p>')}
        ${qa('过程1：使用电子天平测量前应进行哪些调节？','<p>检查环境与量程，按说明预热，调水平，检查或执行校准，再调零/必要时去皮。关门稳定后称量，并记录分度值。校准、调零、去皮不能相互替代。</p>')}
        ${qa('过程2：如何测量失重环境中物体的质量？','<p>给物体一个可测的作用力并测加速度，或利用同一弹簧系统测周期比；也可用已知弹性势能变化和速度变化求质量。必须计入一起运动的载体及附件。</p>')}
        ${qa('报告1：比较几种物体密度测量方法的适用范围和特点。','<p>几何法适合形状规则、尺寸可测的均匀物体；静力法适合能完全浸入且不溶解/反应的固体，也可用同一沉体比较液体；比重瓶适合液体、小块或颗粒固体。后两者需温度和液体密度，且对气泡、润湿与体积一致性敏感。</p>')}
        ${qa('报告2：不规则固体浸水后表面有气泡，密度偏大还是偏小？为什么？','<p>忽略气泡质量时，气泡增加排水体积及浮力，测得b偏大，ρ=mρ₀/b偏小。交互中的“排除气泡”可直接检验此方向。</p>')}
        ${qa('报告3：待测不规则物体密度比水小，如何测量？','<p>用沉子使其完全浸没，分别测沉子与沉子加样品的浮力，差值是样品浮力；再用样品质量求密度。也可选更低密度、不会与样品反应或使之溶解的液体。不能把部分漂浮时排水体积当作样品总体积。</p>')}
        ${qa('报告4：如何测量大米的密度？','<p>先明确要测米粒材料/颗粒密度，还是一堆大米连同粒间空气的堆积密度。前者可用比重瓶及不明显吸收、溶解或改变米粒的参照液体，控制浸泡时间并排泡；米粒吸水会改变质量和体积，不能随意套用浸水结果。后者用规定装填方式称质量、量总体积，另报“堆积密度”。</p>')}`}
    ],
    mount(chapter){
      const q=s=>chapter.querySelector(s),svg=q('[data-role="mass-svg"]');
      const balance=PhysLabNoise.createSampler();
      function draw(){
        const m=+q('[data-role="ma"]').value,r=+q('[data-role="rho"]').value,bv=+q('[data-role="bubble"]').value,rw=+q('[data-role="temp"]').value,V=m/r;
        const air=balance.read('air',m,.003),app=balance.read('immersed',m-rw*(V+bv),.003),B=air-app,calc=air/B*rw;
        q('[data-role="mao"]').textContent=m.toFixed(0);q('[data-role="rhoo"]').textContent=r.toFixed(1);q('[data-role="bo"]').textContent=bv.toFixed(1);
        q('[data-role="mass-reading"]').textContent=`空气中 ${air.toFixed(3)} g；浸液表观 ${app.toFixed(3)} g；差值 b=${B.toFixed(3)} g。按无气泡公式求得 ρ=${calc.toFixed(4)} g/cm³，相对真实值偏差 ${((calc/r-1)*100).toFixed(2)}%。`;
        const w=Math.max(280,svg.clientWidth),cx=w/2,max=270,x=v=>38+(w-58)*v/max;
        svg.setAttribute('viewBox',`0 0 ${w} 245`);
        svg.innerHTML=`<title>称量示值：空气中${air.toFixed(3)}克，浸液${app.toFixed(3)}克</title><text x="12" y="24" fill="currentColor">质量示值 / g</text><text x="12" y="56" fill="currentColor">空气中</text><line x1="38" y1="78" x2="${x(air)}" y2="78" stroke="#2878a5" stroke-width="15"/><text x="12" y="114" fill="currentColor">完全浸液</text><line x1="38" y1="136" x2="${x(app)}" y2="136" stroke="#c47b25" stroke-width="15"/><line x1="38" y1="178" x2="${w-20}" y2="178" stroke="currentColor" opacity=".5"/>${[0,100,200].map(v=>`<text x="${x(v)}" y="201" text-anchor="middle" fill="currentColor">${v}</text>`).join('')}<text x="${cx}" y="232" text-anchor="middle" fill="currentColor">示值差对应浮力，非质量消失</text>`;
      }
      ['ma','rho','bubble','temp'].forEach(k=>q(`[data-role="${k}"]`).addEventListener('input',draw));
      q('[data-role="clean"]').addEventListener('click',()=>{q('[data-role="bubble"]').value=0;balance.reset();draw();});
      const pr=()=>{const t=Number(q('[data-role="period"]').value);q('[data-role="period-reading"]').textContent=t>0&&Number.isFinite(t)?`系统总质量 = 200.0×(${t.toFixed(3)}/1.000)² = ${(200*t*t).toFixed(2)} g。若只要附加物质量，还要扣除载体。`:'请输入正的周期。';};
      q('[data-role="period"]').addEventListener('input',pr);pr();draw();new ResizeObserver(draw).observe(svg);
    }
  });

  addLesson({
    id:'2',title:'用气垫导轨研究匀加速运动与碰撞',pages:'77–85',
    summary:'把遮光时间变成速度，再拟合加速度；用带方向的速度比较碰撞前后的动量与动能。',
    sections:[
      {title:'目标与装置',pages:'77–78、81、83–85',html:`
        <p>气垫让滑块与导轨之间形成薄空气层，显著减小接触摩擦。先用斜轨研究匀加速运动，再调回水平研究碰撞：同一组测时工具能回答“运动怎样变化”和“碰撞中哪些量守恒”。</p>
        <ol><li>测直线运动的平均速度、近似瞬时速度和加速度。</li><li>研究斜面自由下滑，测当地重力加速度。</li><li>研究三种一维碰撞，检验动量与动能关系。</li><li>用可控作用力验证牛顿第二定律。</li></ol>
        <p>装置有气垫导轨、稳定气源、数字毫秒计和光电门、物理天平、大/小滑块、游标卡尺、卷尺、弹簧钢圈、尼龙粘扣、金属碰撞器、固定螺丝、U形挡光片。称滑块时需包含挡光片、碰撞器和其他附件。</p>
        <p>附录说明：气孔喷出的压缩空气形成约0.05–0.20 mm空气层。教材示例导轨长1.2–2.0 m、面宽约40 mm，气孔间距20–25 mm、孔径0.5–0.9 mm；这些是器材结构例，不是必须照搬的实验设定。整套装置分为导轨、气源和计时系统。</p>
        <p>使用时先通气再让滑块运动，轻拿轻放，不在导轨表面加压或划伤；没有气垫时不要沿轨滑动。小型气源易发热，不测时关闭，按说明控制连续工作时间。教材建议用酒精棉轻擦导轨并防尘；维护应服从实际器材说明。</p>`},
      {title:'原理与读数',pages:'78–81、84–85',html:`
        <h3>光电门测的首先是时间</h3>
        <div class="formula">平均速度 v̄=Δs/Δt；Δt足够短时，v≈Δs/Δt</div>
        <p>这里Δs必须与触发的两个边沿对应。U形挡光片在S2档，计的是同一光电门两次挡光起始边沿之间的时间：相应Δs是两次同类边沿之间的距离，不一定是一条遮光板的宽度；S1则测一次挡光时长。开机默认挡光片宽度1 cm是仪器初值，必须核对并设置实测Δs。</p>
        <p>Δs/Δt是该小段的平均速度。在匀加速运动中它等于时间中点的瞬时速度，但不严格等于空间中点速度；把它作为门位置处速度是短挡光间隔近似。挡光片太长近似变差，太短又让计时误差占比增大。</p>
        <h3>三种直线拟合都能测a</h3>
        <div class="formula">v=v₀+at；s=v₀t+½at²；v²=v₀²+2as</div>
        <p>v–t斜率为a，截距v₀；(s/t)–t斜率为a/2，截距v₀；v²–s斜率为2a，截距v₀²。本教材实际基础步骤要求拟合<strong>v²–2s</strong>，因此斜率直接是a，不能再除以2。</p>
        <div class="formula">a=g sinθ≈gh/L → g=aL/h</div>
        <p>h是垫高产生的高度差，L需与相应倾斜几何长度一致；教材在小倾角下使用h/L。若L取水平支点间距，严格sinθ应由几何求出；不要把总轨道外形长度与支承点长度混用。</p>
        <h3>碰撞：先规定正方向，再算守恒量</h3>
        <p>记碰前速度u₁、u₂，碰后v₁、v₂，向右为正。动量是有方向的；光电门给出的速率正值还需按运动方向加正负号。短碰撞期间外力冲量可忽略时：</p>
        <div class="formula">p₀=m₁u₁+m₂u₂=p₁=m₁v₁+m₂v₂<br>E₀=½m₁u₁²+½m₂u₂²；E₁=½m₁v₁²+½m₂v₂²</div>
        <p>弹簧钢圈近似完全弹性碰撞，e≈1、动量及动能近似守恒；尼龙粘扣使两滑块粘合，e≈0、共速而动能损失；金属碰撞器用于一般碰撞，常有0&lt;e&lt;1。e=(v₂−v₁)/(u₁−u₂)是分离速率与接近速率之比；只有确实相向接近并发生碰撞时才这样使用。</p>
        <div class="formula">完全弹性：v₁=[(m₁−m₂)u₁+2m₂u₂]/(m₁+m₂)<br>v₂=[(m₂−m₁)u₂+2m₁u₁]/(m₁+m₂)<br>完全非弹性：v₁=v₂=(m₁u₁+m₂u₂)/(m₁+m₂)</div>
        <p>一般碰撞可由动量守恒和恢复系数联立求解。动量相对差(p₀−p₁)/p₀与动能损失率(E₀−E₁)/E₀并非一回事；p₀接近零时相对动量差不稳定，应报绝对差及不确定度。u₂=0、完全非弹性时，动能损失率=m₂/(m₁+m₂)。动能损失转为形变、内能和声音等，并非总能量消失。</p>`},
      {title:'交互练习：光电门与碰撞',pages:'81–82',html:`
        <h3>动作一：把五组遮光时间变成g</h3>
        <p>理想教学模型取g=9.8 m/s²、L=1.000 m，由静止释放，计时间隔的空间中心距释放点为s。选择距离、记录时间，再拟合v²对2s；可改Δs观察有限挡光间隔的影响。</p>
        <div class="sim"><div class="sim-controls"><label>s / cm <select data-role="distance"><option>20</option><option>30</option><option>40</option><option>50</option><option>60</option></select></label><label>垫高h / mm <input data-role="height" type="range" min="10" max="50" value="20" step="1"><output data-role="ho"></output></label><label>挡光间隔Δs / mm <input data-role="width" type="range" min="5" max="30" value="10" step="1"><output data-role="wo"></output></label></div>
        <p data-role="gate-reading" class="reading" aria-live="polite"></p><div class="sim-controls"><button type="button" data-role="record">记录本次</button><button type="button" data-role="fill">填入五组教学数据</button><button type="button" data-role="clear">清空记录</button></div>
        <div class="table-wrap"><table><thead><tr><th>s / cm</th><th>Δt / ms</th><th>v / (m/s)</th></tr></thead><tbody data-role="gate-table"></tbody></table></div><svg data-role="gate-svg" style="width:100%;height:245px" role="img" aria-label="以2s为横轴、v平方为纵轴的拟合图"></svg><p data-role="fit-reading" class="reading" aria-live="polite"></p><p class="hint">改变h或Δs会清空本轮模拟记录，以免把不同条件混在一次拟合中。模拟光电计时含小幅随机波动，有限遮光间隔也会影响平均速度。</p></div>
        <h3>动作二：预测碰后速度，再看动量和动能</h3>
        <div class="sim"><div class="sim-controls"><label>m₁ / g <input data-role="m1" type="range" min="100" max="500" value="300" step="10"><output data-role="m1o"></output></label><label>m₂ / g <input data-role="m2" type="range" min="100" max="500" value="200" step="10"><output data-role="m2o"></output></label><label>u₁ / (m/s) <input data-role="u1" type="range" min="0.1" max="1.2" value="0.6" step="0.05"><output data-role="u1o"></output></label><label>u₂ / (m/s) <input data-role="u2" type="range" min="-0.8" max="0" value="0" step="0.05"><output data-role="u2o"></output></label><label>碰撞类型 <select data-role="etype"><option value="1">钢圈：理想弹性 e=1</option><option value="0.4">金属：示例 e=0.4</option><option value="0">粘合：完全非弹性 e=0</option></select></label></div>
        <svg data-role="collision-svg" style="width:100%;height:250px" role="img" aria-label="碰撞前后两滑块的速度方向及大小"></svg><p data-role="collision-reading" class="reading" aria-live="polite"></p><p class="hint">图显示碰前/碰后速度示意，不是连续位置动画。e=0.4是教学设定，并非教材金属的标定值；理想模型无外力，所以动量差总为零，真实实验必须由测量检验。</p></div>`},
      {title:'操作与记录：从基础到高阶',pages:'81–85',html:`
        <h3>基础：调平、测速度、拟合a和g</h3><ol>
        <li>每次使用前调纵、横两向水平。通气后轻放滑块，调单底脚使它静止或只有不固定方向的微小滑动；横向调双底脚使两侧气隙相近，必要时借助气泡水准仪。</li>
        <li>按图2-3测U形挡光片的有效Δs，计时器选S2，核对实际触发边沿及单位。</li>
        <li>在单底脚下垫块形成斜面。由距光电门s=20.00 cm处从静止释放，不推滑块，测Δt。</li>
        <li>再取s=30.00、40.00、50.00、60.00 cm，每处重复测量。教材表2-1给三次读数及均值；另记录Δs/mm、h/cm、L/cm。</li>
        <li>算v≈Δs/Δt，统一成SI单位，最小二乘拟合v²–2s，斜率为a，再用g=aL/h并与当地参考值比较。</li></ol>
        <h3>提升：三种碰撞都要测</h3>
        <p>恢复水平后选计时器“碰撞”档。按教材取m₁&gt;m₂，称质量时包含挡光片及碰撞附件。m₂放在两光电门之间静止，m₁撞向它；记录m₁碰前门时间Δt₁₀、碰后Δt₁，以及m₂碰后Δt₂，各自用各自的Δs换算。先装弹簧钢圈，再换尼龙粘扣、金属碰撞器，分别多次测量。教材表2-2列五次，表头还包括v₁₀、v₁、v₂、Δp/p、ΔE/E及e。</p>
        <p>两门需容纳整个碰撞区域，保证各次速度测量属于明确的碰前或碰后，不能在碰撞尚未结束时遮光；又应尽可能接近碰撞区，减小在门与碰撞点之间受到额外冲量的影响。门距及被撞滑块位置要结合挡光片、滑块长度和碰后运动方向安排。</p>
        <h3>进阶：验证牛顿第二定律</h3>
        <p>方案一：水平导轨上的滑块经细线、滑轮连悬挂砝码盘。保持总系统质量不变，把砝码在滑块与悬挂盘之间转移，使悬挂质量mₙ依次5.00、10.00、15.00、20.00、25.00 g；起点与光电门位置不变。由vₙ²=2aₙs求aₙ，以aₙ为横轴、Fₙ=mₙg为纵轴拟合。</p>
        <div class="formula">Fₙ = mₙg = (m₀+m+mₑ)aₙ</div>
        <p>m₀是滑块质量，m是砝码盘及盘上、滑块上全部砝码的恒定总质量；mₑ是滑轮转动惯量折算的等效质量，教材示例约0.30 g。直线斜率给出包含mₑ的有效惯性质量；要报实际平动总质量，应按模型扣除mₑ。mₙg是整个系统的驱动力，不是任意情况下细线对滑块的拉力。</p>
        <p>方案二：不用气垫导轨，设计摩擦较小或微重力等系统，用力传感器测合力，用光栅、毫秒计或加速度传感器测a，逐项改变作用力和系统质量，检验F与ma。必须说明什么是被研究系统、所测是否合外力。</p>
        <h3>高阶：视频与传感器</h3>
        <p>教材建议用Tracker分析抛体或二维碰撞：先标定长度与时间，固定相机、减小透视，逐帧追踪位置，再由差分求速度、加速度，并报告差分放大噪声的影响。另比较多普勒测速、Phyphox手机加速度、望远镜/视频跟踪、飞行器测速等方法：列出直接测量量、标定方式、采样率、适用运动和误差。手机读数还需区分设备方向和重力/比力分量，不能直接当作某方向的运动学加速度。</p>
        <details><summary>附录计时器功能与边沿对应（第84—85页）</summary><p>P1、P2接光电门。功能键循环选择并清零当前测量；转换键可切换时间/速度显示，也用于设置挡光间隔等；取数键查看已存储数据。</p><ul><li>S1：一次挡光时间。</li><li>S2：同门两次挡光之间的时间及据此换算的速度。</li><li>a：通过光电门的时间、速度及相应加速度。</li><li>PZh：碰撞模式，测两滑块通过门的速度。</li><li>T：若干简谐振动周期的时间。</li></ul><p>仪器还列出重力加速度、计数、频率、电周期、信号源等功能指示。以上按教材型号说明；实物界面不同应核实说明书。开机默认Δs=1 cm不代表你的挡光片恰好1 cm。</p></details>`},
      {title:'数据处理与误差',pages:'79–83',html:`
        <p><strong>匀加速教学例：</strong>L=1.000 m、h=0.0200 m、Δs=0.01000 m。理想小段近似下，s=0.20、0.30、0.40、0.50、0.60 m对应v约0.2800、0.3429、0.3960、0.4427、0.4850 m/s，Δt约35.71、29.16、25.25、22.59、20.62 ms。拟合v²对2s得a约0.196 m/s²，g约9.80 m/s²。交互使用精确的有限时间区间，所以最后几位可与此短间隔近似略有不同。</p>
        <div class="formula">令xᵢ=2sᵢ，yᵢ=vᵢ²：a=Σ(xᵢ−x̄)(yᵢ−ȳ)/Σ(xᵢ−x̄)²；b=ȳ−ax̄</div>
        <p>理论截距b=v₀²；明显非零时检查是否推了一下、位置零点和有限挡光间隔，不要仅凭一个截距就确定误差来源。每个释放距离重复测量，先检查异常读数，再依课程规范处理平均时间与速度。不同条件的数据不能混合拟合。</p>
        <p><strong>碰撞教学例：</strong>m₁=0.300 kg、m₂=0.200 kg、u₁=0.600 m/s、u₂=0。弹性时v₁=0.120、v₂=0.720 m/s，前后p=0.180 kg·m/s、E=0.0540 J；粘合时v=0.360 m/s、E=0.0324 J，动能损失40%，但p仍为0.180 kg·m/s。金属模型e=0.4时v₁=0.264、v₂=0.504 m/s，动能损失33.6%。这些是理想演算值，不能代替实测检验。</p>
        <p>速度不确定度近似u(v)/v=√[(u(Δs)/Δs)²+(u(Δt)/Δt)²]；g由a、L、h共同决定，独立小误差近似下u(g)/g=√[(u(a)/a)²+(u(L)/L)²+(u(h)/h)²]。h较小，相同绝对读数误差的相对影响会更大。</p>
        <p>主要误差包括：纵向未调平导致额外加速度、气流阻力和摩擦、从静止释放不一致、位置定义不一致、边沿/Δs选错、门到碰撞点过远、碰撞不对心导致转动、质量未计附件、计时饱和或漏触发。两滑块外力冲量不可忽略时动量可能真实改变；动量差并不自动都归于仪器误差。</p>`},
      {title:'全部思考题与解析',pages:'83',html:`
        ${qa('预习：本实验中平均速度如何测量？','<p>先确定两个计时触发边沿对应的位移Δs，再读它们之间的Δt，求v̄=Δs/Δt。U形挡光片S2档使用两次同类遮光边沿间距；不能把门间距或单片宽度随意代入。</p>')}
        ${qa('过程1：滑块位移s如何确定？起点和终点在哪里？','<p>选择滑块上固定标记（常结合有效挡光区中心），起点是从静止释放时该标记位置；终点应与用来代表速度的计时区间位置一致。若采用短区间中心近似，s量到该有效区间中心。不要一端量滑块前沿、另一端量挡光片中心而不作修正。</p>')}
        ${qa('过程2：两光电门距离应注意什么？被撞滑块如何放置？','<p>初始静止滑块放在两门之间，留出完整碰撞及挡光片通过所需空间，使碰前、碰后的计时不重叠且可辨认方向；门尽量接近碰撞区以减小额外冲量，但不能近到碰撞过程中就触发。根据滑块长度、附件及碰后反弹方向安排。</p>')}
        ${qa('报告1：如何判断气垫导轨是否调平？','<p>通气后在不同位置轻放滑块，看它是否静止或只有无固定方向的小漂移；也可分别向两方向轻推并比较速率变化。单靠某一点恰好静止不够，还需检查横向气隙和导轨局部弯曲。</p>')}
        ${qa('报告2：气垫未调平对v、a测量结果有何影响？','<p>倾斜引入沿轨重力分量。速度随位置改变，原本应匀速的过程出现系统加速度；求a或碰撞前后量时混入额外外力作用。偏大还是偏小取决于倾斜方向、运动方向以及测量位置，不能笼统说总偏大。</p>')}
        ${qa('报告3：恢复系数e的大小取决于哪些因素？','<p>教材以碰撞材料为主要因素；实际还受接触结构、表面状态、形变、温度和冲击速度等影响。相同材料并不保证所有速度下e恒定。必须根据相对接近和分离速度测量，并防止转动、非对心和外力冲量影响解释。</p>')}
        <p class="hint">实验2从第77页下部开始；第83—85页的气垫技术、毫秒计功能和使用注意事项也属于本实验。第85页下部才开始实验3。</p>`}
    ],
    mount(chapter){
      const q=s=>chapter.querySelector(s),gs=q('[data-role="gate-svg"]'),cs=q('[data-role="collision-svg"]');let rows=[];
      const val=k=>Number(q(`[data-role="${k}"]`).value);
      const gauge=PhysLabNoise.createSampler();
      let lastGate;
      const gate=nominal=>{
        const a=9.8*val('height')/1000,w=val('width')/1000;
        const ideal=Math.sqrt(2*(nominal+w/2)/a)-Math.sqrt(2*(nominal-w/2)/a);
        const dt=gauge.read('timer',ideal,.00010,{min:.000001}),s=gauge.read('ruler',nominal,.00018);
        return {nominal,s,dt,v:w/dt};
      };
      function showGate(){
        const r=gate(val('distance')/100);q('[data-role="ho"]').textContent=val('height');q('[data-role="wo"]').textContent=val('width');
        q('[data-role="gate-reading"]').textContent=`s=${(r.s*100).toFixed(2)} cm：Δt=${(r.dt*1000).toFixed(3)} ms，v̄=${r.v.toFixed(5)} m/s。`;
        q('[data-role="gate-table"]').innerHTML=rows.map(r=>`<tr><td>${(r.s*100).toFixed(2)}</td><td>${(r.dt*1000).toFixed(3)}</td><td>${r.v.toFixed(5)}</td></tr>`).join('');
        const w=Math.max(280,gs.clientWidth),left=51,right=w-16,top=34,bottom=194,ymax=Math.max(.65,...rows.map(r=>r.v*r.v*1.2)),x=s=>left+(right-left)*(2*s)/1.3,y=v=>bottom-(bottom-top)*v/ymax;
        gs.setAttribute('viewBox',`0 0 ${w} 245`);let h=`<title>v平方对2s的拟合，记录${rows.length}组</title><text x="8" y="20" fill="currentColor">v² / (m²/s²)</text><line x1="${left}" y1="${top}" x2="${left}" y2="${bottom}" stroke="currentColor"/><line x1="${left}" y1="${bottom}" x2="${right}" y2="${bottom}" stroke="currentColor"/><text x="${right}" y="237" text-anchor="end" fill="currentColor">2s / m</text>`;
        for(const t of [0,.4,.8,1.2])h+=`<text x="${x(t/2)}" y="215" text-anchor="middle" fill="currentColor">${t.toFixed(1)}</text>`;
        for(const t of [0,.2,.4,.6])h+=`<text x="${left-6}" y="${y(t)+4}" text-anchor="end" fill="currentColor">${t.toFixed(1)}</text>`;
        if(new Set(rows.map(r=>r.nominal)).size>=2){const n=rows.length,mx=rows.reduce((s,r)=>s+2*r.s,0)/n,my=rows.reduce((s,r)=>s+r.v*r.v,0)/n,a=rows.reduce((s,r)=>s+(2*r.s-mx)*(r.v*r.v-my),0)/rows.reduce((s,r)=>s+(2*r.s-mx)**2,0),b=my-a*mx,g=a/(val('height')/1000);q('[data-role="fit-reading"]').textContent=`拟合a=${a.toFixed(5)} m/s²，截距=${b.toExponential(2)} m²/s²，g=${g.toFixed(4)} m/s²（模型9.8）。已记录${new Set(rows.map(r=>r.nominal)).size}/5种释放距离。`;h+=`<line x1="${x(.17)}" y1="${y(a*.34+b)}" x2="${x(.62)}" y2="${y(a*1.24+b)}" stroke="#2878a5" stroke-width="2"/>`;}else q('[data-role="fit-reading"]').textContent='至少记录两种距离可拟合；按教材完成五种距离，并在真实实验中每处重复测量。';
        rows.forEach(r=>h+=`<circle cx="${x(r.s)}" cy="${y(r.v*r.v)}" r="5" fill="#c47b25"/>`);gs.innerHTML=h;
      }
      q('[data-role="distance"]').addEventListener('input',showGate);['height','width'].forEach(k=>q(`[data-role="${k}"]`).addEventListener('input',()=>{rows=[];showGate();}));
      q('[data-role="record"]').addEventListener('click',()=>{if(rows.length<30){const nominal=val('distance')/100;if(lastGate===nominal)gauge.reset();rows.push(gate(nominal));lastGate=nominal;}showGate();if(rows.length===30)q('[data-role="fit-reading"]').textContent+=' 达到30条上限，可清空后重新练习。';});
      q('[data-role="fill"]').addEventListener('click',()=>{rows=[.2,.3,.4,.5,.6].map(nominal=>{gauge.reset();return gate(nominal);});lastGate=undefined;showGate();});q('[data-role="clear"]').addEventListener('click',()=>{rows=[];showGate();});
      function showCollision(){const m1=val('m1')/1000,m2=val('m2')/1000,u1=val('u1'),u2=val('u2'),e=val('etype'),p0=m1*u1+m2*u2,v1=(p0-m2*e*(u1-u2))/(m1+m2),v2=(p0+m1*e*(u1-u2))/(m1+m2),E0=(m1*u1*u1+m2*u2*u2)/2,E1=(m1*v1*v1+m2*v2*v2)/2;
        ['m1','m2','u1','u2'].forEach(k=>q(`[data-role="${k}o"]`).textContent=val(k).toFixed(k[0]==='u'?2:0));
        const near=Math.abs(p0)<1e-9;q('[data-role="collision-reading"]').textContent=`碰后v₁=${v1.toFixed(3)}、v₂=${v2.toFixed(3)} m/s；总动量前后均${p0.toFixed(4)} kg·m/s。动能${E0.toFixed(5)} → ${E1.toFixed(5)} J，损失${((E0-E1)/E0*100).toFixed(2)}%。${near?'总动量接近零，用绝对动量差，不计算相对百分比。':''}`;
        const w=Math.max(280,cs.clientWidth);cs.setAttribute('viewBox',`0 0 ${w} 250`);let out='<title>碰前碰后速度方向，向右为正</title>';
        function item(x,y,v,label){const len=Math.abs(v)<1e-9?0:Math.sign(v)*(16+Math.min(Math.abs(v),1.8)*19),end=x+len;return `<rect x="${x-29}" y="${y}" width="58" height="32" rx="3" fill="none" stroke="currentColor"/><text x="${x}" y="${y+21}" text-anchor="middle" fill="currentColor">${label}</text><line x1="${x}" y1="${y-14}" x2="${end}" y2="${y-14}" stroke="#2878a5" stroke-width="2"/>${len?`<path d="M${end-5*Math.sign(len)},${y-19} L${end},${y-14} L${end-5*Math.sign(len)},${y-9}" fill="none" stroke="#2878a5"/>`:''}<text x="${x}" y="${y+54}" text-anchor="middle" fill="currentColor">${v.toFixed(3)}</text>`;}
        out+=`<text x="8" y="20" fill="currentColor">碰前：速度 / (m/s)</text>`+item(w*.28,53,u1,'m₁')+item(w*.73,53,u2,'m₂')+`<text x="8" y="146" fill="currentColor">碰后：向右为正</text>`+item(w*.28,176,v1,'m₁')+item(w*.73,176,v2,'m₂');cs.innerHTML=out;
      }
      ['m1','m2','u1','u2','etype'].forEach(k=>q(`[data-role="${k}"]`).addEventListener('input',showCollision));showGate();showCollision();new ResizeObserver(showGate).observe(gs);new ResizeObserver(showCollision).observe(cs);
    }
  });
})();

</script>
<script>
/* Anatomy Figure tier. Textbook references: 实验教材.pdf pp.72–77, 77–85.
 * No manufacturer calibration is claimed. All masses, geometry and noise-free
 * readings below are explicitly labelled teaching examples.
 * Figure 1 parts: four two-part feet; chassis/base/deck; pan pedestal and pan;
 * display recess/glass; three keys; level vial; tray and sample; independent
 * stand base/feet/post/collars/clamp/arm/knob/thread; beaker bottom/walls/rim/water.
 * Figure 2 parts: three adjustable foot assemblies, extrusion/ridge/side rails,
 * ruler/end stops/air inlet, two eight-part gates, timer body/face/keys/sockets,
 * air supply and hose, two seven-part carts and replaceable collision heads.
 * Geometry is built with the official Anatomy iso-kit, including four-tone solids.
 */
(() => {
  'use strict';
  const W=820,H=440, clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  const fixed=(x,n=3)=>(Math.abs(Number(x))<.5*10**(-n)?0:Number(x)).toFixed(n);
  const table=(heads)=>`<div class="table-wrap"><table><thead><tr>${heads.map(s=>`<th scope="col">${s}</th>`).join('')}</tr></thead><tbody data-records></tbody></table></div>`;
  const toolsButtons=`<div class="rig-tools"><button type="button" data-record>记录本次读数</button><button type="button" data-clear>清空记录</button></div>`;
  function maker(k,P){
    const at=p=>k.iso(p,P), plan=(x,y,w,d,r=2)=>({x,y,w,d,r});
    const slab=(x,y,w,d,z,h,tone='mid',r=2)=>k.solidSvg(k.slabOf(plan(x,y,w,d,r),z,h,P,5,Math.min(.8,h*.3)),{tone});
    const round=(x,y,r,z,h,tone='mid',lit=false)=>k.solidSvg(k.cylinder(x,y,r,z,h,P,32,Math.min(.6,h*.2)),{tone,lit});
    const line=(p,tone='lo')=>k.lineSvg(k.pathOf(p.map(at)),{tone});
    const screw=(x,y,z)=>k.lineSvg(k.ring(x,y,1.7,z,P,16),{tone:'lo'})+k.dotsSvg([at([x,y,z])],{size:.5,tone:'hi'});
    const knob=(x,y,z,r=5)=>round(x,y,r,z,4,'hi')+k.lineSvg(k.knurl(x,y,r,z,z+4,24,P),{tone:'lo'})+line([[x-2,y,z+4],[x+r-1,y,z+4]],'hi');
    const face=(pts,fill,opacity=1)=>`<path d="${k.pathOf(pts.map(at),true)}" fill="${fill}" fill-opacity="${opacity}" stroke="var(--anatomy-lo)" stroke-width=".6"/>`;
    const label=(p,text,size=7)=>{const [x,y]=at(p);return `<text x="${x}" y="${y}" font-size="${size}" fill="var(--anatomy-hi)" text-anchor="middle" font-family="ui-monospace,monospace">${text}</text>`;};
    return {at,plan,slab,round,line,screw,knob,face,label};
  }
  function setStatus(el,s){el.textContent=s;}
  function rememberFocus(host,render){const id=host.ownerDocument.activeElement?.dataset?.rigHit;render();if(id)host.querySelector(`[data-rig-hit="${id}"]`)?.focus({preventScroll:true});}

  registerBench('1',{
    title:'亲手称量，再用浮力求体积',
    intro:'点图上的样品、调平脚、去皮键和支架旋钮。这里采用教材的“烧杯放在天平上、样品由外部支架悬挂”接法；浮力使天平读数增加。',
    task:'先在空气中称出样品质量并记录；再切换静力称衡，将装水烧杯去皮，完全浸没样品后记录增加量。最后加入一个附着气泡，观察密度结果如何改变。',
    question:{prompt:'烧杯在天平上，样品悬挂于天平外的支架。样品完全浸水且不接触杯壁、杯底时，天平增加量 b 代表什么？',choices:[
      {label:'排开水的质量：b = ρ水V',correct:true,feedback:'对。水对样品有向上的浮力；样品对水的反作用力向下，经烧杯传给天平。因此增加量 b = ρ水V，样品密度 ρ = mρ水/b。'},
      {label:'样品在水中的表观质量',correct:false,feedback:'这是另一种接法：样品悬在天平上、烧杯由外部承托时才读表观质量。本图支架独立，天平读的是烧杯受到的额外作用力。'},
      {label:'仍等于样品的全部质量',correct:false,feedback:'样品重量主要由外部支架承担。只有样品对水的向下反作用力传给天平；若碰到杯底，就破坏了当前模型的受力条件。'}
    ]},
    mount(host,{k,svgHit,bindHits,timeline}){
      const P=k.fitProjection(k.boxCorners({x:-185,y:-95,w:365,d:210,r:8},-15,188),W,H,{pad:24,azimuth:54,elevation:27});
      const q=maker(k,P), {at,slab,round,line,screw,knob,face,label}=q;
      const s={mode:'mass',onPan:false,level:-2,lower:0,bubble:false,tare:0,tareGood:false,mass:null,buoy:null,moving:false,rows:[],note:'先点前面的调平脚，直到气泡居中；再点右侧托盘上的样品。'};
      const M=120,RHO=7.8,RW=.998229,V=M/RHO,CUP=86.420;
      let stop=()=>{};
      host.innerHTML=`<div class="rig-tools"><label>接法 <select data-mode><option value="mass">基础称量：样品放在秤盘上</option><option value="hydro">静力称衡：烧杯在秤盘上</option></select></label></div><div class="rig-scene"></div><p class="rig-readout" aria-live="polite"></p><p class="hint" data-guidance></p><div class="rig-tools"><button type="button" data-level>调平脚 +1 格</button><button type="button" data-sample>放置／取下样品</button><button type="button" data-tare>去皮</button><button type="button" data-lower>降低／升起悬样</button><button type="button" data-bubble>附着／去除气泡</button></div>${toolsButtons}${table(['接法','读数 / g','解释'])}<p class="hint" data-result></p><p class="hint">教学模型：样品质量 120 g、密度 7.8 g/cm³；水温 20 ℃，ρ水 = 0.998229 g/cm³（教材附录）。天平分度示例 0.001 g；稳定后读数仍有轻微随机波动。独立支架不放在天平上；杯壁用教学剖视显示，样品始终不接触杯底或杯壁。</p>`;
      const scene=host.querySelector('.rig-scene'),read=host.querySelector('.rig-readout'),note=host.querySelector('[data-guidance]'),result=host.querySelector('[data-result]');
      function riseFull(){return Math.PI*12*12*22/(56*46)*(1+(s.bubble?.45:0)/V);}
      function immersion(){return clamp((88-(110-50*s.lower))/(22-riseFull()),0,1);}
      function raw(){return s.mode==='mass'?(s.onPan?M:0):CUP+RW*(V+(s.bubble?.45:0))*immersion();}
      function stable(){return s.level===0&&!s.moving;}
      const balance=PhysLabNoise.createSampler();
      let lastRecorded;
      function value(){const ideal=raw()-s.tare;return stable()&&ideal!==0?balance.read('load',ideal,.003):ideal;}
      function reweigh(){balance.reset();lastRecorded=undefined;}
      function instrument(){
        let a=`<path class="iso-halo" d="${k.haloOf({x:-140,y:-65,w:170,d:150,r:12},-14,8,P)}"/>`;
        for(const [x,y] of [[-120,-44],[10,-44],[-120,63],[10,63]]) a+=round(x,y,7,-14,3,'lo')+round(x,y,5,-11,11,'mid');
        a+=slab(-140,-65,170,150,-2,14,'mid',12)+slab(-136,-61,162,142,12,8,'hi',10)+slab(-129,-54,148,98,20,3,'mid',6);
        a+=round(-54,-7,10,23,9,'mid')+round(-54,-7,43,32,4,'hi')+k.lineSvg(k.ring(-54,-7,38,36,P),{tone:'faint'});
        a+=slab(-124,48,79,25,20,2,'lo',3)+slab(-121,51,73,19,22,.6,'lo',1);
        a+=`<g data-display></g>`;
        for(const x of [-30,-9,12])a+=slab(x-7,52,14,14,20,3,x===-30?'hi':'mid',3);
        a+=round(-111,-38,10,23,2,'mid')+k.lineSvg(k.ring(-111,-38,5,25,P),{tone:'hi'})+round(-111+s.level*2.3,-38,2.8,25,.3,'hi',true);
        a+=[[-128,-51],[18,-51],[-128,38],[18,38]].map(([x,y])=>screw(x,y,23)).join('');
        // The supporting stand is physically separate from the scale platform.
        for(const [x,y] of [[45,-78],[107,-78],[45,-25],[107,-25]])a+=round(x,y,5,-12,7,'lo');
        a+=slab(35,-88,82,74,-5,9,'mid',6)+slab(45,-78,62,54,4,5,'mid',4);
        a+=round(78,-58,9,9,7,'mid')+round(78,-58,3.5,16,163,'hi')+round(78,-58,5,177,3,'mid');
        a+=slab(70,-66,16,16,161,14,'hi',3)+slab(-58,-61,128,6,167,6,'hi',2)+slab(-61,-61,6,57,167,6,'hi',2);
        a+=knob(88,-58,164,7)+round(-58,-7,3.5,167,5,'hi');
        a+=slab(67,38,91,63,-6,8,'mid',6)+slab(72,43,81,53,2,2,'lo',5);
        a+=k.lineSvg(k.planOutline({x:78,y:49,w:69,d:41,r:4},4,P),{tone:'faint'});
        a+=[[42,-81],[109,-81],[42,-18],[109,-18]].map(([x,y])=>screw(x,y,4)).join('');
        return a;
      }
      function beaker(){
        if(s.mode!=='hydro')return '';
        // An open rectangular vessel makes the cutaway and non-contact gap explicit.
        const x=-85,y=-33,w=62,d=52,z=37,top=103;
        let a=slab(x,y,w,d,z,3,'mid',3);
        a+=face([[x,y,z+3],[x+w,y,z+3],[x+w,y,top],[x,y,top]],'var(--anatomy-shade-1)',.30);
        a+=face([[x,y,z+3],[x,y+d,z+3],[x,y+d,top],[x,y,top]],'var(--anatomy-shade-2)',.30);
        a+=slab(x+1,y+1,w-2,2,top,2,'mid',.8)+slab(x+1,y+1,2,d-2,top,2,'mid',.8);
        a+=slab(x+w-3,y+1,2,d-2,top,2,'mid',.8)+slab(x+1,y+d-3,w-2,2,top,2,'mid',.8);
        return a+`<g data-water></g>`;
      }
      function drawStatic(){
        const part=s.mode==='mass'?(s.onPan?[-54,-7,54]:[112,68,25]):[-58,-7,136-50*s.lower];
        const hits=[['level','转动调平脚；每次一格，气泡居中为零',-120,63,-5],['tare','天平去皮键',-30,58,24],['sample','移动样品：托盘与秤盘之间',...part],['lower','支架旋钮：降低或升起样品',88,-58,170],['bubble','样品表面的气泡：附着或去除',...part]];
        let body=instrument()+beaker()+`<g data-specimen></g>`;
        body+=hits.filter(([id])=>id!=='bubble'&&!(s.mode==='mass'&&id==='lower')&&!(s.mode==='hydro'&&id==='sample')).map(([id,l,x,y,z])=>svgHit(id,l,...at([x,y,z]),id==='sample'?26:19)).join('');
        if(s.mode==='hydro')body+=svgHit('bubble','附着或去除气泡',...at([-77,13,72]),17);
        scene.innerHTML=k.figureSvg({width:W,height:H,label:'电子天平、独立悬挂支架与浸水容器；点击圆形操作点或用 Tab 和回车操作。',body});
        drawLive();
      }
      function drawLive(){
        let x,y,z;
        if(s.mode==='mass'){[x,y,z]=s.onPan?[-54,-7,36]:[112,68,4];}
        else [x,y,z]=[-58,-7,110-50*s.lower];
        let a='';
        if(s.mode==='hydro')a+=line([[x,y,167],[x,y,z+24]],'hi');
        a+=round(x,y,12,z,22,'hi',true)+round(x,y,3,z+22,2,'mid')+k.lineSvg(k.ring(x,y,9,z+22,P),{tone:'lo'});
        if(s.mode==='hydro'&&s.bubble)a+=round(x+9,y+5,4.5,z+6,1.2,'lo');
        scene.querySelector('[data-specimen]').innerHTML=a;
        if(s.mode==='hydro'){
          // Water level and submerged fraction solve the same displaced-volume model.
          const wz=88+immersion()*riseFull();
          scene.querySelector('[data-water]').innerHTML=face([[-82,-30,wz],[-26,-30,wz],[-26,16,wz],[-82,16,wz]],'var(--anatomy-shade-2)',.40)+line([[-82,16,40],[-26,16,40],[-26,16,103]],'lo');
        }
        scene.querySelector('[data-display]').innerHTML=label([-84,61,24],`${stable()?fixed(value()):'···'} g`,11);
        read.setAttribute('aria-live',s.moving?'off':'polite');
        setStatus(read,stable()?`天平：${fixed(value())} g · ${s.mode==='mass'?'基础称量':`浸没 ${fixed(immersion()*100,0)}%`} · 气泡${s.level===0?'居中':'未居中'}`:`${s.moving?'样品正在移动，等稳定再记录':'尚未调平，请点调平脚'} · 即时模型负载 ${fixed(value())} g`);
        setStatus(note,s.note);
        result.textContent=s.mass!==null&&s.buoy!==null?`已记录 m = ${fixed(s.mass)} g，b = ${fixed(s.buoy)} g。ρ = mρ水/b = ${fixed(s.mass*RW/s.buoy,4)} g/cm³。${s.bubble?'气泡使排水体积变大，结果偏小。':''}`:'记录空气中质量 m 和完全浸没后的增加量 b，再计算 ρ = mρ水/b。';
      }
      function level(){if(s.moving)return;s.level=s.level>=2?-2:s.level+1;s.note=s.level===0?'气泡已居中。现在可以称量；去皮应在你要扣除的容器单独放上天平时进行。':'气泡偏离中央圆圈；继续逐格调平。';rememberFocus(host,drawStatic);}
      function tare(){if(!stable()){s.note='先调平并等待稳定，随后去皮。';drawLive();return;}s.tare=raw();reweigh();s.tareGood=s.mode==='hydro'&&immersion()===0;s.note=s.tareGood?'烧杯及水已经去皮。现在点支架旋钮，将样品完全浸没。':s.mode==='mass'?(s.onPan?'你把样品也去皮了；取下样品再去皮，之后重新称量。':'空秤盘已归零。'): '浸水时去皮会把浮力增加量也扣掉。先升起样品，重新去皮。';drawLive();}
      function sample(){if(s.mode!=='mass'){s.note='静力称衡时样品由独立支架悬挂，请操作支架旋钮。';drawLive();return;}s.onPan=!s.onPan;reweigh();s.note=s.onPan?'样品已放上秤盘。稳定后记录空气中的质量 m。':'样品已取下；空秤盘可以去皮归零。';rememberFocus(host,drawStatic);}
      function lower(){if(s.mode!=='hydro'){s.note='先把接法切换到静力称衡。';drawLive();return;}if(s.moving)return;const start=s.lower,target=start<.5?1:0;s.moving=true;s.note=target?'样品下降。读数增加来自样品对水的向下反作用力。':'样品上升。完全离水后才给烧杯重新去皮。';stop=timeline(1050,p=>{const e=p*p*(3-2*p);s.lower=start+(target-start)*e;if(p===1){s.moving=false;reweigh();s.note=target?'样品完全浸没，且不接触杯底或杯壁；可以记录 b。':'样品已完全离水；此时可以给烧杯及水去皮。';}drawLive();});}
      function bubble(){if(s.mode!=='hydro')return;if(s.moving)return;s.bubble=!s.bubble;reweigh();s.note=s.bubble?'附着气泡几乎不增加样品质量，却增加排水体积；再次记录，比较计算密度。':'已去除气泡；真实实验还要检查挂线、浸没程度和接触。';drawLive();}
      const actions={level,tare,sample,lower,bubble};bindHits(host,actions);
      for(const id of Object.keys(actions))host.querySelector(`[data-${id}]`).addEventListener('click',actions[id]);
      host.querySelector('[data-mode]').addEventListener('change',e=>{stop();reweigh();s.mode=e.target.value;s.lower=0;s.moving=false;s.tare=0;s.tareGood=false;s.onPan=false;s.note=s.mode==='hydro'?'烧杯及水已经放上天平；先去皮，再浸没样品。':'点样品，把它放在秤盘上。';drawStatic();});
      host.querySelector('[data-record]').addEventListener('click',()=>{
        if(!stable()){s.note='读数未稳定或天平未调平，先完成相应操作。';drawLive();return;}
        let what;
        if(s.mode==='mass'){
          if(!s.onPan||s.tare!==0){s.note='先在空秤盘上归零，再把样品放上；当前不能把净读数当样品质量。';drawLive();return;}
          what='空气中样品质量 m';
        }else{
          if(!s.tareGood||immersion()<1){s.note='先在样品离水时给烧杯去皮，再将样品完全浸没。';drawLive();return;}
          what=s.bubble?'增加量 b（附着气泡）':'增加量 b（无气泡）';
        }
        if(lastRecorded===value())reweigh();
        lastRecorded=value();
        if(s.mode==='mass')s.mass=Number(fixed(lastRecorded));else s.buoy=Number(fixed(lastRecorded));
        s.rows.push(`<tr><td>${s.mode==='mass'?'基础称量':'静力称衡'}</td><td>${fixed(lastRecorded)}</td><td>${what}</td></tr>`);host.querySelector('[data-records]').innerHTML=s.rows.join('');s.note='本次读数已记录。';drawLive();
      });
      host.querySelector('[data-clear]').addEventListener('click',()=>{s.rows=[];s.mass=s.buoy=null;host.querySelector('[data-records]').innerHTML='';drawLive();});
      drawStatic();
    }
  });

  registerBench('2',{
    title:'打开气源，让滑块经过光电门',
    intro:'同一套导轨可做垫高后的匀加速运动，也可放平后研究碰撞。点气泵、垫块、滑块、光电门和碰撞头，仪器上的位置、光电触发和读数共用一个模型。',
    task:'匀加速模式：开气源，设定垫高和释放距离，点滑块释放，记录多组 v² 与 2s。碰撞模式：换装三种碰撞头，观察速度方向、动量和动能的变化。',
    question:{prompt:'在水平气垫导轨上，两滑块碰后粘在一起。在忽略外力冲量的模型中，哪项判断成立？',choices:[
      {label:'总动量守恒；总动能一般减少',correct:true,feedback:'对。相互作用力是一对内力，总动量保持不变。粘合使部分机械能转化为形变、热和声；动量守恒不要求动能守恒。'},
      {label:'总动量与总动能都守恒',correct:false,feedback:'动能守恒对应理想弹性碰撞。粘合碰撞要比较碰前后 ½mv²；只有总动量在当前外力冲量可忽略的条件下守恒。'},
      {label:'碰后同速，所以总动量为零',correct:false,feedback:'同速不等于静止。若初始总动量不为零，粘在一起的两个滑块仍会共同运动，v = p初/(m₁+m₂)。'}
    ]},
    mount(host,{k,svgHit,bindHits,timeline}){
      const P=k.fitProjection(k.boxCorners({x:-65,y:-65,w:730,d:250,r:8},-25,135),W,H,{pad:25,azimuth:72,elevation:24});
      const q=maker(k,P),{at,slab,round,line,screw,knob,face,label}=q;
      const s={mode:'accel',air:false,height:.02,start:.15,gate:.75,coupling:0,running:false,t:0,x1:.15,x2:.53,rows:[],last:null,gateTimes:[null,null],note:'先点击左后方气泵的电源开关。'};
      const SCALE=600,L=1,G=9.8,DS=.01,ARM=.002,m1=.2,m2=.4,U=.6;
      const couplings=[{e:1,name:'弹性钢片环'},{e:.5,name:'部分非弹性示例'},{e:0,name:'粘合碰撞'}];
      let stop=()=>{},events=[],runDuration=0,markerStart=.15;
      host.innerHTML=`<div class="rig-tools"><label>实验模式 <select data-mode><option value="accel">倾斜导轨：匀加速运动</option><option value="collision">水平导轨：三类碰撞</option></select></label><label data-height-wrap>垫高 h / mm <input data-height type="range" min="10" max="30" step="5" value="20"></label><label data-start-wrap>释放位置 x / m <input data-start type="range" min="0.10" max="0.50" step=".05" value=".15"></label><button type="button" data-run>释放滑块</button><button type="button" data-reset>复位</button></div><div class="rig-scene"></div><p class="rig-readout" aria-live="polite"></p><p class="hint" data-guidance></p><div class="rig-tools"><button type="button" data-air>开／关气源</button><button type="button" data-raise>垫高 +5 mm</button><button type="button" data-gate>光电门移动 +5 cm</button><button type="button" data-coupling>切换碰撞头</button></div>${toolsButtons}${table(['模式','几何／装置','光电计时 / ms','速度 / m·s⁻¹','处理结果'])}<p class="hint" data-result></p><p class="hint">教学参数：支脚间距 L = 1.000 m，遮光框两前沿间距 Δs = 10.00 mm，每臂宽 2.00 mm；运动按无摩擦模型，光电计时含小幅随机波动。碰撞示例 m₁ = 200 g、m₂ = 400 g，u₁ = +0.600 m/s、u₂ = 0；部分非弹性碰撞的 e = 0.5 是示例，须由真实数据求实物的 e。碰撞前先放平导轨；图中升降量按几何比例绘制。</p>`;
      const scene=host.querySelector('.rig-scene'),read=host.querySelector('.rig-readout'),note=host.querySelector('[data-guidance]'),result=host.querySelector('[data-result]');
      const trackZ=x=>40+(s.mode==='accel'?s.height*SCALE*(1-x/SCALE):0);
      function tiltSlab(x,y,w,d,z,h,tone='mid'){
        const p=(a,b,c)=>[a,b,c+trackZ(a)];
        const top=[p(x,y,z+h),p(x+w,y,z+h),p(x+w,y+d,z+h),p(x,y+d,z+h)];
        const front=[p(x,y+d,z),p(x+w,y+d,z),top[2],top[3]];
        const end=[p(x+w,y,z),p(x+w,y+d,z),top[2],top[1]];
        const path=pts=>k.pathOf(pts.map(at),true);
        return k.solidSvg({fill:path([p(x,y,z),p(x+w,y,z),p(x+w,y+d,z),p(x,y+d,z),top[3],top[0]]),top:path(top),shades:['',path(front),path(end),''],outline:path(top)+path(front)+path(end),crease:'',bevel:''},{tone});
      }
      function gate(x,index,front=false){
        const xx=x*SCALE,z=trackZ(xx),a=[];
        if(front)return round(xx,29,3.5,z-11,63,'hi')+slab(xx-6,17,12,9,z+30,12,'hi',2)+knob(xx,33,z-10,4.5);
        a.push(slab(xx-12,-40,24,80,z-15,4,'mid',3),round(xx,-29,3.5,z-11,63,'hi'));
        a.push(slab(xx-8,-34,16,68,z+49,8,'hi',3),slab(xx-6,-26,12,9,z+30,12,'hi',2));
        a.push(screw(xx,-32,z-11),screw(xx,32,z-11));
        a.push(`<g data-beam="${index}">${line([[xx,-17,z+36],[xx,17,z+36]],'faint')}</g>`);
        return a.join('');
      }
      function cart(x,second=false){
        const xx=x*SCALE,z=trackZ(xx),a=[];
        // Every cart component is located in the inclined track coordinate frame.
        a.push(tiltSlab(xx-22,-18,44,36,2,5,'hi'),tiltSlab(xx-17,-13,34,26,7,12,'hi'));
        a.push(tiltSlab(xx-12,-11,24,22,19,3,'mid'));
        if(second)a.push(tiltSlab(xx-12,-10,24,20,22,7,'mid'));
        // U-shaped flag: two arms separated by 10 mm between corresponding edges.
        const flagBase=second?29:22;
        a.push(tiltSlab(xx-3.6,-2,1.2,4,flagBase,19,'hi'),tiltSlab(xx+2.4,-2,1.2,4,flagBase,19,'hi'),tiltSlab(xx-3.6,-2,7.2,4,flagBase+19,2,'hi'));
        a.push(screw(xx-12,9,z+19),screw(xx+12,9,z+19));
        const dir=second?-1:1,cx=xx+dir*23;
        if(s.mode==='collision'){
          if(s.coupling===0){a.push(line([[cx,-14,z+10],[cx+dir*6,-11,z+12],[cx+dir*8,0,z+13],[cx+dir*6,11,z+12],[cx,14,z+10]],'hi'));}
          else a.push(tiltSlab(cx+(dir<0?-3:0),-14,3,28,6,11,'hi'));
        }
        return a.join('');
      }
      function art(){
        markerStart=s.x1;
        let a=`<path class="iso-halo" d="${k.haloOf({x:-20,y:-42,w:650,d:92,r:8},-12,5,P)}"/>`;
        // Adjustable tripod, long extrusion, edge strips and air outlet rows.
        if(s.mode==='accel')a+=slab(8,-17,34,34,-15,s.height*SCALE,'mid',3);
        for(const [x,y] of [[25,0],[570,-31],[570,31]]){
          const lift=x===25&&s.mode==='accel'?s.height*SCALE:0;
          a+=round(x,y,11,-15+lift,3,'lo')+round(x,y,7,-12+lift,9,'mid')+round(x,y,3.5,-3+lift,trackZ(x)-15-lift,'hi')+knob(x,y,8+lift,7);
        }
        for(const x of [25,570])a+=slab(x-12,-41,24,82,trackZ(x)-18,6,'mid',3);
        a+=tiltSlab(0,-23,600,46,-12,12,'mid')+tiltSlab(0,-3,600,6,0,3,'hi');
        a+=tiltSlab(0,-23,600,5,0,2,'mid')+tiltSlab(0,18,600,5,0,2,'mid');
        for(const x of [0,588])a+=tiltSlab(x,-26,12,52,-3,13,'hi');
        a+=tiltSlab(8,24,584,7,-6,.8,'lo');
        for(let x=12;x<=588;x+=6){const z=trackZ(x)-5.2;a+=line([[x,24,z],[x,x%30===0?30:27,z]],x%30===0?'hi':'lo');}
        a+=k.dotsSvg(Array.from({length:29},(_,i)=>[...at([12+i*20,-10,trackZ(12+i*20)+.3])]),{size:.55,tone:'hi'});
        a+=k.dotsSvg(Array.from({length:29},(_,i)=>[...at([12+i*20,10,trackZ(12+i*20)+.3])]),{size:.55,tone:'hi'});
        // Pump and cable are mounted to actual sockets; no floating line ends.
        a+=slab(-51,-57,62,52,-13,40,'mid',7)+slab(-47,-53,54,44,27,3,'mid',5)+knob(-19,-31,30,7);
        for(let i=0;i<5;i++)a+=slab(-42+i*9,-47,4,19,30,.8,'lo',1);
        a+=line([[-5,-31,17],[7,-42,17],[28,-42,20],[28,-23,trackZ(28)-7]],s.air?'hi':'lo');
        const gates=s.mode==='accel'?[s.gate]:[.28,.70];
        // Back portions, then moving carts, then near gate posts produce readable occlusion.
        gates.forEach((x,i)=>{a+=gate(x,i);});
        a+=`<g data-cart1>${cart(s.x1)}</g>`+(s.mode==='collision'?`<g data-cart2>${cart(s.x2,true)}</g>`:'');
        gates.forEach((x,i)=>{a+=gate(x,i,true);});
        a+=slab(365,95,165,66,-12,25,'mid',7)+slab(370,100,155,56,13,4,'hi',5)+slab(379,107,105,29,17,1,'lo',2);
        a+=`<g data-timer></g>`;
        for(const x of [493,511])a+=slab(x,108,10,11,17,3,'hi',2);
        a+=round(391,147,3,17,2,'mid')+round(411,147,3,17,2,'mid');
        for(const [x,y] of [[374,104],[522,104],[374,151],[522,151]])a+=screw(x,y,17);
        a+=line([[391,147,19],[344,145,0],[332,60,0],[gates[0]*SCALE,33,trackZ(gates[0]*SCALE)-10]],'lo');
        if(gates[1])a+=line([[411,147,19],[545,158,0],[609,55,0],[gates[1]*SCALE,33,trackZ(gates[1]*SCALE)-10]],'lo');
        const hits=[['air','气源开关',-19,-31,35],['run','释放滑块',s.x1*SCALE,-1,trackZ(s.x1*SCALE)+30],['reset','数字计时器复位键',508,114,21]];
        if(s.mode==='accel')hits.push(['raise','改变支脚垫高',25,0,12],['gate','将光电门向前移动 5 cm',s.gate*SCALE,33,trackZ(s.gate*SCALE)+15]);
        else hits.push(['coupling','更换碰撞头',s.x1*SCALE+28,12,trackZ(s.x1*SCALE)+13]);
        a+=hits.map(([id,l,x,y,z])=>svgHit(id,l,...at([x,y,z]),id==='run'?23:18)).join('');
        scene.innerHTML=k.figureSvg({width:W,height:H,label:'气垫导轨、两光电门、遮光框、气泵与数字计时器；圆形操作点可以点击或按回车。',body:a});
        live();
      }
      function velocities(){const e=couplings[s.coupling].e;return {v1:(m1-e*m2)/(m1+m2)*U,v2:(1+e)*m1/(m1+m2)*U};}
      function acceleration(){return G*s.height/L;}
      function readInterval(dt){return Number(fixed(PhysLabNoise.sample(dt,.00010,{min:.000001})*1000,3))/1000;}
      function live(){
        const c1=scene.querySelector('[data-cart1]'),c2=scene.querySelector('[data-cart2]');
        // Rebuild only the moving assemblies; the stationary 50+ parts stay untouched.
        if(c1)c1.innerHTML=cart(s.x1);if(c2)c2.innerHTML=cart(s.x2,true);
        const movement=k.translateAlong(P,[(s.x1-markerStart)*SCALE,0,trackZ(s.x1*SCALE)-trackZ(markerStart*SCALE)]);
        scene.querySelector('[data-rig-hit="run"]')?.setAttribute('transform',movement);
        scene.querySelector('[data-rig-hit="coupling"]')?.setAttribute('transform',movement);
        const gates=s.mode==='accel'?[s.gate]:[.28,.70];
        gates.forEach((g,i)=>{const blocked=[s.x1,...(s.mode==='collision'?[s.x2]:[])].some(x=>[-DS/2,DS/2].some(a=>Math.abs(g-(x+a))<ARM/2));const el=scene.querySelector(`[data-beam="${i}"]`);if(el)el.innerHTML=line([[g*SCALE,-17,trackZ(g*SCALE)+36],[g*SCALE,17,trackZ(g*SCALE)+36]],blocked?'hi':'faint');});
        const ds=s.gateTimes.map(v=>v===null?'—':fixed(v*1000,3));
        scene.querySelector('[data-timer]').innerHTML=label([430,118,19],`P1 ${ds[0]} ms`,9)+label([430,130,19],`P2 ${ds[1]} ms`,9);
        read.setAttribute('aria-live',s.running?'off':'polite');
        read.textContent=s.mode==='accel'?`气源${s.air?'已开':'关闭'} · h = ${fixed(s.height*1000,0)} mm · x = ${fixed(s.x1)} m · t = ${fixed(s.t)} s · P1 = ${ds[0]} ms${s.running||!s.last?'':` · s = ${fixed(s.last.d)} m`}`:`${couplings[s.coupling].name} · t = ${fixed(s.t)} s · x₁ = ${fixed(s.x1)} m，x₂ = ${fixed(s.x2)} m · P1/P2 = ${ds.join(' / ')} ms`;
        note.textContent=s.note;
      }
      function reset(){stop();s.running=false;s.t=0;s.last=null;s.gateTimes=[null,null];s.x1=s.mode==='accel'?s.start:.12;s.x2=.55;s.note='已复位。确认气源、导轨状态与读数方法，再释放滑块。';rememberFocus(host,art);}
      function mutate(fn){if(s.running){s.note='运动中先复位，再改变装置。';live();return;}fn();reset();}
      function air(){if(s.running){s.note='运动中的关气会破坏无摩擦模型；先按计时器复位，再关气。';live();return;}s.air=!s.air;s.note=s.air?'气源已开，滑块由薄空气层支承。现在可以点滑块释放。':'气源已关闭。无气时不推动滑块，以免划伤导轨。';rememberFocus(host,art);}
      function raise(){if(s.mode==='collision'){s.note='碰撞需保持水平导轨；垫高只用于匀加速模式。';live();return;}mutate(()=>{s.height=s.height>=.03?.01:s.height+.005;host.querySelector('[data-height]').value=s.height*1000;});}
      function movegate(){if(s.mode!=='accel')return;mutate(()=>{s.gate=s.gate>=.85?.6:s.gate+.05;});}
      function coupling(){if(s.mode!=='collision'){s.note='请先切到水平碰撞模式。';live();return;}mutate(()=>{s.coupling=(s.coupling+1)%3;});s.note=`已换为${couplings[s.coupling].name}；先预测动量与动能，再点滑块。`;live();}
      function run(){
        if(s.running)return;if(!s.air){s.note='先开气源。真实实验中不要在无气时推动滑块。';live();return;}
        reset();s.running=true;s.note='运动中：光电框的两次同向前沿触发 S2 计时；等本次运行结束后记录。';events=[];
        if(s.mode==='accel'){
          const a=acceleration(),x0=s.start,g=s.gate;
          const xa=g-DS/2-ARM/2,xb=g+DS/2-ARM/2;
          const ta=Math.sqrt(2*(xa-x0)/a),tb=Math.sqrt(2*(xb-x0)/a),dt=readInterval(tb-ta);
          events=[{at:tb,gate:0,dt}];runDuration=Math.sqrt(2*(.94-x0)/a);
          const nominalDistance=(xa+xb)/2-x0;
          const d=Number(fixed(PhysLabNoise.sample(nominalDistance,.0015)));
          s.last={mode:'accel',h:s.height,d,nominalDistance,dt,v:DS/dt,a};
          stop=timeline(runDuration*1200,p=>{s.t=p*runDuration;s.x1=x0+.5*a*s.t*s.t;events.filter(e=>s.t>=e.at).forEach(e=>s.gateTimes[e.gate]=e.dt);if(p===1){s.running=false;s.note='本次释放结束。s 取两次触发位置的中点到释放点的距离；v = Δs/Δt 是短程平均速度。';}live();});
        }else{
          const {v1,v2}=velocities(),x10=.12,x20=.55,contactX=x20-(s.coupling===0?62:52)/SCALE,contact=(contactX-x10)/U;
          const segments=[{cart:1,x:x10,v:U,t0:0,t1:contact},{cart:1,x:contactX,v:v1,t0:contact,t1:8},{cart:2,x:x20,v:v2,t0:contact,t1:8}];
          for(const seg of segments){if(Math.abs(seg.v)<1e-9)continue;for(const [gi,g]of [[0,.28],[1,.70]]){const sign=Math.sign(seg.v);const xa=g-sign*(DS/2+ARM/2),xb=g+sign*(DS/2-ARM/2);const ta=seg.t0+(xa-seg.x)/seg.v,tb=seg.t0+(xb-seg.x)/seg.v;if(ta>=seg.t0-1e-9&&tb<=seg.t1&&tb>ta)events.push({at:tb,gate:gi,dt:readInterval(tb-ta),cart:seg.cart,after:seg.t0>0});}}
          const end1=Math.abs(v1)<1e-9?Infinity:contact+((v1>0?.91:.08)-contactX)/v1,end2=contact+(.91-x20)/v2;runDuration=Math.min(end1,end2);
          events=events.filter(e=>e.at<=runDuration).sort((a,b)=>a.at-b.at);
          const measured=(cart,after,velocity)=>{
            const pulse=events.find(event=>event.cart===cart&&event.after===after);
            return pulse?Math.sign(velocity)*DS/pulse.dt:0;
          };
          const u=measured(1,false,U),after1=measured(1,true,v1),after2=measured(2,true,v2);
          s.last={mode:'collision',name:couplings[s.coupling].name,e:couplings[s.coupling].e,v1:after1,v2:after2,u,p0:m1*u,p1:m1*after1+m2*after2,e0:.5*m1*u*u,e1:.5*m1*after1*after1+.5*m2*after2*after2,events};
          stop=timeline(runDuration*1400,p=>{s.t=p*runDuration;if(s.t<=contact){s.x1=x10+U*s.t;s.x2=x20;}else{s.x1=contactX+v1*(s.t-contact);s.x2=x20+v2*(s.t-contact);}events.filter(e=>s.t>=e.at).forEach(e=>s.gateTimes[e.gate]=e.dt);if(p===1){s.running=false;s.note=Math.abs(v1)<1e-9?'碰后滑块 1 停止；通过持续位置不变判断 v₁ = 0，不能把“没有光电脉冲”自动当成零速度。':'本次碰撞结束；速度向右为正，向左为负。计时器显示最后一次经过，各次脉冲见记录。';}live();});
        }
      }
      bindHits(host,{air,raise,gate:movegate,coupling,run,reset});
      for(const [sel,fn]of [['air',air],['raise',raise],['gate',movegate],['coupling',coupling],['run',run],['reset',reset]])host.querySelector(`[data-${sel}]`).addEventListener('click',fn);
      host.querySelector('[data-height]').addEventListener('input',e=>mutate(()=>s.height=Number(e.target.value)/1000));
      host.querySelector('[data-start]').addEventListener('input',e=>mutate(()=>s.start=Number(e.target.value)));
      host.querySelector('[data-mode]').addEventListener('change',e=>{stop();s.running=false;s.mode=e.target.value;host.querySelector('[data-height-wrap]').hidden=s.mode!=='accel';host.querySelector('[data-start-wrap]').hidden=s.mode!=='accel';reset();});
      host.querySelector('[data-record]').addEventListener('click',()=>{
        if(s.running||!s.last){s.note='先完成一次释放；记录来自本次光电触发，不预先填入结果。';live();return;}
        const r=s.last;let cells;
        if(r.mode==='accel'){
          cells=['匀加速',`h=${fixed(r.h*1000,0)} mm；s=${fixed(r.d,3)} m`,fixed(r.dt*1000,3),fixed(r.v,5),`2s=${fixed(2*r.d,3)} m；v²=${fixed(r.v*r.v,6)} m²/s²`];
        }else{
          const pulse=r.events.map(e=>`P${e.gate+1}：${e.after?'碰后':'碰前'}块${e.cart} ${fixed(e.dt*1000,3)}`).join('；');
          cells=['碰撞',r.name,pulse,`u₁=+${fixed(r.u)}；v₁=${fixed(r.v1)}；v₂=+${fixed(r.v2)}`,`p：${fixed(r.p0,4)} → ${fixed(r.p1,4)} kg·m/s；E：${fixed(r.e0,4)} → ${fixed(r.e1,4)} J`];
        }
        s.rows.push(r);host.querySelector('[data-records]').insertAdjacentHTML('beforeend',`<tr>${cells.map(c=>`<td>${c}</td>`).join('')}</tr>`);
        if(r.mode==='accel'){
          const rows=s.rows.filter(a=>a.mode==='accel'&&Math.abs(a.h-r.h)<1e-8),n=rows.length,x=rows.map(a=>2*a.d),y=rows.map(a=>a.v*a.v),sx=x.reduce((a,b)=>a+b,0),sy=y.reduce((a,b)=>a+b,0),sxx=x.reduce((a,b)=>a+b*b,0),sxy=x.reduce((a,b,i)=>a+b*y[i],0),den=n*sxx-sx*sx;
          result.textContent=new Set(rows.map(row=>row.nominalDistance)).size>=2&&Math.abs(den)>1e-12?`同一 h 的 ${n} 组数据拟合 v² = a·(2s)+b：a=${fixed((n*sxy-sx*sy)/den,6)} m/s²；g=aL/h=${fixed((n*sxy-sx*sy)/den*L/r.h,4)} m/s²。有限遮光长度会使短程平均速度与中点瞬时速度有小偏差。`:'再保持 h 不变，改变释放点，至少记录两种 s；建议按教材做多组，再用 v² 对 2s 的斜率求 a。';
        }else result.textContent=`总动量相对差 ${fixed((r.p1-r.p0)/r.p0*100,3)}%；动能减少 ${fixed((r.e0-r.e1)/r.e0*100,2)}%。模型中 e=${r.e}；实际实验应由带方向的碰前后速度计算。${r.e===0?'两个遮光框先后经过 P2，读数应在计时误差范围内接近。':''}`;
        s.note='本次数据已加入记录表。';live();
      });
      host.querySelector('[data-clear]').addEventListener('click',()=>{s.rows=[];host.querySelector('[data-records]').innerHTML='';result.textContent='';});
      art();
    }
  });
})();

</script>
<script>const unitSettings = {"id":"2"};
(function classroom() {
  const lesson = lessons.get(unitSettings.id);
  const bench = benchRegistry.get(unitSettings.id);
  if (!lesson || !bench) throw new Error('缺少仿真实验内容');
  const article = document.createElement('article');
  const key = `lab-${lesson.id}`;
  const sections = lesson.sections.map((section, index) => ({...section, key:`${key}-part-${index+1}`}));
  article.id = key;
  article.className = 'lesson';
  article.setAttribute('aria-labelledby', `${key}-heading`);
  const labelPages = pages => {
    const clean = pages.replace(/^教材(?:\s*\/\s*PDF)?\s*/, '').replace(/^pp\.\s*/, '');
    return /^\d+[\d–、-]*$/.test(clean) ? `第 ${clean} 页` : clean;
  };
  const legacyLink = unitSettings.id === '8' ? '<p class="source">继续练习：<a href="./index.html" target="_blank" rel="noopener">打开原声速学习页、面板操作与拟合工具 ↗</a></p>' : '';
  article.innerHTML = `<header class="hero">
    <p class="kicker">力学 · 实验 ${lesson.id} · 教材 ${labelPages(lesson.pages)}</p>
    <h1 id="${key}-heading">${lesson.title}</h1>
    <p class="lead">${lesson.summary}</p>
    <p class="hint">页码按教材印刷页计。仪器读数与记录为教学模拟。</p>
  </header>
  <nav class="parts" aria-label="本节目录"><a href="#${key}-rig">仿真实验台</a>${sections.map(part => `<a href="#${part.key}">${part.title}</a>`).join('')}</nav>
  <section class="rig-lab" id="${key}-rig"><div class="rig-head"><h2>${bench.title}</h2><p>${bench.intro}</p><p><strong>第一次操作</strong>　${bench.task}</p></div>

<script id="physlab-lesson-guide">(function mountLessonGuide(groups, partSteps) {
  const article = document.querySelector('.unit-content > .lesson');
  const nav = article?.querySelector(':scope > nav.parts');
  if (!nav) return;

  const desktop = matchMedia('(min-width: 900px)');
  function make(tag, className='', text='') {
    const element = document.createElement(tag);
    element.className = className;
    element.textContent = text;
    return element;
  }

  const rail = make('aside','lesson-rail');
  rail.setAttribute('aria-label','本节学习导引');
  const guide = make('details','lesson-guide');
  guide.open = desktop.matches;
  const summary = make('summary','','学习目录');
  const currentTitle = make('span','lesson-guide-current');
  currentTitle.setAttribute('aria-hidden','true');
  summary.append(currentTitle);
  nav.setAttribute('aria-label','本节学习目录');
  const workspace = make('div','lesson-workspace');
  const body = make('div','lesson-body');
  const lab = article.querySelector('.rig-lab');
  const lessonParts = Array.from(article.querySelectorAll('.lesson-part'));
  const quiz = article.querySelector('.rig-question');
  if (quiz) quiz.id ||= `${lab.id}-check`;

  const task = make('details','lesson-task');
  task.open = desktop.matches;
  const taskSummary = make('summary');
  const taskContent = make('div','lesson-task-content');
  const taskTitle = make('strong','lesson-task-title');
  const taskText = make('p','lesson-task-text');
  taskText.setAttribute('aria-live','polite');
  const pager = make('div','lesson-task-pager');
  const previous = make('button','','上一项');
  const next = make('button','','下一项');
  previous.type = next.type = 'button';
  pager.append(previous,next);
  taskContent.append(taskTitle,taskText,pager);
  task.append(taskSummary,taskContent);

  function sectionOf(target) {
    return target.startsWith('part:') ? lessonParts[Number(target.slice(5)) - 1] : target === 'quiz' ? quiz : lab;
  }

  function resolveTarget(step) {
    if (!step.usesBench) return step.topic || step.section;
    if (step.target === 'rig') return lab;
    return Array.from(lab.querySelectorAll(step.target)).find(element=>element.getClientRects().length) || lab;
  }

  nav.replaceChildren();
  const steps = [];
  for (const [index,[group, items]] of groups.entries()) {
    nav.append(make('p','lesson-guide-group',`${index + 1} · ${group}`));
    for (const [title,target,instructions] of items) {
      const index = steps.length;
      const number = String(index + 1).padStart(2,'0');
      const anchor = make('a');
      const hash = `#${article.id}-step-${number}`;
      anchor.href = hash;
      anchor.dataset.stepTarget = target;
      anchor.append(make('span','lesson-guide-number',number),make('span','lesson-guide-label',title));
      const node = make('section','lesson-reading-step');
      node.id = hash.slice(1);
      const heading = make('h2','lesson-reading-title',`${number} ${title}`);
      heading.tabIndex = -1;
      node.append(heading,make('p','lesson-reading-instructions',instructions));
      const section = sectionOf(target);
      const step = {title,target,instructions,index,number,hash,anchor,section,node,heading,usesBench:section===lab};
      steps.push(step);
      nav.append(anchor);
      anchor.addEventListener('click',event=>{
        if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
        event.preventDefault();
        go(step);
      });
    }
  }
  while (nav.nextSibling) body.append(nav.nextSibling);
  nav.before(workspace);
  guide.append(summary,nav);
  rail.append(guide,task);
  workspace.append(rail,body);
  article.parentElement.classList.add('unit-content-with-guide');

  const supplemental = Array.from(body.children).filter(child=>child!==lab && !lessonParts.includes(child));
  body.append(...steps.map(step=>step.node));
  for (const [index, part] of lessonParts.entries()) steps[partSteps[index]-1].node.append(part);

  function continueIn(stepNumber, nodes, className = 'lesson-part') {
    const step = steps[stepNumber - 1];
    const continuation = make('div',className);
    continuation.append(...nodes);
    step.node.append(continuation);
    step.topic = continuation;
  }

  // Some textbook sections cover multiple steps. Keep each original passage with its task.
  if (article.id === 'lab-1') {
    const subsections = lessonParts[3].querySelectorAll(':scope > h3');
    for (const [index, stepNumber] of [8,9,11].entries()) {
      const heading = subsections[index + 1];
      continueIn(stepNumber,[heading,heading.nextElementSibling]);
    }
  } else if (article.id === 'lab-5') {
    continueIn(10,[lessonParts[2].querySelector('[data-vsim] details:has([data-ct1])')],'lesson-part sim');
  } else if (article.id === 'lab-7') {
    const [,,drive,link,hint] = lessonParts[0].querySelectorAll(':scope > p, :scope > .formula');
    continueIn(9,[drive]);
    continueIn(10,[link,hint]);
  }

  const quizStep = steps.find(step=>step.target==='quiz');
  quizStep?.node.append(quiz);
  for (const node of supplemental) steps.at(-1).node.append(node);

  for (const step of steps) {
    if (step.usesBench) {
      step.benchSlot = make('div','lesson-bench-slot');
      step.openBench = make('button','lesson-open-bench','打开仿真实验台');
      step.openBench.type = 'button';
      step.node.append(step.openBench,step.benchSlot);
      step.openBench.addEventListener('click',()=>{
        moveBench(step);
        mark(step);
        scrollToTarget(resolveTarget(step),true);
      });
    } else if (!step.topic && step.target.startsWith('part:') && step.section?.parentElement!==step.node) {
      const link = make('a','lesson-related-part',step.section.querySelector('h2').textContent);
      link.href = `#${step.section.id}`;
      step.node.append(link);
      step.topic = link;
    }
  }

  let benchStep;
  function moveBench(step) {
    if (step===benchStep) return;
    if (benchStep) benchStep.openBench.textContent = '打开仿真实验台';
    // An instrument can serve multiple steps. Move its mounted node and keep its measurements.
    step.benchSlot.append(lab);
    step.openBench.textContent = '定位本步操作';
    benchStep = step;
  }

  moveBench(steps.find(step=>step.usesBench));

  let active;
  let targetHighlight;
  let heldScroll;
  function mark(step) {
    if (!step || step === active) return;
    active?.anchor.removeAttribute('aria-current');
    active = step;
    step.anchor.setAttribute('aria-current','step');
    currentTitle.textContent = `${step.number} ${step.title}`;
    taskSummary.textContent = `本步任务 ${step.index + 1}/${steps.length}`;
    taskTitle.textContent = step.title;
    taskText.textContent = step.instructions;
    previous.disabled = step.index === 0;
    next.disabled = step.index === steps.length - 1;
    if (guide.open) {
      const row = step.anchor.getBoundingClientRect();
      const list = nav.getBoundingClientRect();
      if (row.top < list.top) nav.scrollTop -= list.top - row.top + 4;
      if (row.bottom > list.bottom) nav.scrollTop += row.bottom - list.bottom + 4;
    }
  }

  function highlight(target, focus) {
    if (!target) return;
    targetHighlight?.classList.remove('lesson-step-target');
    targetHighlight = target;
    target.classList.add('lesson-step-target');
    if (focus) {
      if (!target.matches('a,button,input,select,textarea,summary,[tabindex]')) target.setAttribute('tabindex','-1');
      target.focus?.({preventScroll:true});
    }
  }

  function scrollToTarget(target, focus) {
    if (!target) return;
    if (target === quiz) quiz.open = true;
    if (focus) highlight(target,true);
    const offset = desktop.matches ? 44 : rail.getBoundingClientRect().height + 20;
    window.scrollTo({top:window.scrollY + target.getBoundingClientRect().top - offset,behavior:'instant'});
    heldScroll = window.scrollY;
  }

  function go(step, writeHistory=true) {
    if (!step) return;
    if (writeHistory && location.hash !== step.hash) history.pushState(null,'',step.hash);
    if (!desktop.matches) guide.open = false;
    mark(step);
    task.open = true;
    if (step.usesBench) moveBench(step);
    if (step.target === 'quiz') quiz.open = true;
    highlight(resolveTarget(step),false);
    if (writeHistory) step.heading.focus({preventScroll:true});
    scrollToTarget(step.node,false);
  }

  previous.addEventListener('click',()=>go(steps[active.index - 1]));
  next.addEventListener('click',()=>go(steps[active.index + 1]));
  guide.addEventListener('toggle',()=>{ if (!desktop.matches && guide.open) task.open = false; });
  task.addEventListener('toggle',()=>{ if (!desktop.matches && task.open) guide.open = false; });

  let scheduled = false;
  function track() {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(()=>{
      scheduled = false;
      if (heldScroll !== undefined && Math.abs(window.scrollY - heldScroll) < 12) return;
      heldScroll = undefined;
      const readingLine = desktop.matches ? 92 : rail.getBoundingClientRect().height + 24;
      const atEnd = window.scrollY > 0 && window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 2;
      mark(atEnd ? steps.at(-1) : steps.findLast(step=>step.node.getBoundingClientRect().top <= readingLine) || steps[0]);
    });
  }

  window.addEventListener('scroll',track,{passive:true});
  window.addEventListener('resize',track);
  desktop.addEventListener('change',()=>{guide.open = task.open = desktop.matches;track();});
  const followFragment = () => {
    const step = steps.find(item=>item.hash===location.hash);
    if (step) { go(step,false); return; }
    const target = document.getElementById(location.hash.slice(1));
    if (target === lab || target === quiz || lessonParts.includes(target)) {
      mark(steps.find(item=>item.node===target.closest('.lesson-reading-step')));
      scrollToTarget(target,false);
    }
  };
  window.addEventListener('hashchange',followFragment);
  mark(steps[0]);
  followFragment();
