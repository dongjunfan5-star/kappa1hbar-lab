<script id="physlab-lesson-guide">(function mountLessonGuide(groups, partSteps) {
  const article = document.querySelector('.unit-content > .lesson');
  const nav = article?.querySelector(':scope > nav.parts');
  if (!nav) return;

  const desktop = matchMedia('(min-width: 900px)');
  function make(tag, className='', text='') {
    const element = document.createElement(tag);
    element.className = className;
    element.textContent = text;
    return element;
  }

  const rail = make('aside','lesson-rail');
  rail.setAttribute('aria-label','本节学习导引');
  const guide = make('details','lesson-guide');
  guide.open = desktop.matches;
  const summary = make('summary','','学习目录');
  const currentTitle = make('span','lesson-guide-current');
  currentTitle.setAttribute('aria-hidden','true');
  summary.append(currentTitle);
  nav.setAttribute('aria-label','本节学习目录');
  const workspace = make('div','lesson-workspace');
  const body = make('div','lesson-body');
  const lab = article.querySelector('.rig-lab');
  const lessonParts = Array.from(article.querySelectorAll('.lesson-part'));
  const quiz = article.querySelector('.rig-question');
  if (quiz) quiz.id ||= `${lab.id}-check`;

  const task = make('details','lesson-task');
  task.open = desktop.matches;
  const taskSummary = make('summary');
  const taskContent = make('div','lesson-task-content');
  const taskTitle = make('strong','lesson-task-title');
  const taskText = make('p','lesson-task-text');
  taskText.setAttribute('aria-live','polite');
  const pager = make('div','lesson-task-pager');
  const previous = make('button','','上一项');
  const next = make('button','','下一项');
  previous.type = next.type = 'button';
  pager.append(previous,next);
  taskContent.append(taskTitle,taskText,pager);
  task.append(taskSummary,taskContent);

  function sectionOf(target) {
    return target.startsWith('part:') ? lessonParts[Number(target.slice(5)) - 1] : target === 'quiz' ? quiz : lab;
  }

  function resolveTarget(step) {
    if (!step.usesBench) return step.topic || step.section;
    if (step.target === 'rig') return lab;
    return Array.from(lab.querySelectorAll(step.target)).find(element=>element.getClientRects().length) || lab;
  }

  nav.replaceChildren();
  const steps = [];
  for (const [index,[group, items]] of groups.entries()) {
    nav.append(make('p','lesson-guide-group',`${index + 1} · ${group}`));
    for (const [title,target,instructions] of items) {
      const index = steps.length;
      const number = String(index + 1).padStart(2,'0');
      const anchor = make('a');
      const hash = `#${article.id}-step-${number}`;
      anchor.href = hash;
      anchor.dataset.stepTarget = target;
      anchor.append(make('span','lesson-guide-number',number),make('span','lesson-guide-label',title));
      const node = make('section','lesson-reading-step');
      node.id = hash.slice(1);
      const heading = make('h2','lesson-reading-title',`${number} ${title}`);
      heading.tabIndex = -1;
      node.append(heading,make('p','lesson-reading-instructions',instructions));
      const section = sectionOf(target);
      const step = {title,target,instructions,index,number,hash,anchor,section,node,heading,usesBench:section===lab};
      steps.push(step);
      nav.append(anchor);
      anchor.addEventListener('click',event=>{
        if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
        event.preventDefault();
        go(step);
      });
    }
  }
  while (nav.nextSibling) body.append(nav.nextSibling);
  nav.before(workspace);
  guide.append(summary,nav);
  rail.append(guide,task);
  workspace.append(rail,body);
  article.parentElement.classList.add('unit-content-with-guide');

  const supplemental = Array.from(body.children).filter(child=>child!==lab && !lessonParts.includes(child));
  body.append(...steps.map(step=>step.node));
  for (const [index, part] of lessonParts.entries()) steps[partSteps[index]-1].node.append(part);

  function continueIn(stepNumber, nodes, className = 'lesson-part') {
    const step = steps[stepNumber - 1];
    const continuation = make('div',className);
    continuation.append(...nodes);
    step.node.append(continuation);
    step.topic = continuation;
  }

  // Some textbook sections cover multiple steps. Keep each original passage with its task.
  if (article.id === 'lab-1') {
    const subsections = lessonParts[3].querySelectorAll(':scope > h3');
    for (const [index, stepNumber] of [8,9,11].entries()) {
      const heading = subsections[index + 1];
      continueIn(stepNumber,[heading,heading.nextElementSibling]);
    }
  } else if (article.id === 'lab-5') {
    continueIn(10,[lessonParts[2].querySelector('[data-vsim] details:has([data-ct1])')],'lesson-part sim');
  } else if (article.id === 'lab-7') {
    const [,,drive,link,hint] = lessonParts[0].querySelectorAll(':scope > p, :scope > .formula');
    continueIn(9,[drive]);
    continueIn(10,[link,hint]);
  }

  const quizStep = steps.find(step=>step.target==='quiz');
  quizStep?.node.append(quiz);
  for (const node of supplemental) steps.at(-1).node.append(node);

  for (const step of steps) {
    if (step.usesBench) {
      step.benchSlot = make('div','lesson-bench-slot');
      step.openBench = make('button','lesson-open-bench','打开仿真实验台');
      step.openBench.type = 'button';
      step.node.append(step.openBench,step.benchSlot);
      step.openBench.addEventListener('click',()=>{
        moveBench(step);
        mark(step);
        scrollToTarget(resolveTarget(step),true);
      });
    } else if (!step.topic && step.target.startsWith('part:') && step.section?.parentElement!==step.node) {
      const link = make('a','lesson-related-part',step.section.querySelector('h2').textContent);
      link.href = `#${step.section.id}`;
      step.node.append(link);
      step.topic = link;
    }
  }

  let benchStep;
  function moveBench(step) {
    if (step===benchStep) return;
    if (benchStep) benchStep.openBench.textContent = '打开仿真实验台';
    // An instrument can serve multiple steps. Move its mounted node and keep its measurements.
    step.benchSlot.append(lab);
    step.openBench.textContent = '定位本步操作';
    benchStep = step;
  }

  moveBench(steps.find(step=>step.usesBench));

  let active;
  let targetHighlight;
  let heldScroll;
  function mark(step) {
    if (!step || step === active) return;
    active?.anchor.removeAttribute('aria-current');
    active = step;
    step.anchor.setAttribute('aria-current','step');
    currentTitle.textContent = `${step.number} ${step.title}`;
    taskSummary.textContent = `本步任务 ${step.index + 1}/${steps.length}`;
    taskTitle.textContent = step.title;
    taskText.textContent = step.instructions;
    previous.disabled = step.index === 0;
    next.disabled = step.index === steps.length - 1;
    if (guide.open) {
      const row = step.anchor.getBoundingClientRect();
      const list = nav.getBoundingClientRect();
      if (row.top < list.top) nav.scrollTop -= list.top - row.top + 4;
      if (row.bottom > list.bottom) nav.scrollTop += row.bottom - list.bottom + 4;
    }
  }

  function highlight(target, focus) {
    if (!target) return;
    targetHighlight?.classList.remove('lesson-step-target');
    targetHighlight = target;
    target.classList.add('lesson-step-target');
    if (focus) {
      if (!target.matches('a,button,input,select,textarea,summary,[tabindex]')) target.setAttribute('tabindex','-1');
      target.focus?.({preventScroll:true});
    }
  }

  function scrollToTarget(target, focus) {
    if (!target) return;
    if (target === quiz) quiz.open = true;
    if (focus) highlight(target,true);
    const offset = desktop.matches ? 44 : rail.getBoundingClientRect().height + 20;
    window.scrollTo({top:window.scrollY + target.getBoundingClientRect().top - offset,behavior:'instant'});
    heldScroll = window.scrollY;
  }

  function go(step, writeHistory=true) {
    if (!step) return;
    if (writeHistory && location.hash !== step.hash) history.pushState(null,'',step.hash);
    if (!desktop.matches) guide.open = false;
    mark(step);
    task.open = true;
    if (step.usesBench) moveBench(step);
    if (step.target === 'quiz') quiz.open = true;
    highlight(resolveTarget(step),false);
    if (writeHistory) step.heading.focus({preventScroll:true});
    scrollToTarget(step.node,false);
  }

  previous.addEventListener('click',()=>go(steps[active.index - 1]));
  next.addEventListener('click',()=>go(steps[active.index + 1]));
  guide.addEventListener('toggle',()=>{ if (!desktop.matches && guide.open) task.open = false; });
  task.addEventListener('toggle',()=>{ if (!desktop.matches && task.open) guide.open = false; });

  let scheduled = false;
  function track() {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(()=>{
      scheduled = false;
      if (heldScroll !== undefined && Math.abs(window.scrollY - heldScroll) < 12) return;
      heldScroll = undefined;
      const readingLine = desktop.matches ? 92 : rail.getBoundingClientRect().height + 24;
      const atEnd = window.scrollY > 0 && window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 2;
      mark(atEnd ? steps.at(-1) : steps.findLast(step=>step.node.getBoundingClientRect().top <= readingLine) || steps[0]);
    });
  }

  window.addEventListener('scroll',track,{passive:true});
  window.addEventListener('resize',track);
  desktop.addEventListener('change',()=>{guide.open = task.open = desktop.matches;track();});
  const followFragment = () => {
    const step = steps.find(item=>item.hash===location.hash);
    if (step) { go(step,false); return; }
    const target = document.getElementById(location.hash.slice(1));
    if (target === lab || target === quiz || lessonParts.includes(target)) {
      mark(steps.find(item=>item.node===target.closest('.lesson-reading-step')));
      scrollToTarget(target,false);
    }
  };
  window.addEventListener('hashchange',followFragment);
  mark(steps[0]);
  followFragment();
})([["定针向并标定线圈产生的磁场",[["辨认磁力摆、探头和亥姆霍兹线圈","part:1","按图 17-4 找到同轴的双线圈和悬挂磁针。相同摆动状态重复一次对应一个完整周期。"],["按断电时的针向调整线圈轴","[data-m17-align]","点「对准地磁」，让线圈轴平行于地磁水平分量。这样才可在同一轴上比较线圈场与地磁场。"],["测中心磁场随电流变化","[data-m17-mode]","选「线圈磁场」，把探头移到中点。记录 I＝0 的底值及至少两档非零电流，检查扣除底值后中心场随带符号电流的斜率。"]]],["小角度计时，外推地磁分量",[["辨认同向、反向并选可测电流","[data-m17-sign]","切回「测地磁」，用小电流比较同向、反向的周期。选反向的若干档，留在磁针原平衡方向且远离抵消点。"],["每档计满五周期再记录","[data-m17-release]","以同样的小角度释放，等计时结束再点「记录读数」。可用反向 1.00、1.50、2.00 mA 做三组。"],["从 1/T² 直线的横截距求 B₀","[data-m17-result]","拟合带符号电流与 1/T²，取 1/T²＝0 对应的电流大小。用中心磁场标定斜率乘该电流，得到地磁水平分量。"]]],["改变转动惯量，分开求磁矩",[["记下无配重和有配重的周期","[data-m17-mode]","选「加配重」。先测裸针，再装上两个对称螺帽，保持同一磁场，分别释放并记录。"],["由已知配重算磁矩与转动惯量","part:4","把螺帽视为质点，先算转动惯量增量 ΔJ，再用两次周期的平方差求磁矩和裸针的转动惯量。"]]],["拓展到双针与非简谐振动",[["比较同相、反相和只拨一针","[data-m17-mode]","选「双针耦合」。同一针间距各试三种初态，再改变针间距，观察两种简正频率和能量轮流转移形成的拍。"],["改变释放角，再比较三种阻尼","[data-m17-mode]","选「大角度与阻尼」，先在近似无阻尼下比较 5° 内外的偏角曲线。回到小角度，比较欠阻尼、临界阻尼和过阻尼的回零过程。"],["用合场解释周期为何变长","quiz","固定磁针和释放角，比较反向线圈场变强前后。用回复力矩的大小判断周期变化。"]]]],[1,4,3,8,9,11,11]);</script>
