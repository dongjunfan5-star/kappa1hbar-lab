      // The upper carriage moves; the spring lower end and mirror follow equilibrium.
      let upper=G.box(-51,-37,12,12,250,10,'upper-slider','mid')+G.box(-39,-33,57,6,253,5,'upper-carriage-arm')+G.box(12,-27,6,34,253,5,'spring-forward-arm')+G.cyl(15,4,3,249,4,'spring-top-eye');
      upper+=G.knob(-43,-35,260,'upper-handwheel');body+=`<g data-pupper>${upper}</g>`;
      body+=`<path data-pcoil-back class="iso-line" data-tone="lo"/><path data-pcoil-front class="iso-line" data-tone="hi"/>`;
      let hanger=G.cyl(15,4,1.2,126,25,'hook-stem')+G.cyl(15,4,9,121,2,'weight-pan','hi')+G.ring(15,4,9,123,'hi');
      hanger+=G.box(10,3,10,2,137,10,'mirror-frame','mid')+G.box(11,5.2,8,.6,138,8,'mirror-face','hi');
      hanger+=G.line([15,4,121],[15,4,92],'hi')+G.line([-1,4,86],[-1,4,92],'hi')+G.line([-1,4,92],[31,4,92],'hi')+G.line([31,4,92],[31,4,86],'hi');
      body+=`<g data-phanger>${hanger}</g><path data-pfilm fill="currentColor" opacity=".11" stroke="currentColor" stroke-width=".6"/>`;
      body+=G.box(8,9,1.2,2,120,44,'reference-glass-left-rail','lo')+G.box(20.8,9,1.2,2,120,44,'reference-glass-right-rail','lo')+G.box(9.2,9,11.6,2,120,1.2,'reference-glass-bottom-rail','lo')+G.box(9.2,9,11.6,2,162.8,1.2,'reference-glass-top-rail','lo')+`<g opacity=".18">${G.box(9.2,9.2,11.6,.6,121.2,41.6,'reference-glass','hi')}</g>`;
      body+=`<path data-pmirror class="iso-line" data-tone="hi"/><path data-preflection class="iso-line" data-tone="lo"/>`+G.line([9,10,142],[21,10,142],'hi');
      // Engraved vertical ruler and 0.5–5 g weight set.
      body+=G.box(-52,-26,6,2,170,78,'rod-ruler','lo');for(let z=174;z<=246;z+=4)body+=G.line([-52,-24,z],[-52+(z%20===14?6:3),-24,z]);
      body+=G.box(49,-40,30,49,0,3,'weights-tray','lo');
      for(let i=0;i<10;i++){const x=56+(i%2)*15,y=-33+Math.floor(i/2)*9;body+=G.cyl(x,y,3.1,3,3,'calibration-weight-'+i,'mid')+G.cyl(x,y,1.2,6,1.6,'weight-grip-'+i,'hi');}
      const hit=(id,label,pt,r)=>svgHit(id,label,...at(pt),r);
      body+=hit('p-platform','平台手轮：下降0.5毫米',[44,25,16],22)+hit('p-upper','上杆手轮：上调0.25毫米',[-43,-35,265],22)+hit('p-mirror','三线镜：检查对齐',[15,10,142],22)+hit('p-pan','挂盘：空挂归零或浸润',[15,4,123],20)+hit('p-cup','烧杯：切换液体',[15,4,70],24)+hit('p-weights','砝码盘：查看下一组标定读数',[63,-15,6],23);
      host.innerHTML=`<div class="rig-scene" data-parts="${G.count}">${k.figureSvg({width:620,height:470,label:'约利弹簧秤，手轮、三线镜、挂盘、烧杯、砝码均可用键盘或点击操作',body:[body]})}</div><p class="rig-readout" data-pread aria-live="off"></p><p data-pstatus role="status">先点挂盘：记录空挂基线。再点一次，浸润金属丝。</p><div class="rig-tools"><button data-pact="prepare" type="button">空挂归零 / 浸润</button><button data-pact="down" type="button">平台下降0.5 mm</button><button data-pact="up" type="button">上杆上调0.25 mm</button><button data-pact="align" type="button">辅助恢复三线对齐</button><button data-pact="record" type="button">记录临界读数</button><button data-pact="reset" type="button">重新浸润</button></div><div class="rig-tools"><label>上杆增量 / mm <input data-pad type="range" min="0" max="5" step="0.05" value="0"></label></div><p data-pcal class="hint">已标定弹簧 k＝2.00 N/m。点击砝码可逐次查看0.5～5 g的模拟标定读数；旧章节保留完整拟合练习。</p><p class="hint">教学模型：有效丝长 s＝50.0 mm，纯水20°C的σ＝72.75 mN/m；肥皂水32.0 mN/m为假设样品。附加伸长由ΔF/k决定；液膜拉力随形状逐渐增大至2σs。6 mm达到极限、6.8 mm破膜是示范用几何阈值，不是教材实测。弹簧位移放大4倍；用杆位移测力，不把液膜高度当成弹簧伸长。</p><div class="table-wrap"><table><thead><tr><th>样品</th><th>上杆增量 / mm</th><th>ΔF / mN</th><th>σ / mN·m⁻¹</th><th>诊断</th></tr></thead><tbody data-prows></tbody></table></div><p class="hint">依据：教材pp.103–108，约利装置图6-3与三线对齐、5次拉脱操作。原创示意；旧章节的毛细管上升模式仍可独立练习。</p>`;
      const say=s=>q('[data-pstatus]').textContent=s;
      function coil(bottom,top){const back=[],front=[];let old=at([15,4,bottom]);for(let i=0;i<=240;i++){const t=i/240,theta=t*Math.PI*20,r=3+6*t,pt=at([15+r*Math.cos(theta),4+r*Math.sin(theta),bottom+(top-bottom)*t]);const arr=Math.cos(theta-P.azimuth*Math.PI/180)>0?front:back;arr.push(`M${old[0]} ${old[1]}L${pt[0]} ${pt[1]}`);old=pt;}const end=at([15,4,top]);front.push(`M${old[0]} ${old[1]}L${end[0]} ${end[1]}`);return {back:back.join(''),front:front.join('')};}
      function draw(){
        let m=model();if(wet&&!broken&&m.span>6.8){broken=true;m=model();say('液膜已经破裂，附加拉力归零。此刻读数不能用来算表面张力；重新浸润后捕捉破裂前的极值。');}
        q('[data-pstage]').setAttribute('transform',k.translateAlong(P,[0,0,-p*4]));q('[data-pupper]').setAttribute('transform',k.translateAlong(P,[0,0,a*4]));q('[data-pspindle]').innerHTML=k.solidSvg(k.cylinder(15,4,3.3,4,Math.max(3,47-p*4),P,40,.35),{tone:'mid'});
        q('[data-phanger]').setAttribute('transform',k.translateAlong(P,[0,0,-m.error*4]));
        const c=coil(151-m.error*4,249+a*4);q('[data-pcoil-back]').setAttribute('d',c.back);q('[data-pcoil-front]').setAttribute('d',c.front);
        q('[data-pmirror]').setAttribute('d',k.segment([9,10,142-m.error*4],[21,10,142-m.error*4],P));q('[data-preflection]').setAttribute('d',k.segment([9,10,142+m.error*4],[21,10,142+m.error*4],P));
        const zt=92-m.error*4,zb=92-p*4;
        q('[data-pfilm]').setAttribute('d',wet&&!broken?k.pathOf([at([-1,4,zt]),at([31,4,zt]),at([36,4,zb]),at([-6,4,zb])],true):'');
        q('[data-rig-hit="p-upper"]').setAttribute('transform',k.translateAlong(P,[0,0,a*4]));q('[data-rig-hit="p-pan"]').setAttribute('transform',k.translateAlong(P,[0,0,-m.error*4]));q('[data-pad]').value=a.toFixed(2);
        q('[data-pread]').textContent=`${!zero?'空挂待归零':!wet?'基线已记':broken?'液膜破裂':'液膜连接'} · 平台下降 ${p.toFixed(2)} mm · 上杆增量 ${readRod().toFixed(3)} mm · 三线偏差 ${Math.abs(m.error).toFixed(2)} mm · 模型液膜拉力 ${(m.extra*1000).toFixed(3)} mN`;
      }
      function move(np,na){cancel();const p0=p,a0=a;moving=true;cancel=timeline(260,t=>{const u=t*t*(3-2*t);p=p0+(np-p0)*u;a=a0+(na-a0)*u;if(t===1){moving=false;ruler.reset();lastRecord=undefined;}draw();});}
      function reset(){cancel();moving=false;p=0;a=0;broken=false;wet=zero;ruler.reset();lastRecord=undefined;draw();say(zero?'重新浸润。请慢慢下降平台，每次都恢复三线对齐。':'先记录空挂基线。');}
      function prepare(){if(!zero){zero=true;draw();say('空挂基线l₀已记录，金属丝自重由后续读数差扣除。再点挂盘浸润。');}else {wet=true;reset();}}
      function down(){if(!wet){say('尚未浸润：先空挂归零，再点挂盘。');return;}if(moving)return;if(broken){say('液膜已经破裂；重新浸润后再测。');return;}move(Math.min(10,p+.5),a);}
      function up(){if(!wet){say('先完成空挂基线与浸润。');return;}if(moving)return;move(p,Math.min(5,a+.25));}
      function align(){if(!wet||broken){say('先浸润完整液膜，再调三线。破裂后没有附加表面拉力可读。');return;}if(moving)return;const target=2*sigma()*.05*clamp(p/6,0,1)/2*1000;move(p,target);say('辅助调整上杆，令下端回到固定基准。观察三条线汇合后，再继续下降平台。');}
      function record(){if(!wet){say('尚未形成液膜，不能记录拉脱读数。');return;}const m=model();if(broken){say('这次读数取晚了：液膜已破裂，表面附加力消失。重新浸润，尝试在破裂前读数。');return;}if(moving||Math.abs(m.error)>.08){say('三线尚未对齐。若下端位置变化，杆位移就不再等于弹簧伸长变化；先上调杆位恢复基准。');return;}
        if(lastRecord===readRod())ruler.reset();
        const rod=readRod();lastRecord=rod;
        const estimate=2*rod/1000/(2*.05)*1000,near=m.extra>=.995*m.peak;
        rows.push(`<tr><td>${liquid==='water'?'纯水':'肥皂水（假设）'}</td><td>${rod.toFixed(3)}</td><td>${(2*rod).toFixed(3)}</td><td>${estimate.toFixed(2)}</td><td>${near?'临界且对齐':'尚未达极值'}</td></tr>`);table(host,'[data-prows]',rows);draw();
        say(near?'已在近临界且三线对齐时记录。再下降一小步观察破裂后的变化，然后重新浸润重复测量。':'三线对齐了，但液膜还没有接近最大拉力，因此σ偏小。再小步下降平台并重新对齐，比较下一次记录。');
      }
      const actions={prepare,down,up,align,record,reset};q('.rig-tools').addEventListener('click',e=>{const b=e.target.closest('[data-pact]');if(b)actions[b.dataset.pact]();});
      q('[data-pad]').addEventListener('input',e=>{if(!wet){e.target.value=a;say('先空挂归零并浸润，再调杆位。');return;}move(p,Number(e.target.value));});
      bindHits(host,{'p-platform':down,'p-upper':up,'p-mirror':()=>{const m=model();say(Math.abs(m.error)<.08?'三线已对齐：弹簧下端回到同一基准。':'三线未重合：调上杆位置，使镜中横线、基准线与反射像重合。');},'p-pan':prepare,'p-cup':()=>{liquid=liquid==='water'?'soap':'water';reset();say(liquid==='water'?'换为20°C纯水，重新测量。':'换为假设肥皂水样品，重新测量，比较临界伸长是否变小。');},'p-weights':()=>{weight=weight>=5?.5:weight+.5;const force=weight*9.81;
        const extension=Number(PhysLabNoise.sample(force/2,.025).toFixed(3));
        q('[data-pcal]').textContent=`标定模拟：m＝${weight.toFixed(1)} g，F＝${force.toFixed(3)} mN，伸长＝${extension.toFixed(3)} mm；F/Δl＝${(force/extension).toFixed(3)} N/m。砝码标定应在测液体之前完成。`;}});
      // Arrow keys on the physical handwheels offer finer control without leaving the figure.
      host.addEventListener('keydown',e=>{const el=e.target.closest('[data-rig-hit]');if(!el||!['ArrowUp','ArrowDown'].includes(e.key))return;const id=el.dataset.rigHit;if(id==='p-upper'&&wet){e.preventDefault();move(p,clamp(a+(e.key==='ArrowUp'?.05:-.05),0,5));}if(id==='p-platform'&&wet&&!broken){e.preventDefault();move(clamp(p+(e.key==='ArrowDown'?.1:-.1),0,10),a);}});
      table(host,'[data-prows]',rows);draw();return {dispose:()=>cancel()};
    }
  });
})();

<script>const unitSettings = {"id":"6"};
(function classroom() {
  const lesson = lessons.get(unitSettings.id);
  const bench = benchRegistry.get(unitSettings.id);
  if (!lesson || !bench) throw new Error('缺少仿真实验内容');
  const article = document.createElement('article');
  const key = `lab-${lesson.id}`;
  const sections = lesson.sections.map((section, index) => ({...section, key:`${key}-part-${index+1}`}));
  article.id = key;
  article.className = 'lesson';
  article.setAttribute('aria-labelledby', `${key}-heading`);
  const labelPages = pages => {
    const clean = pages.replace(/^教材(?:\s*\/\s*PDF)?\s*/, '').replace(/^pp\.\s*/, '');
    return /^\d+[\d–、-]*$/.test(clean) ? `第 ${clean} 页` : clean;
  };
  const legacyLink = unitSettings.id === '8' ? '<p class="source">继续练习：<a href="./index.html" target="_blank" rel="noopener">打开原声速学习页、面板操作与拟合工具 ↗</a></p>' : '';
  article.innerHTML = `<header class="hero">
    <p class="kicker">力学 · 实验 ${lesson.id} · 教材 ${labelPages(lesson.pages)}</p>
    <h1 id="${key}-heading">${lesson.title}</h1>
    <p class="lead">${lesson.summary}</p>
    <p class="hint">页码按教材印刷页计。仪器读数与记录为教学模拟。</p>
  </header>
  <nav class="parts" aria-label="本节目录"><a href="#${key}-rig">仿真实验台</a>${sections.map(part => `<a href="#${part.key}">${part.title}</a>`).join('')}</nav>
  <section class="rig-lab" id="${key}-rig"><div class="rig-head"><h2>${bench.title}</h2><p>${bench.intro}</p><p><strong>第一次操作</strong>　${bench.task}</p></div>
    <div class="rig-instrument"><div class="rig-bar"><strong>实验 ${lesson.id} · 仪器台</strong><span>点击图中绿色标记操作，也可用 Tab 和 Enter。</span></div><div class="iso rig-host"></div></div>
    <details class="rig-question"><summary>做完后，试着解释读数</summary><p>${bench.question.prompt}</p><div class="rig-choices"></div><p class="rig-feedback" aria-live="polite"></p></details>
  </section>
  ${legacyLink}
  ${sections.map((part, index) => `<section class="lesson-part" id="${part.key}"><div class="part-head"><h2>${part.title}</h2><span class="page-ref">${labelPages(part.pages)}</span>${index === 0 ? `<a class="page-ref" href="#${key}-rig">打开本节仿真实验台 ↑</a>` : ''}</div>${part.html}</section>`).join('')}`;
  const main = document.getElementById('course');
  main.append(article);
  lesson.mount?.(article);
  mountBench(article, bench);
  if (window === window.top) {
    const navigation = document.createElement('nav');
    navigation.className = 'unit-return';
    navigation.setAttribute('aria-label','网站目录');
    navigation.innerHTML = '<a href="../../index.html">← 返回实验站</a>';
    main.before(navigation);
  }
  if (location.hash) requestAnimationFrame(() => document.getElementById(location.hash.slice(1))?.scrollIntoView());
})();</script>
<script id="physlab-lesson-guide">(function mountLessonGuide(groups, partSteps) {
  const article = document.querySelector('.unit-content > .lesson');
  const nav = article?.querySelector(':scope > nav.parts');
  if (!nav) return;

  const desktop = matchMedia('(min-width: 900px)');
  function make(tag, className='', text='') {
    const element = document.createElement(tag);
    element.className = className;
    element.textContent = text;
    return element;
  }

  const rail = make('aside','lesson-rail');
  rail.setAttribute('aria-label','本节学习导引');
  const guide = make('details','lesson-guide');
  guide.open = desktop.matches;
  const summary = make('summary','','学习目录');
  const currentTitle = make('span','lesson-guide-current');
  currentTitle.setAttribute('aria-hidden','true');
  summary.append(currentTitle);
  nav.setAttribute('aria-label','本节学习目录');
  const workspace = make('div','lesson-workspace');
  const body = make('div','lesson-body');
  const lab = article.querySelector('.rig-lab');
  const lessonParts = Array.from(article.querySelectorAll('.lesson-part'));
  const quiz = article.querySelector('.rig-question');
  if (quiz) quiz.id ||= `${lab.id}-check`;

  const task = make('details','lesson-task');
  task.open = desktop.matches;
  const taskSummary = make('summary');
  const taskContent = make('div','lesson-task-content');
  const taskTitle = make('strong','lesson-task-title');
  const taskText = make('p','lesson-task-text');
  taskText.setAttribute('aria-live','polite');
  const pager = make('div','lesson-task-pager');
  const previous = make('button','','上一项');
  const next = make('button','','下一项');
  previous.type = next.type = 'button';
  pager.append(previous,next);
  taskContent.append(taskTitle,taskText,pager);
  task.append(taskSummary,taskContent);

  function sectionOf(target) {
    return target.startsWith('part:') ? lessonParts[Number(target.slice(5)) - 1] : target === 'quiz' ? quiz : lab;
  }

  function resolveTarget(step) {
    if (!step.usesBench) return step.topic || step.section;
    if (step.target === 'rig') return lab;
    return Array.from(lab.querySelectorAll(step.target)).find(element=>element.getClientRects().length) || lab;
  }

  nav.replaceChildren();
  const steps = [];
  for (const [index,[group, items]] of groups.entries()) {
    nav.append(make('p','lesson-guide-group',`${index + 1} · ${group}`));
    for (const [title,target,instructions] of items) {
      const index = steps.length;
      const number = String(index + 1).padStart(2,'0');
      const anchor = make('a');
      const hash = `#${article.id}-step-${number}`;
      anchor.href = hash;
      anchor.dataset.stepTarget = target;
      anchor.append(make('span','lesson-guide-number',number),make('span','lesson-guide-label',title));
      const node = make('section','lesson-reading-step');
      node.id = hash.slice(1);
      const heading = make('h2','lesson-reading-title',`${number} ${title}`);
      heading.tabIndex = -1;
      node.append(heading,make('p','lesson-reading-instructions',instructions));
      const section = sectionOf(target);
      const step = {title,target,instructions,index,number,hash,anchor,section,node,heading,usesBench:section===lab};
      steps.push(step);
      nav.append(anchor);
      anchor.addEventListener('click',event=>{
        if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
        event.preventDefault();
        go(step);
      });
    }
  }
  while (nav.nextSibling) body.append(nav.nextSibling);
  nav.before(workspace);
  guide.append(summary,nav);
  rail.append(guide,task);
  workspace.append(rail,body);
  article.parentElement.classList.add('unit-content-with-guide');

  const supplemental = Array.from(body.children).filter(child=>child!==lab && !lessonParts.includes(child));
  body.append(...steps.map(step=>step.node));
  for (const [index, part] of lessonParts.entries()) steps[partSteps[index]-1].node.append(part);

  function continueIn(stepNumber, nodes, className = 'lesson-part') {
    const step = steps[stepNumber - 1];
    const continuation = make('div',className);
    continuation.append(...nodes);
    step.node.append(continuation);
    step.topic = continuation;
  }

  // Some textbook sections cover multiple steps. Keep each original passage with its task.
  if (article.id === 'lab-1') {
    const subsections = lessonParts[3].querySelectorAll(':scope > h3');
    for (const [index, stepNumber] of [8,9,11].entries()) {
      const heading = subsections[index + 1];
      continueIn(stepNumber,[heading,heading.nextElementSibling]);
    }
  } else if (article.id === 'lab-5') {
    continueIn(10,[lessonParts[2].querySelector('[data-vsim] details:has([data-ct1])')],'lesson-part sim');
  } else if (article.id === 'lab-7') {
    const [,,drive,link,hint] = lessonParts[0].querySelectorAll(':scope > p, :scope > .formula');
    continueIn(9,[drive]);
    continueIn(10,[link,hint]);
  }

  const quizStep = steps.find(step=>step.target==='quiz');
  quizStep?.node.append(quiz);
  for (const node of supplemental) steps.at(-1).node.append(node);

  for (const step of steps) {
    if (step.usesBench) {
      step.benchSlot = make('div','lesson-bench-slot');
      step.openBench = make('button','lesson-open-bench','打开仿真实验台');
      step.openBench.type = 'button';
      step.node.append(step.openBench,step.benchSlot);
      step.openBench.addEventListener('click',()=>{
        moveBench(step);
        mark(step);
        scrollToTarget(resolveTarget(step),true);
      });
    } else if (!step.topic && step.target.startsWith('part:') && step.section?.parentElement!==step.node) {
      const link = make('a','lesson-related-part',step.section.querySelector('h2').textContent);
      link.href = `#${step.section.id}`;
      step.node.append(link);
      step.topic = link;
    }
  }

  let benchStep;
  function moveBench(step) {
    if (step===benchStep) return;
    if (benchStep) benchStep.openBench.textContent = '打开仿真实验台';
    // An instrument can serve multiple steps. Move its mounted node and keep its measurements.
