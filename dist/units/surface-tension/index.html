.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}

.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}

</style>
  <style>
    :root {
      color-scheme: light dark;
      --bg: light-dark(#f5f4ef,#191d1b);
      --paper: light-dark(#fffefa,#232925);
      --ink: light-dark(#202721,#eeefe8);
      --muted: light-dark(#626b63,#b8c2b8);
      --line: light-dark(#d7dcd2,#45534a);
      --accent: light-dark(#1a614b,#a3e3c5);
      --accent-soft: light-dark(#e7f0e7,#293e34);
      --accent-ink: light-dark(#fff,#12281f);
      --plot-grid: var(--line);
      --plot-ink: var(--ink);
      --plot-accent: var(--accent);
      --plot-secondary: light-dark(#9b4f2d,#ffba91);
    }
    * { box-sizing: border-box; }
    html { scroll-padding-top: 20px; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.8 system-ui, 'Microsoft YaHei', sans-serif; }
    a { color: var(--accent); text-underline-offset: 4px; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    button,input,select { font: inherit; }
    button,select,input:not([type="range"]):not([type="radio"]):not([type="checkbox"]) { color: var(--ink); background: var(--paper); border: 1px solid var(--line); padding: .43rem .68rem; border-radius: .36rem; }
    button { cursor: pointer; }
    button:hover:not(:disabled),button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    button:disabled { cursor: default; opacity: .55; }
    input { max-width: 100%; accent-color: var(--accent); }
    input[type="range"] { min-width: 0; display: block; width: 100%; margin: 5px 0; }
    select { max-width: 100%; }
    [hidden] { display: none !important; }
    .top { border-bottom: 1px solid var(--line); }
    .top-inner { max-width: 1260px; margin: auto; padding: 22px 36px; display: flex; justify-content: space-between; flex-wrap: wrap; align-items: center; gap: 4px 20px; }
    .top-title { font-weight: 650; text-decoration: none; color: var(--ink); }
    .top-source,.kicker,.page-ref,.caption,.hint,.source { color: var(--muted); font-size: .875rem; }
    .layout { display: grid; grid-template-columns: 236px minmax(0,1fr); gap: 52px; max-width: 1260px; margin: 0 auto; padding: 38px 36px 70px; }
    .toc { align-self: start; position: sticky; top: 18px; max-height: calc(100dvh - 36px); overflow: auto; padding: 4px 4px 4px 0; }
    .toc a { display: grid; grid-template-columns: 2rem 1fr; gap: 4px; align-items: baseline; padding: 9px 10px; color: var(--muted); text-decoration: none; font-size: .9rem; line-height: 1.45; border-left: 3px solid transparent; }
    .toc a:hover,.toc a[aria-current="page"] { border-left-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .toc a span:first-child { font-variant-numeric: tabular-nums; }
    h1,h2,h3,h4 { line-height: 1.35; }
    h1 { font-size: clamp(2rem, 4.3vw, 3.7rem); letter-spacing: -.045em; margin: 9px 0 19px; }
    h2 { font-size: clamp(1.35rem,2.25vw,1.75rem); margin: 6px 0 14px; }
    h3 { font-size: 1.11rem; margin: 1.4em 0 .3em; }
    p { margin: .75em 0; }
    main { min-width: 0; }
    .hero { border-bottom: 1px solid var(--line); padding-bottom: 24px; }
    .hero p { max-width: 44em; }
    .lead { font-size: clamp(1rem,1.5vw,1.19rem); }
    .course-list { list-style: none; padding: 0; margin: 8px 0 0; }
    .course-list li { display: grid; grid-template-columns: 2rem minmax(0,1fr) auto; align-items: start; gap: 10px; border-bottom: 1px solid var(--line); padding: 16px 0; }
    .course-list .number { color: var(--accent); font-variant-numeric: tabular-nums; }
    .course-list a { display: inline-block; color: var(--ink); font-weight: 650; }
    .course-list p { margin: .25em 0 0; color: var(--muted); font-size: .93rem; line-height: 1.55; }
    .lesson { min-width: 0; }
    .lesson header h1 { font-size: clamp(1.75rem,3.4vw,2.85rem); }
    .parts { display: flex; gap: .5rem 1.15rem; flex-wrap: wrap; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: .88rem; }
    .lesson-part { margin: 1.9rem 0; scroll-margin-top: 1rem; }
    .lesson-part li { margin: .36em 0; }
    .lesson-part ul,.lesson-part ol { padding-left: 1.6em; }
    .page-ref { font-variant-numeric: tabular-nums; }
    .part-head { display: flex; align-items: baseline; gap: 0 1rem; flex-wrap: wrap; }
    .formula,.equation { background: var(--paper); border-left: 3px solid var(--line); margin: 1em 0; padding: .75em 1em; overflow-wrap: anywhere; font-family: 'Cambria Math', Cambria, 'Microsoft YaHei', serif; }
    .table-wrap,.table-responsive { overflow: auto; max-width: 100%; }
    table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    caption { text-align: left; color: var(--muted); padding: .6rem 0; }
    td,th { text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); padding: .55rem .65rem; }
    details { border-top: 1px solid var(--line); padding: .68em 0; }
    summary { cursor: pointer; color: var(--accent); font-weight: 600; }
    .sim { background: var(--paper); border: 1px solid var(--line); border-radius: .45rem; padding: clamp(12px, 2.8vw, 26px); margin: 1em 0; min-width: 0; }
    .sim-controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: end; margin: .6em 0 1em; }
    .sim-controls > label,.sim-controls > div { flex: 1 1 175px; min-width: min(100%,155px); }
    .sim-controls > label > :is(select,input:not([type="radio"]):not([type="checkbox"])) { display: block; }
    .sim :is(canvas,svg,img) { display: block; width: 100%; max-width: 100%; object-fit: contain; }
    .sim svg:not([height]) { height: auto; }
    .reading { color: var(--accent); font-weight: 650; font-variant-numeric: tabular-nums; }
    .next-links { border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 1rem; justify-content: space-between; padding-top: 1rem; }
    .rig-lab { margin: 1.85rem 0 2.5rem; min-width: 0; }
    .rig-head { display: grid; gap: 7px; margin-bottom: 15px; }
    .rig-head h2,.rig-head p { margin: 0; }
    .rig-instrument { border: 1px solid var(--line); border-radius: 10px; background: var(--paper); overflow: clip; }
    .rig-bar { display:flex; justify-content:space-between; gap: 8px 22px; flex-wrap:wrap; border-bottom:1px solid var(--line); padding: 12px 20px; font-size:.91rem; }
    .rig-bar span { color:var(--muted); }
    .rig-host { min-width:0; padding: clamp(10px, 2vw, 20px); }
    .rig-scene { min-width: 0; position:relative; background: var(--anatomy-card,var(--paper)); border: 1px solid var(--line); border-radius: 6px; }
    .rig-scene-upright { max-width: min(100%,680px); margin-inline:auto; }
    .rig-scene > svg, .rig-scene > .iso-svg { display:block; width:100%; height:auto; margin:auto; }
    .rig-host > svg { width:100%; height:auto; display:block; }
    .rig-hit { cursor:pointer; outline:none; }
    .rig-hit-area { fill:transparent; stroke:transparent; stroke-width:1.7; }
    .rig-hit-marker { fill:var(--accent); stroke:var(--paper); stroke-width:2.2; pointer-events:none; }
    .rig-hit:hover .rig-hit-area,.rig-hit:focus-visible .rig-hit-area { stroke:var(--accent); fill:var(--accent-soft); fill-opacity:.27; }
    .rig-tools { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin: .65rem 0; }
    .rig-tools label { min-width:0; }
    .rig-readout { border-left: 3px solid var(--accent); padding: .4em .75em; color:var(--ink); font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
    .rig-question { margin-top:1rem; }
    .rig-choices { display:flex; flex-wrap:wrap; align-items:start; gap: 7px; }
    .rig-choices button { text-align:start; }
    .rig-feedback { color:var(--ink); }
    .rig-feedback[data-correct=true] { color:var(--accent); }
    .rig-host .iso-svg { overflow:visible; }
    @media (max-width:820px) {
      .layout { display: block; padding: 22px 19px 50px; }
      .top-inner { padding: 14px 19px; }
      .toc { position: static; max-height: none; padding: 0; display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); margin-bottom: 27px; border-bottom: 1px solid var(--line); }
      .toc a { font-size: .82rem; grid-template-columns: 1.55rem 1fr; padding: 7px 5px; }
      .course-list li { grid-template-columns: 1.5rem minmax(0,1fr); gap: 4px 10px; }
      .course-list .page-ref { grid-column: 2; }
      td,th { padding: .45rem .35rem; }
      .rig-hit-marker { r: 8; }
    }
  </style>
<style>

<style id="physlab-bench-theme">
:root {
  color-scheme: light dark;
  --lab-page: light-dark(#f1f5f7, #111820);
  --lab-panel: light-dark(#fff, #18232d);
  --lab-stage: light-dark(#e9f0f4, #111b24);
  --lab-line: light-dark(#c8d5de, #334957);
  --lab-control-line: light-dark(#a3b6c2, #516977);
  --lab-ink: light-dark(#182832, #e7eef3);
  --lab-muted: light-dark(#415563, #a9bac7);
  --lab-signal: light-dark(#17634c, #a9efce);

  --lab-font: system-ui, 'Microsoft YaHei UI', 'Microsoft YaHei', sans-serif;
  --lab-radius: 10px;

  --muted: var(--lab-muted);
  --line: var(--lab-line);
  --accent: var(--lab-signal);
  --accent-soft: var(--lab-signal-soft);
  --accent-ink: var(--lab-signal-ink);
}

.iso:is(.rig-host, .cover-instrument) {
  --anatomy-card: var(--lab-stage);
  --anatomy-paper: var(--lab-stage);
  --anatomy-text: var(--lab-muted);
  --anatomy-strong: var(--lab-ink);
  --anatomy-muted: var(--lab-muted);
  --anatomy-face: light-dark(#d2e0e8, #314753);
  --anatomy-top: light-dark(#e0ebf1, #3a505d);
  --anatomy-shade-0: light-dark(#a2b6c3, #15212a);
  --anatomy-shade-1: light-dark(#b7c9d4, #1e2e3a);
  --anatomy-shade-2: light-dark(#c9d9e3, #263945);
  --anatomy-shade-3: light-dark(#dce8ef, #304552);
  --anatomy-hi: light-dark(#29424f, #e0ecf0);
  --anatomy-mid: light-dark(#506b7b, #91adb9);
  --anatomy-lo: light-dark(#647e8d, #617c8c);
  --anatomy-faint: light-dark(#829aa8, #455d6a);
  --anatomy-lit: light-dark(#153d3a, #effaff);
  --anatomy-lit-top: light-dark(#aad3c6, #3c5e63);

}

const dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const add3 = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub3 = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul3 = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const len3 = (a) => Math.hypot(a[0], a[1], a[2]);
const unit3 = (a) => {
  const length = len3(a) || 1;
  return [a[0] / length, a[1] / length, a[2] / length];
};
const cross3 = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const lerp3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

function viewOf(P) {
  const { sinA, cosA, sinE, cosE } = cameraOf(P);
  return [cosA * cosE, sinA * cosE, sinE];
}

function lightOf(P) {
  const { sinA, cosA } = cameraOf(P);
  return unit3([-sinA, cosA, LIGHT_UP]);
}

const scaleOf = (P) => cameraOf(P).k;

function bandOf(score) {
  let tone = 0;
  while (tone < BANDS.length && score >= BANDS[tone]) tone++;
  return tone;
}

const toneOf = (normal, P) => bandOf(dot3(unit3(normal), lightOf(P)));

function frameAlong(o, a) {
  const axis = unit3(a);
  const helper = Math.abs(axis[2]) > 0.9 ? [1, 0, 0] : [0, 0, 1];
  const u = unit3(cross3(helper, axis));
  const v = cross3(axis, u);
  return { o, a: axis, u, v };
}

const frameOf = (o, a, u, v) => ({ o, a, u, v });

function pointOf(F, s, r, angle) {
  const c = Math.cos(angle);
  const n = Math.sin(angle);
  return [
    F.o[0] + F.a[0] * s + r * (c * F.u[0] + n * F.v[0]),
    F.o[1] + F.a[1] * s + r * (c * F.u[1] + n * F.v[1]),
    F.o[2] + F.a[2] * s + r * (c * F.u[2] + n * F.v[2]),
  ];
}

const radialOf = (F, angle) => {
  const c = Math.cos(angle);
  const n = Math.sin(angle);
  return [c * F.u[0] + n * F.v[0], c * F.u[1] + n * F.v[1], c * F.u[2] + n * F.v[2]];
};

const tangentOf = (F, angle) => {
  const c = Math.cos(angle);
  const n = Math.sin(angle);
  return [-n * F.u[0] + c * F.v[0], -n * F.u[1] + c * F.v[1], -n * F.u[2] + c * F.v[2]];
};

const angleToward = (F, direction) => Math.atan2(dot3(direction, F.v), dot3(direction, F.u));

function hullTagged(points) {
  const sorted = [...points].sort((a, b) => a.p[0] - b.p[0] || a.p[1] - b.p[1]);
  if (sorted.length < 3) return sorted;
  const cross = (o, a, b) => (a.p[0] - o.p[0]) * (b.p[1] - o.p[1]) - (a.p[1] - o.p[1]) * (b.p[0] - o.p[0]);
  const lower = [];
  for (const point of sorted) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 1e-9) lower.pop();
    lower.push(point);
  }
  const upper = [];
  for (let index = sorted.length - 1; index >= 0; index--) {
    const point = sorted[index];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 1e-9) upper.pop();
    upper.push(point);
  }
  return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}

const hullOf = (points) => hullTagged(points.map((p) => ({ p }))).map(({ p }) => p);

function runsOf(flags) {
  const count = flags.length;
  const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
  if (start < 0) return flags[0] ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];
  const runs = [];
  let run = null;
  for (let step = 0; step < count; step++) {
    const index = (start + step) % count;
    if (flags[index]) {
      if (!run) run = [index];
      run.push((index + 1) % count);
    } else if (run) {
      runs.push(run);
      run = null;
    }
  }
  if (run) runs.push(run);
  return runs;
}

function groupsOf(keys) {
  const count = keys.length;
  const out = [];
  const start = keys.findIndex((key, index) => key !== keys[(index + count - 1) % count]);
  if (start < 0) {
    if (keys[0] !== null) out.push({ key: keys[0], run: Array.from({ length: count + 1 }, (_, index) => index % count) });
    return out;
  }
  let current = null;
  for (let step = 0; step < count; step++) {
    const index = (start + step) % count;
    const key = keys[index];
    if (current && current.key === key) {
      current.run.push((index + 1) % count);
      continue;
    }
    if (current && current.key !== null) out.push(current);
    current = { key, run: [index, (index + 1) % count] };
  }
  if (current && current.key !== null) out.push(current);
  return out;
}

const stepsFor = (radius, least = 16, most = 112, scale = 0) => Math.max(least, Math.min(most, scale ? Math.ceil((TAU * radius * scale) / 3) : Math.round((radius * 1.3) / 4) * 4));

function chains(edges) {
  const out = [];
  let current = null;
  for (const [a, b, keep] of edges) {
    if (!keep) {
      if (current) out.push(current);
      current = null;
      continue;
    }
    if (!current) current = [a];
    current.push(b);
  }
  if (current) out.push(current);
  if (out.length > 1 && edges[0][2] && edges[edges.length - 1][2]) {
    const last = out.pop();
    out[0] = [...last, ...out[0].slice(1)];
  }
  return out;
}

function labelledArcs(nr, na, view, light, gr = nr, ga = na) {
  const cuts = [];
  if (Math.abs(gr) > 1e-9) {
    const visibleCut = -(ga * view.a) / (gr * view.flat);
    if (visibleCut > -1 && visibleCut < 1) {
      const d = Math.acos(visibleCut);
      cuts.push(view.phi - d, view.phi + d);
    }
  }
  if (Math.abs(nr) > 1e-9) {
    for (const threshold of BANDS) {
      const c = (threshold - na * light.a) / (nr * light.flat);
      if (c > -1 && c < 1) {
        const d = Math.acos(c);
        cuts.push(light.phi - d, light.phi + d);
      }
    }
  }
  const wrap = (angle) => ((angle % TAU) + TAU) % TAU;
  const sorted = [...new Set(cuts.map((angle) => Math.round(wrap(angle) * 1e9) / 1e9))].sort((a, b) => a - b);
  const label = (angle) => {
    const facing = gr * view.flat * Math.cos(angle - view.phi) + ga * view.a;
    if (facing <= 1e-9) return -1;
    return bandOf(nr * light.flat * Math.cos(angle - light.phi) + na * light.a);
  };
  if (!sorted.length) {
    const tone = label(0);
    return tone < 0 ? [] : [{ tone, from: 0, to: TAU, full: true }];
  }
  const arcs = sorted.map((from, index) => {
    const to = index + 1 < sorted.length ? sorted[index + 1] : sorted[0] + TAU;
    return { tone: label((from + to) / 2), from, to };
  });
  const merged = [];
  for (const arc of arcs) {
    const last = merged[merged.length - 1];
    if (last && last.tone === arc.tone && Math.abs(last.to - arc.from) < 1e-9) last.to = arc.to;
    else merged.push({ ...arc });
  }
  if (merged.length > 1 && merged[0].tone === merged[merged.length - 1].tone && Math.abs(merged[merged.length - 1].to - TAU - merged[0].from) < 1e-9) {
    const last = merged.pop();
    merged[0].from = last.from - TAU;
  }
  return merged.filter((arc) => arc.tone >= 0);
}

function hermiteSlopes(run) {
  const n = run.length - 1;
  const h = Array.from({ length: n }, (_, j) => run[j + 1][0] - run[j][0]);
  const delta = h.map((value, j) => (run[j + 1][1] - run[j][1]) / value);
  const d = new Array(n + 1).fill(0);
  const end = (h0, h1, d0, d1) => {
    let value = ((2 * h0 + h1) * d0 - h0 * d1) / (h0 + h1);
    if (Math.sign(value) !== Math.sign(d0)) value = 0;
    else if (Math.sign(d0) !== Math.sign(d1) && Math.abs(value) > Math.abs(3 * d0)) value = 3 * d0;
    return value;
  };
  if (n === 1) d[0] = d[1] = delta[0];
  else {
    d[0] = end(h[0], h[1], delta[0], delta[1]);
    d[n] = end(h[n - 1], h[n - 2], delta[n - 1], delta[n - 2]);
  }
  for (let k = 1; k < n; k++) {
    if (delta[k - 1] * delta[k] <= 0) continue;
    const w1 = 2 * h[k] + h[k - 1];
    const w2 = h[k] + 2 * h[k - 1];
    d[k] = (w1 + w2) / (w1 / delta[k - 1] + w2 / delta[k]);
  }
  return d;
}

function curveRuns(meridian) {
  const m = meridian.length;
  const segments = new Array(m - 1).fill(null);
  let start = 0;
  while (start < m - 1) {
    let end = start + 1;
    while (end < m - 1 && meridian[end][2] && Math.abs(meridian[end + 1][0] - meridian[end][0]) > 1e-9 && Math.abs(meridian[end][0] - meridian[end - 1][0]) > 1e-9) end++;
    const run = meridian.slice(start, end + 1);
    const n = run.length - 1;
    if (n >= 2 && run.every((point, j) => j === 0 || Math.abs(point[0] - run[j - 1][0]) > 1e-9)) {
      const d = hermiteSlopes(run);
      for (let j = 0; j < n; j++) {
        const [s0, r0] = run[j];
        const [s1, r1] = run[j + 1];
        const hj = s1 - s0;
        const d0 = d[j];
        const d1 = d[j + 1];
        const radius = (s) => {
          const t = (s - s0) / hj;
          return (2 * t ** 3 - 3 * t ** 2 + 1) * r0 + (t ** 3 - 2 * t ** 2 + t) * hj * d0 + (-2 * t ** 3 + 3 * t ** 2) * r1 + (t ** 3 - t ** 2) * hj * d1;
        };
        const slope = (s) => {
          const t = (s - s0) / hj;
          return ((6 * t ** 2 - 6 * t) * r0 + (6 * t - 6 * t ** 2) * r1) / hj + (3 * t ** 2 - 4 * t + 1) * d0 + (3 * t ** 2 - 2 * t) * d1;
        };
        segments[start + j] = { radius, slope };
      }
    }
    start = end;
  }
  return segments;
}

function curved(meridian, P, segments, { error = 0.2, depth = 6 } = {}) {
  const k = scaleOf(P);
  const out = [meridian[0]];
  for (let i = 0; i < meridian.length - 1; i++) {
    const curve = segments[i];
    const [s0] = meridian[i];
    const [s1] = meridian[i + 1];
    if (curve) {
      const split = (a, b, level) => {
        const mid = (a + b) / 2;
        const chord = (curve.radius(a) + curve.radius(b)) / 2;
        if (level < depth && Math.abs(curve.radius(mid) - chord) * k > error) {
          split(a, mid, level + 1);
          out.push([mid, curve.radius(mid), 1]);
          split(mid, b, level + 1);
        }
      };
      split(s0, s1, 0);
    }
    out.push(meridian[i + 1]);
  }
  return out;
}

function smoothRows(meridian, F, P, { rows = 6, slope = null, radius = null, steps = 48, error = 0.35, depth: deepest = 8, fineness = 0.1 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const view = { a: dot3(F.a, V), flat: Math.hypot(dot3(F.u, V), dot3(F.v, V)), phi: Math.atan2(dot3(F.v, V), dot3(F.u, V)) };
  const light = { a: dot3(F.a, L), flat: Math.hypot(dot3(F.u, L), dot3(F.v, L)), phi: Math.atan2(dot3(F.v, L), dot3(F.u, L)) };
  const m = meridian.length;
  const faces = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr) || 1;
    faces.push([ds / length, -dr / length]);
  }
  const splines = slope ? null : curveRuns(meridian);
  const vertexNormal = (k, own) => {
    if (k <= 0 || k >= m - 1 || !meridian[k][2]) return own;
    const a = faces[k - 1];
    const b = faces[k];
    const x = a[0] + b[0];
    const y = a[1] + b[1];
    const length = Math.hypot(x, y) || 1;
    return [x / length, y / length];
  };
  const normalAt = (i, u) => {
    const [s0] = meridian[i];
    const [s1] = meridian[i + 1];
    const s = s0 + (s1 - s0) * u;
    const sign = Math.sign(s1 - s0) || 1;
    const g = slope ? slope(s) : splines[i] ? splines[i].slope(s) : null;
    if (g !== null) {
      const length = Math.hypot(1, g);
      return [sign / length, (-sign * g) / length];
    }
    const a = vertexNormal(i, faces[i]);
    const b = vertexNormal(i + 1, faces[i]);
    const x = a[0] + (b[0] - a[0]) * u;
    const y = a[1] + (b[1] - a[1]) * u;
    const length = Math.hypot(x, y) || 1;
    return [x / length, y / length];
  };
  const pointAt = (i, u, angle) => {
    const [s0, r0] = meridian[i];
    const [s1, r1] = meridian[i + 1];
    const s = s0 + (s1 - s0) * u;
    return iso(pointOf(F, s, radius ? radius(s) : splines && splines[i] ? splines[i].radius(s) : r0 + (r1 - r0) * u, angle), P);
  };
  const buckets = [[], [], [], [], []];
  const fine = TAU / Math.max(24, Math.min(192, steps * 1.5));
  const arcPoints = (i, u, from, to) => {
    const count = Math.max(1, Math.ceil((to - from) / fine));
    return Array.from({ length: count + 1 }, (_, index) => pointAt(i, u, from + ((to - from) * index) / count));
  };
  const centreOf = (arc, reference) => {
    let mid = (arc.from + arc.to) / 2 - reference;
    mid = ((mid % TAU) + TAU) % TAU;
    return mid;
  };
  const levelOf = (i, u) => {
    const [nr, na] = normalAt(i, u);
    const groups = new Map();
    for (const arc of labelledArcs(nr, na, view, light, faces[i][0], faces[i][1])) {
      if (!groups.has(arc.tone)) groups.set(arc.tone, []);
      groups.get(arc.tone).push(arc);
    }
    for (const list of groups.values()) list.sort((x, y) => centreOf(x, light.phi) - centreOf(y, light.phi));
    return { i, u, groups };
  };
  const same = (x, y) => {
    if (x.groups.size !== y.groups.size) return false;
    for (const [tone, list] of x.groups) if ((y.groups.get(tone) ?? []).length !== list.length) return false;
    return true;
  };
  const align = (reference, arc) => {
    const out = { ...arc };
    const centre = (reference.from + reference.to) / 2;
    while ((out.from + out.to) / 2 - centre > Math.PI) {
      out.from -= TAU;
      out.to -= TAU;
    }
    while (centre - (out.from + out.to) / 2 > Math.PI) {
      out.from += TAU;
      out.to += TAU;
    }
    return out;
  };
  const strayOf = (i, a, mid, b) => {
    let worst = 0;
    for (const [tone, list] of mid.groups) {
      list.forEach((arc, index) => {
        const lo = align(arc, a.groups.get(tone)[index]);
        const hi = align(arc, b.groups.get(tone)[index]);
        for (const key of ["from", "to"]) {
          const p = pointAt(i, mid.u, arc[key]);
          const p0 = pointAt(i, a.u, lo[key]);
          const p1 = pointAt(i, b.u, hi[key]);
          worst = Math.max(worst, Math.hypot(p[0] - (p0[0] + p1[0]) / 2, p[1] - (p0[1] + p1[1]) / 2));
        }
      });
    }
    return worst;
  };
  const sheet = (tone, levels) => {
    levels[0].groups.get(tone).forEach((arc, index) => {
      const chain = [arc];
      for (let k = 1; k < levels.length; k++) chain.push(align(chain[k - 1], levels[k].groups.get(tone)[index]));
      const last = levels.length - 1;
      const points = [...arcPoints(levels[0].i, levels[0].u, chain[0].from, chain[0].to)];
      for (let k = 1; k < last; k++) points.push(pointAt(levels[k].i, levels[k].u, chain[k].to));
      points.push(...arcPoints(levels[last].i, levels[last].u, chain[last].from, chain[last].to).reverse());
      for (let k = last - 1; k >= 1; k--) points.push(pointAt(levels[k].i, levels[k].u, chain[k].from));
      buckets[tone].push(pathOf(oriented(points), true));
    });
  };
  const overlap = (x, y) => Math.min(x.to, y.to) - Math.max(x.from, y.from);
  const strip = (tone, a, b) => {
    const below = a.groups.get(tone) ?? [];
    const above = (b.groups.get(tone) ?? []).map((arc) => ({ arc, used: false }));
    const quad = (lo, hi) => {
      const points = [...arcPoints(a.i, a.u, lo.from, lo.to), ...arcPoints(b.i, b.u, hi.from, hi.to).reverse()];
      buckets[tone].push(pathOf(oriented(points), true));
    };
    for (const arc of below) {
      let best = null;
      let score = -Infinity;
      for (const entry of above) {
        if (entry.used) continue;
        const aligned = align(arc, entry.arc);
        const value = overlap(arc, aligned);
        if (value > score) (score = value), (best = entry);
      }
      if (best && score > -0.05) {
        best.used = true;
        quad(arc, align(arc, best.arc));
      } else {
        const centre = (arc.from + arc.to) / 2;
        quad(arc, { from: centre, to: centre });
      }
    }
    for (const entry of above) {
      if (entry.used) continue;
      const centre = (entry.arc.from + entry.arc.to) / 2;
      quad({ from: centre, to: centre }, entry.arc);
    }
  };
  const k = scaleOf(P);
  let run = [];
  const flush = () => {
    const tones = [...new Set(run.flatMap((level) => [...level.groups.keys()]))].sort((x, y) => x - y);
    for (const tone of tones) {
      const countOf = (level) => (level.groups.get(tone) ?? []).length;
      let start = 0;
      for (let at = 1; at <= run.length; at++) {
        if (at < run.length && countOf(run[at - 1]) === countOf(run[at])) continue;
        if (at - 1 > start && countOf(run[start])) sheet(tone, run.slice(start, at));
        if (at < run.length) strip(tone, run[at - 1], run[at]);
        start = at;
      }
    }
    run = [];
  };
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    if (Math.abs(ds) < 1e-9) {
      flush();
      continue;
    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;
    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));
    const coarse = Array.from({ length: count + 1 }, (_, index) => levelOf(i, index / count));
    run.push(coarse[0]);
    const refine = (a, b, depth) => {
      const mid = levelOf(i, (a.u + b.u) / 2);
      const split = depth < limit && (!same(a, b) || !same(a, mid) || (depth < 6 && strayOf(i, a, mid, b) > error));
      if (!split) {
        run.push(b);
        return;
      }
      refine(a, mid, depth + 1);
      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;
  if (meridian[0][1] <= 1e-9) first = 1;
  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const facing = Math.atan2(dot3(F.v, V), dot3(F.u, V));
  const [left, right] = silhouettePoints(side, F, P, { samples, slope });
  if (left.length <= samples || right.length <= samples) return null;
  const s0 = side[0][0];
  const s1 = side[side.length - 1][0];
  const angleOf = (point) => angleToward(F, sub3(point, add3(F.o, mul3(F.a, dot3(sub3(point, F.o), F.a)))));
  const wrap = (angle) => ((angle % TAU) + TAU) % TAU;
  const arc = (s, r, from, to, through) => {
    let sweep = wrap(to - from);
    if (wrap(through - from) > sweep) sweep -= TAU;
    const count = Math.max(4, Math.ceil(Math.abs(sweep) / (TAU / 96)), Math.ceil((Math.abs(sweep) * r * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));
  };
  const r0 = side[0][1];
  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);
  const keepFirst = rims === "all" || rims === "first" || rims === "ends";
  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");
  const hull = hullOf([...arc(s0, r0, 0, TAU - 1e-6, Math.PI), ...arc(s1, r1, 0, TAU - 1e-6, Math.PI), ...L, ...R]);
  let gap = 0;
  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t));
    }
    gap = Math.max(gap, best);
  }
  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const V = viewOf(P);
  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const aL = dot3(F.a, L);
  const uL = dot3(F.u, L);
  const vL = dot3(F.v, L);
  const n = steps;
  const m = meridian.length;
  const rings = meridian.map(([s, r]) => Array.from({ length: n }, (_, j) => iso(pointOf(F, s, r, (j / n) * TAU), P)));
  const midC = [];
  const midS = [];
  for (let j = 0; j < n; j++) {
    const t = ((j + 0.5) / n) * TAU;
    midC.push(Math.cos(t));
    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];
    for (let j = 0; j < n; j++) {
      if (length < 1e-9) {
        row.push(false);
        toneRow.push(0);
        continue;
      }
      const facing = ds * (midC[j] * uV + midS[j] * vV) - dr * aV;
      const lit = (ds * (midC[j] * uL + midS[j] * vL) - dr * aL) / length;
      row.push(facing > 1e-6 * length);
      toneRow.push(bandOf(lit));
    }
    seen.push(row);
    tones.push(toneRow);
  }
  const buckets = [[], [], [], [], []];
  const all = [];
  const smoothed = smooth ? smoothRows(meridian, F, P, { steps, ...(smooth === true ? {} : smooth) }) : null;
  if (smoothed) smoothed.forEach((list, tone) => list.forEach((d) => (buckets[tone].push(d), all.push(d))));
  for (let i = 0; i < m - 1; i++) {
    if (smoothed && Math.abs(meridian[i + 1][0] - meridian[i][0]) > 1e-9) continue;
    const keys = seen[i].map((visible, j) => (visible ? tones[i][j] : null));
    for (const { key, run } of groupsOf(keys)) {
      const a = run.map((j) => rings[i][j]);
      const b = run.map((j) => rings[i + 1][j]).reverse();
      const d = pathOf(oriented([...a, ...b]), true);
      buckets[key].push(d);
      all.push(d);
    }
  }
  const phi = Math.atan2(vV, uV);
  const flatV = Math.hypot(uV, vV);
  const rangeOf = (i) => {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    if (Math.hypot(ds, dr) < 1e-9) return null;
    if (Math.abs(ds) < 1e-9 || flatV < 1e-9) return -dr * aV > 1e-9 ? [-1, 1] : null;
    const c = (dr * aV) / (ds * flatV);
    return ds > 0 ? [Math.max(-1, c), 1] : [-1, Math.min(1, c)];
  };
  const arcsOf = (ranges) => {
    if (ranges.some((range) => !range)) return [];
    const lo = Math.max(...ranges.map(([x]) => x));
    const hi = Math.min(...ranges.map(([, x]) => x));
    if (lo >= hi - 1e-9) return [];
    const near = Math.acos(Math.min(1, hi));
    const far = Math.acos(Math.max(-1, lo));
    if (hi >= 1 && lo <= -1) return [[phi, phi + TAU]];
    if (hi >= 1) return [[phi - far, phi + far]];
    if (lo <= -1) return [[phi + near, phi + TAU - near]];
    return [[phi + near, phi + far], [phi - far, phi - near]];
  };
  const along = (s, r, [from, to]) => {
    const count = Math.max(2, Math.ceil(((to - from) * Math.max(r, 1e-6) * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, j) => iso(pointOf(F, s, r, from + ((to - from) * j) / count), P));
  };
  const creases = [];
  for (let i = 1; i < m - 1; i++) {
    if (meridian[i][2] || meridian[i][1] <= 1e-9) continue;
    for (const arc of arcsOf([rangeOf(i - 1), rangeOf(i)])) creases.push(pathOf(along(meridian[i][0], meridian[i][1], arc)));
  }
  let bevelPath = "";
  if (bevel > 0 && m > 2) {
    const ends = [];
    if (meridian[0][1] <= 1e-9) ends.push([0, 1, 1]);
    if (meridian[m - 1][1] <= 1e-9) ends.push([m - 2, m - 2, m - 3]);
    for (const [cap, rim, side] of ends) {
      const [s, r] = meridian[rim];
      for (const arc of arcsOf([rangeOf(cap), rangeOf(side)])) {
        const inset = along(s, Math.max(0, r - bevel), arc);
        const edge = along(s, r, arc);
        bevelPath += pathOf([edge[0], ...inset.slice(1, -1), edge[edge.length - 1]]);
      }
    }
  }
  const { fill: fillPath, outline } = outlineOf(meridian, F, P, { steps: n, fill, hole, rims, smooth, waist, all });
  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),
  };
}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;
}

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const n = steps;
  let fillPath;
  let outline;
  const shape = shapeOf(meridian, P, smooth);
  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;
  const surface = side && !hole ? surfaceOf(side, F, P, rims, { slope: smooth && smooth.slope ? smooth.slope : null }) : null;
  if (surface && (fill === "surface" || surface.gap > waist)) {
    fillPath = surface.fill;
    outline = surface.outline;
  } else if (fill === "hull" || fill === "auto" || fill === "surface") {
    const most = Math.max(...shape.map(([, r]) => r));
    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });
    const hull = hullTagged(tagged);
    const holePath = hole ? pathOf(Array.from({ length: around }, (_, j) => iso(pointOf(F, hole[0], hole[1], (j / around) * TAU), P)), true) : "";
    fillPath = pathOf(hull.map(({ p }) => p), true) + holePath;
    if (rims === "all") {
      outline = pathOf(hull.map(({ p }) => p), true) + holePath;
    } else {
      const keepFirst = rims === "first" || rims === "ends";
      const keepLast = rims === "last" || rims === "ends";
      const edges = hull.map((a, index) => {
        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;
        const keep = !same || (a.ring !== 0 && a.ring !== shape.length - 1) || (keepFirst && a.ring === 0) || (keepLast && a.ring === shape.length - 1);
        return [a.p, b.p, keep];
      });
      outline = chains(edges).map((points) => pathOf(points)).join("") + holePath;
    }
  } else {
    fillPath = all ? all.join("") : (({ shades, top }) => [...shades, top].join(""))(lathe(meridian, F, P, { steps: n, fill: "auto", hole, rims, smooth, waist }));
    outline = "";
  }
  return { fill: fillPath, outline };
}

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);
  const ring = oriented(polygon.map(([x, y]) => [x, y]));
  const n = ring.length;
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const low = ring.map((point) => iso(at(s0, point), P));
  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];
  const seen = [];
  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];
    const normal = unit3(add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0))));
    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));
  const hull = hullOf([...low, ...high]);
  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);
    if (sharp && seen[j] && seen[prev]) creases.push(pathOf([low[j], high[j]]));
    ends.forEach(([, points], index) => capSeen[index] && seen[j] && creases.push(pathOf([points[j], points[(j + 1) % n]])));
  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };
}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);
  return hullOf([...circle(0, r0), ...circle(offset, r1)]);
}

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },
  );

function solidOf(profile, F, P, options = {}) {
  const first = profile[0];
  const last = profile[profile.length - 1];
  const meridian = [[first[0], 0], ...profile, [last[0], 0]];
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(meridian, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function bandOfProfile(profile, F, P, options = {}) {
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(profile, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function silhouettePoints(profile, F, P, { samples = 72, slope: given = null, radius = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const facing = Math.atan2(vV, uV);
  const flat = Math.hypot(uV, vV) || 1e-9;
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const radiusAt = radius ?? ((s) => {
    let index = 1;
    while (index < profile.length - 1 && profile[index][0] < s) index++;
    const [sa, ra] = profile[index - 1];
    const [sb, rb] = profile[index];
    return ra + ((rb - ra) * (s - sa)) / (sb - sa || 1);
  });
  const side = (sign) => {
    const points = [];
    for (let step = 0; step <= samples; step++) {
      const s = s0 + ((s1 - s0) * step) / samples;
      const h = (s1 - s0) / samples / 2 || 0.01;
      const slope = given ? given(s) : (radiusAt(Math.min(s1, s + h)) - radiusAt(Math.max(s0, s - h))) / (Math.min(s1, s + h) - Math.max(s0, s - h) || 1);
      const c = (slope * aV) / flat;
      if (Math.abs(c) > 1) continue;
      points.push(pointOf(F, s, radiusAt(s), facing + sign * Math.acos(c)));
    }
    return points;
  };
  return [side(1), side(-1)];
}

const silhouetteOf = (profile, F, P, options = {}) =>
  silhouettePoints(profile, F, P, options)
    .map((points) => pathOf(points.map((point) => iso(point, P))))
    .join("");

function profileCurve(profile, { slope = null, radius = null } = {}) {
  for (let index = 1; index < profile.length; index++) if (profile[index][0] - profile[index - 1][0] <= 1e-9) throw new Error(`profileCurve: s must rise along the profile (point ${index} at s = ${profile[index][0]})`);
  const segments = curveRuns(profile);
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const find = (s) => {
    let lo = 0;
    let hi = profile.length - 2;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (profile[mid][0] <= s) lo = mid;
      else hi = mid - 1;
    }
    return lo;
  };
  const linear = (index, s) => {
    const [sa, ra] = profile[index];
    const [sb, rb] = profile[index + 1];
    return [ra + ((rb - ra) * (s - sa)) / (sb - sa), (rb - ra) / (sb - sa)];
  };
  const radiusAt = radius ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].radius(at) : linear(index, at)[0];
  });
  const slopeAt = slope ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].slope(at) : linear(index, at)[1];
  });
  return { s0, s1, radius: radiusAt, slope: slopeAt, analytic: Boolean(slope && radius) };
}

function bandsOf(profile, cuts, F, P, { slope = null, radius = null, steps, rows = 6, rims = "none", fill = "auto", samples = 72 } = {}) {
  const curve = profileCurve(profile, { slope, radius });
  const { s0, s1 } = curve;
  const stops = [s0, ...[...new Set(cuts)].filter((s) => s > s0 + 1e-6 && s < s1 - 1e-6).sort((a, b) => a - b), s1];
  const most = Math.max(...profile.map(([, r]) => r), ...stops.map((s) => curve.radius(s)));
  const n = steps ?? stepsFor(most, 32, 160, scaleOf(P));
  const knot = (s, soft) => (soft ? [s, curve.radius(s), 1] : [s, curve.radius(s)]);
  const meridianOf = (a, b) => [knot(a), ...profile.filter(([s]) => s > a + 1e-9 && s < b - 1e-9).map(([s, , soft]) => knot(s, soft)), knot(b)];
  const shading = { slope: curve.slope, radius: curve.radius, rows };
  const bands = stops.slice(0, -1).map((a, index) => {
    const b = stops[index + 1];
    const meridian = meridianOf(a, b);
    const paths = lathe(meridian, F, P, { steps: n, rims, fill, smooth: shading });
    const seam = index < stops.length - 2 ? arcOf(F, b, curve.radius(b), P, { slope: curve.slope(b) }) : "";
    return { s0: a, s1: b, profile: meridian, paths: { ...paths, outline: "" }, outline: paths.outline, seam };
  });
  const sidesOf = (from = s0, to = s1, { ends = false, count = samples } = {}) => {
    const span = [Math.max(s0, from), Math.min(s1, to)];
    const dense = Array.from({ length: count + 1 }, (_, index) => knot(span[0] + ((span[1] - span[0]) * index) / count, true));
    const points = silhouettePoints(dense, F, P, { samples: count, slope: curve.slope, radius: curve.radius });
    const rim = (s) => arcOf(F, s, curve.radius(s), P, { slope: curve.slope(s) });
    const rimsAt = ends === true ? span : ends === "first" ? [span[0]] : ends === "last" ? [span[1]] : [];
    return { d: points.map((list) => pathOf(list.map((point) => iso(point, P)))).join("") + rimsAt.map(rim).join(""), points };
  };
  return { bands, sidesOf, radius: curve.radius, slope: curve.slope, steps: n, s0, s1 };
}

function arcOf(F, s, r, P, { slope = 0, steps = 0, least = 0.02, inward = false, from = 0, to = TAU, trim = 0.3 } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);

      if (event.type === 'click' && event.detail > 0 && target?.ownerSVGElement) {
        let closest = Infinity;
        for (const candidate of target.ownerSVGElement.querySelectorAll('[data-rig-hit]')) {
          const area = candidate.querySelector('.rig-hit-area');
          if (!area || !area.getClientRects().length) continue;
          const box = area.getBoundingClientRect();
          const dx = event.clientX - (box.left + box.width / 2);
          const dy = event.clientY - (box.top + box.height / 2);
          const distance = dx * dx + dy * dy;
          if (box.width && box.height && (2*dx/box.width)**2+(2*dy/box.height)**2 <= 1 && distance < closest) {
            target = candidate;
            closest = distance;

    first ??= now;
    const ended = document.hidden || host.closest('[hidden]');
    const progress = ended ? 1 : Math.min(1, (now - first) / durationMs);

        <p><strong>第三步：检查雷诺数。</strong>它比较惯性效应与黏滞效应：</p>
        <div class="formula">Re＝ρ₀vd/η<br>F黏＝6πηrv C [1＋3Re/16−19Re²/1080＋…]</div>
        <p>教材先以 η₀ 估算 Re：Re≤0.1 可用零级结果；0.1&lt;Re&lt;0.5 作一级修正；Re≥0.5 考虑二级修正。算完还要用修正后的 η 复核 Re。这里是低 Re 展开的分级，并不保证在任意大 Re 下仍然准确。教材提到的管流 Re≈2000、3000 的层流/湍流分界也不能拿来当作落球斯托克斯公式的适用上限。</p>
        <div class="formula">a＝ρ₀vd<br>η₁＝η₀−3a/16<br>η₂＝½[η₁＋√(η₁²＋19a²/270)]</div>
        <p>最后一式是教材式(5-12)的等价正根写法。若一级结果非正，或修正比例很大，应先反查单位和测量条件，不能把低阶展开当作万能补救。</p>
        <details><summary>毛细管比较法：为什么只比较流出时间就够了？</summary>
          <p>半径 r、长 L 的细管，在稳定层流下满足泊肃叶定律 Q＝πr⁴Δp/(8ηL)，Q＝V/t。竖直管还要计入重力产生的压差。教材对 U 形管用伯努利关系得到 Δp＝ρg(H−L)，因而 V＝πr⁴ρgHt/(8ηL)。管泡处截面较大，液面流速可近似忽略。</p>
          <p>H 在流动中变化，难以直接精确读取。对同一支黏度计、同一段起止刻线、相同流出体积，分别测已知液体1和待测液体2的时间，几何因子与相同的液面变化过程相消：</p>
          <div class="formula">η₂＝η₁(ρ₂t₂)/(ρ₁t₁)</div>
          <p>U 形黏度计左侧管泡上下有 C、A 刻线，右侧为较粗管和管泡。装定量液体，用吸球将液体吸至左侧；保持仪器竖直，记录液面从同一上刻线流到下刻线的时间。两种液体各自密度与参考黏度都应对应实际测量温度。</p>
        </details>`},
      {title:'交互练习',pages:'对应 pp.96–100；以下数值为教学模拟',html:`
        <div class="sim" data-vsim>
          <p><strong>把一次落球读数换成黏度。</strong>固定教学条件：球密度 7800 kg/m³、液体密度 960 kg/m³、计时区 L＝20 cm、筒内径 D＝50 mm、液深 h＝40 cm，g＝9.81 m/s²。这里修改的是“测得的直径和时间”，不是在预测同一种油任意下落时的运动。</p>
          <div class="sim-controls"><label>球直径 d / mm <input data-vd type="range" min="0.5" max="4" step="0.1" value="2"><output data-vdo>2.0</output></label><label>通过20 cm的时间 t / s <input data-vt type="range" min="2" max="40" step="0.2" value="8"><output data-vto>8.0</output></label><button type="button" data-vreset>恢复示例</button></div>
          <div data-vsvg></div><p class="reading" data-vread aria-live="polite"></p>
          <p class="hint">试一试：保持球径不变，把时间增加一倍，速度与 η₀ 怎样变化？再缩小球径并把时间调得很短，观察为什么修正会失效。图中的球位于计时区中部，只是装置示意。</p>
          <details><summary>毛细管比较法计算练习</summary><p>教学示例：已知液体 η₁＝1.002 mPa·s、ρ₁＝998.2 kg/m³，待测液体 ρ₂＝789 kg/m³。保持相同管子、刻线与温度。</p><div class="sim-controls"><label>参考液时间 t₁ / s <input data-ct1 type="number" min="1" max="10000" value="60"></label><label>待测液时间 t₂ / s <input data-ct2 type="number" min="1" max="10000" value="90"></label></div><p class="reading" data-cread aria-live="polite"></p></details>
        </div>`},
      {title:'操作与记录',pages:'pp.99–100',html:`
        <ol><li><strong>静置、检查。</strong>待测油长时间静置，排除气泡；测量中保持液体静止，不捞取落到底部的小球。检查球表面洁净、无明显损伤。</li>
          <li><strong>找匀速区。</strong>先设计验证办法，例如比较相邻等长区间的通过时间，在重复测量不确定度范围内相等，才把该段当作匀速区。上边界应避开释放后的加速段，下边界应离底部足够远；选定 N₁、N₂，测 L。</li>
          <li><strong>测球。</strong>用螺旋测微器测同一规格6个球的直径，用电子天平称质量，分别求平均值；记录是否采用合称后除以球数，以及各仪器分辨率和零点修正。</li>
          <li><strong>投球、计时。</strong>在量筒中央、尽量接近液面处轻轻释放，使入液初速度接近零。球应沿中央下落；测通过 N₁、N₂的时间，重复6次，先平均时间，再求 v＝L/t̄。</li>
          <li><strong>测环境和容器。</strong>R（或 D）、h、ρ₀和温度各测3次。温度按实验开始、中间、结束三次的均值记录，同时保留变化范围。</li>
          <li><strong>计算并复核。</strong>算 η₀与 Re，按需要算 η₁或 η₂并复核。共选3种不同直径的小球，每种测6个，比较修正后的结果是否一致。</li></ol>
        <div class="table-wrap"><table><thead><tr><th>每种球的原始记录</th><th>保留内容</th></tr></thead><tbody><tr><td>球1～6</td><td>d、m、t；异常轨迹或气泡备注</td></tr><tr><td>公共条件</td><td>N₁、N₂、L；D或R、h、ρ₀的3次读数</td></tr><tr><td>温度</td><td>T开始、T中间、T结束、平均及范围</td></tr><tr><td>结果</td><td>ρ、v、η₀、Re、修正阶数、最终η及不确定度</td></tr></tbody></table></div>
        <details><summary>教材的提升、进阶、高阶任务，逐项保留</summary>
          <ul><li><strong>提升：</strong>测不同温度的黏度，作 η—T 曲线；按 Andrade 关系把指数形式转成直线拟合。辅学表达：η＝Aexp(B/T)，即 lnη＝lnA＋B/T，T 必须用 K；此经验式的温区与液体需验证。</li>
            <li><strong>进阶：</strong>了解旋转法、毛细管比较法、扭摆法的原理与操作，并分别测黏度；根据得到的黏度—温度曲线比较不同数学形式的拟合。比较残差和适用温区，不能只看拟合优度。</li>
            <li><strong>高阶：</strong>设计利用加速度传感器、无线通信、自动采集等方法测半透明液体黏度。先明确传感器测什么、如何标定、传感装置是否改变球的质量/体积/阻力，再用已知液体检验。</li></ul>
          <p class="hint">这些是教材列出的扩展要求；具体转子、扭摆和传感器的参数与安全操作应依实验室仪器说明书，不把本册的教学模型直接当作实际器材设置。</p>
        </details>`},
      {title:'数据处理与误差',pages:'pp.96–102',html:`
        <p>先统一 SI 单位：mm→m、cm→m、g→kg、g/cm³→kg/m³；1 mPa·s＝10⁻³ Pa·s。计算顺序是原始数据平均→球密度→v→η₀→Re与修正→不同球径比较。中间值多保留几位，最终按不确定度确定有效数字。</p>
        <p>主要误差：球径读数与球不圆；计时起止反应及视差；未达到匀速；偏离筒中央、碰壁或附着气泡；液体尚在流动；温度漂移；密度、筒内径及液深读数；边界与低 Re 近似本身。多测球只能减小部分随机误差，无法消除未达匀速、单位错误等系统偏差。</p>
        <p>在把球密度作为独立测量量、暂不计边界修正误差时，可用下式看出敏感项：</p>
        <div class="formula">[u(η)/η]²≈[u(ρ−ρ₀)/(ρ−ρ₀)]²＋[2u(d)/d]²＋[u(t)/t]²＋[u(L)/L]²</div>
        <p>若 ρ 正是用同一个 d 和 m 算出来，ρ 与 d 有关联，不能把上式各项独立相加；应将 ρ＝6m/(πd³)代回完整黏度公式后对原始独立量传播。要求完整不确定度时还要包括 D、h、修正模型及温度的影响。对照表值必须先匹配液体种类与温度。</p>
        <details><summary>教材全部黏度参考表：水、酒精、蓖麻油</summary>
          <p>下列数值按教材表5-1～5-3转录。水、酒精的列单位为 mPa·s；蓖麻油为 Pa·s。水表中21°C的0.987也保留原书数值，使用精密参考值时应另核对可靠标准数据。</p>
          <h4>蒸馏水（p.101）</h4>${referenceTable(water,'η / mPa·s',3)}
          <h4>酒精（p.101）</h4>${referenceTable(alcohol,'η / mPa·s',3)}
          <h4>蓖麻油（p.102）</h4>${referenceTable(castor,'η / Pa·s',3)}
        </details>
        <div class="sim"><p>按教材“温度有小数时用内插法”的做法，练习查表。这里只作相邻两点的线性内插，不作区间外推。</p><label>温度 / °C <input data-vtemp type="number" min="0" max="40" step="0.1" value="22.5"></label><p class="reading" data-vlookup aria-live="polite"></p></div>`},
      {title:'思考题',pages:'pp.100–101',html:`
        <p>教材的两道预习题、两道过程题和一道报告题均在这里。先用自己的话回答，再展开核对思路。</p>
        <details><summary>预习1：落球法和毛细管法分别适合哪些液体？</summary><p>落球法要能观察球的运动、形成稳定匀速区并满足低 Re 条件，通常用于较黏、透明或半透明液体；毛细管法适合能在细管中稳定层流、管内无堵塞且与器壁相容的液体，常用于较小黏度液体。两者都需控温；不应仅凭“透明”或“稀”一项决定。</p></details>
        <details><summary>预习2：什么是雷诺数，它表示什么？</summary><p>Re＝ρ₀vd/η，是无量纲量，反映惯性作用相对黏滞作用的强弱。v、d或ρ₀增大，Re增大；η增大，Re减小。落球公式要求很小的 Re；不要套用管流的2000阈值。</p></details>
        <details><summary>过程1：落球法中可能引起误差的因素有哪些？</summary><p>从“长度、时间、质量/密度、温度、轨迹、模型”六条线排查：球径与球形、测距与视差、人工计时、液体密度、温漂、气泡/流动、球未匀速或偏壁，以及有限容器与惯性修正。逐项说明偏差能否靠重复测量减小。</p></details>
        <details><summary>过程2：同种材料的大球能否沿用小球的匀速区？反过来呢？</summary><p>不能直接沿用。低 Re 模型中的速度弛豫时间约为 ρd²/(18η)，大球通常需要更长时间和距离才接近终速，且 Re 和边界效应更大；小球已经匀速并不证明大球匀速。若大球的某段确已匀速，小球一般更早接近终速，但仍须实测等长区间时间验证，并排除底部边界影响，不能只凭球径推断。</p></details>
        <details><summary>报告题：直径1 m、速度10 m/s、水温10°C的球形水雷，附近海水的 Re 是多少？</summary><p>先写 Re＝ρ₀vd/η。题面给 η＝1.3×10⁻⁴ Pa·s，未给海水密度；若为数量级估算取 ρ₀≈1.0×10³ kg/m³，则 Re≈7.7×10⁷，远不能用斯托克斯阻力。</p><p><strong>原书数值需核对：</strong>同页蒸馏水10°C附表是1.307×10⁻³ Pa·s，与题面相差约一个数量级，且蒸馏水不等于海水。若题目本意为1.3×10⁻³，则同一密度假设下 Re≈7.7×10⁶。报告应写清采用题面数值及密度假设，指出差异，不能悄悄改题或宣称得到唯一精确值。</p></details>`}
    ],
    mount(chapter) {
      const q=s=>chapter.querySelector(s);
      function updateFall() {
        const d=Number(q('[data-vd]').value)/1000,t=Number(q('[data-vt]').value),v=.2/t,rho0=960,a=rho0*v*d,C=(1+2.4*d/.05)*(1+1.65*d/.4);
        const raw=(7800-rho0)*9.81*d*d/(18*v),e0=raw/C,e1=e0-3*a/16,e2=(e1+Math.sqrt(e1*e1+19*a*a/270))/2,re0=a/e0;
        const order=re0<=.1?0:(e1>0&&a/e1<.5?1:2),eta=[e0,e1,e2][order],re=a/eta;
        q('[data-vdo]').textContent=(d*1000).toFixed(1);q('[data-vto]').textContent=t.toFixed(1);
        let warning='';if(e1<=0)warning=' 一级结果已非正：低 Re 修正前提明显失效，应反查单位并改变测量条件。';else if(re>=1)warning=' 当前 Re≥1，低阶展开可靠性不足，不能把显示值当成准确黏度。';else if(re>=.5)warning=' 当前需要考虑二级修正，同时检查低 Re 展开的适用程度。';
        q('[data-vread]').textContent=`v＝${(v*100).toFixed(3)} cm/s；无限液体公式给 ${raw.toFixed(4)} Pa·s；容器修正后 η₀＝${e0.toFixed(4)} Pa·s，初算 Re＝${re0.toFixed(3)}。一级 η₁＝${e1.toFixed(4)} Pa·s；二级 η₂＝${e2.toFixed(4)} Pa·s。按教材分级${order?'采用'+order+'级':'保留零级'}结果 ${eta.toFixed(4)} Pa·s，复核 Re＝${re.toFixed(3)}。${warning}`;
        const br=5+d*2600;
        q('[data-vsvg]').innerHTML=svgStart('落球法装置示意：上虚线N₁开始计时，下虚线N₂停止计时')+`<path d="M80 25V255H250V25" fill="none" stroke="currentColor" stroke-width="3"/><path d="M82 50H248V253H82Z" fill="#60b7c0" opacity=".18"/><path d="M80 50H250" stroke="#25838a" stroke-width="2"/><path d="M65 95H275M65 215H275" stroke="currentColor" stroke-dasharray="5 5"/><circle cx="165" cy="155" r="${br}" fill="#397baa"/><path d="M165 175V198M159 191L165 199L171 191" fill="none" stroke="#397baa" stroke-width="2"/><path d="M285 95V215M279 95H291M279 215H291" stroke="currentColor"/>`+svgEnd(`<div><strong>上虚线 N₁：</strong>开始计时。</div><div><strong>下虚线 N₂：</strong>停止计时。</div><div>两线间距 L＝20 cm；筒内径 D＝50 mm。</div><div>通过两线的时间 t＝${t.toFixed(1)} s。</div>`);
      }
      function updateCap(){ const t1=Number(q('[data-ct1]').value),t2=Number(q('[data-ct2]').value);q('[data-cread]').textContent=t1>0&&t2>0?`η₂＝1.002 × (789 × ${t2}) / (998.2 × ${t1})＝${(1.002*789*t2/(998.2*t1)).toFixed(4)} mPa·s。时间比相同而密度不同，不能省掉密度比。`:'两个时间都必须大于零。'; }
      function updateLookup(){const raw=String(q('[data-vtemp]').value).trim(),t=Number(raw);if(raw===''||!Number.isFinite(t)){q('[data-vlookup]').textContent='请输入有效温度。';return;}const values=[interp(water,t),interp(alcohol,t),interp(castor,t)];q('[data-vlookup]').textContent=`教材内插值：蒸馏水 ${values[0]===null?'超出0～30°C表区间':values[0].toFixed(4)+' mPa·s'}；酒精 ${values[1]===null?'超出0～40°C表区间':values[1].toFixed(4)+' mPa·s'}；蓖麻油 ${values[2]===null?'超出0～40°C表区间':values[2].toFixed(4)+' Pa·s'}。`;}
      ['[data-vd]','[data-vt]'].forEach(s=>q(s).addEventListener('input',updateFall));q('[data-vreset]').addEventListener('click',()=>{q('[data-vd]').value=2;q('[data-vt]').value=8;updateFall();});
      ['[data-ct1]','[data-ct2]'].forEach(s=>q(s).addEventListener('input',updateCap));q('[data-vtemp]').addEventListener('input',updateLookup);updateFall();updateCap();updateLookup();
    }
  });

  addLesson({
    id:'6', title:'表面张力系数的测量', pages:'教材 pp.102–108',
    summary:'先标定约利弹簧秤，再测液膜破裂前增加的拉力；或测毛细管的半径和液面升高，求表面张力系数。',
    sections:[
      {title:'目标与装置',pages:'pp.102–106',html:`
        <p>水滴趋向收缩、露珠近似球形、细玻璃管中的水面上升，都与液体表面有关。表面张力让液面趋向缩小；表面张力系数 σ 表示<strong>每单位接触线长度对应多大的沿面拉力</strong>，单位 N/m。它不是整个液面的总拉力，也不是上一节的黏度。</p>
        <ul><li>了解表面张力的背景、测量方法及仪器结构。</li><li>掌握拉脱法与毛细管法原理；了解滴重、悬滴、卧滴、液桥、最大泡压和激光衍射表面毛细波等方法。</li><li>学会标定，再用作图或最小二乘法处理数据、分析误差。</li></ul>
        <p><strong>基础拉脱装置：</strong>约利弹簧秤、砝码、游标卡尺、金属丝、烧杯及烧杯内的液体。秤由秤框、升降金属杆、升降钮、锥形弹簧、带小镜子的挂钩、平衡指示玻璃管、平台、平台调节螺丝和底脚螺丝组成。挂钩穿过玻璃管但不能相碰。</p>
        <p><strong>毛细管装置：</strong>毛细管、温度计、读数显微镜、烧杯、玻璃皿、升降台、支架、蒸馏水、洗涤液和待测样品。</p>
        <p>润湿取决于固体—液体相互作用、杂质、温度与表面清洁程度。水可润湿洁净玻璃，难以润湿石蜡；本实验清洗是否彻底会直接改变接触角和结果。</p>`},
      {title:'原理与读数',pages:'pp.103–106',html:`
        <p><strong>拉脱法：先扣除金属丝自己的重量。</strong>在液面画一条长 l 的线，线两侧液体的沿面作用力 F′＝σl。金属丝缓慢提起液膜，破裂前的最大测力读数 F 包含自重 mg 和液膜两面的拉力：</p>
        <div class="formula">F＝mg＋2σl；σ＝(F−mg)/(2l)</div>
        <p>“2”来自液膜的两面，不能漏掉。基础操作用游标卡尺测金属丝两脚间距 s，作为式中的有效水平长度 l；实际金属丝形状应符合装置要求。</p>
        <p><strong>约利秤为什么要三线对齐？</strong>普通弹簧秤固定上端、读下端移动；约利秤在每次读数时把下端恢复到同一个基准位置，读取上端升降杆移动。因此要使小镜上的指示横线、平衡管刻线及其镜中像重合，减少视差并维持同一弹簧下端位置。</p>
        <div class="formula">标定：F＝kΔl（弹性限度内）<br>空挂金属丝时读 l₀，拉脱前读 lₘ；σ＝k(lₘ−l₀)/(2s)</div>
        <p>lₘ−l₀是扣除自重后的弹簧伸长增量，<strong>不是液膜高度</strong>。缓慢拉起到液膜将破裂时读 lₘ；若等破裂后才读，表面拉力已经消失。</p>
        <p><strong>毛细管法：用上升液柱的重量平衡表面张力的竖直分量。</strong>半径 r，管内外液面高度差 h，接触角 θ 时，近似有 ρghπr²＝2πrσcosθ。教材的洁净玻璃—纯水取 θ≈0，得到 σ＝ρgrh/2。</p>
        <p>h 从管内凹液面的<strong>最低点</strong>量到管外平液面。凹面周围尚有一部分液体，完全润湿时近似为半球面；补上的液体体积相当于 r/3 高的液柱，因此：</p>
        <div class="formula">σ＝½ρgr(h＋r/3)</div>
        <p>r/3是弯月面体积修正。式中 r 必须是半径，ρ对应测量温度；该修正式基于洁净、完全润湿与近似半球凹面。若接触角不再近零、容器有限或管径明显不均匀，不能只加 r/3就认为所有影响已消除。</p>`},
      {title:'交互练习',pages:'对应 pp.105–107；以下数值为教学模拟',html:`
        <div class="sim" data-ssim>
          <div class="sim-controls"><label>练习方法 <select data-smode><option value="pull">约利弹簧秤拉脱</option><option value="cap">毛细管上升</option></select></label></div>
          <div data-spull><p>把下列数据当作一次<strong>破裂前极限读数</strong>。空挂读数 l₀＝20.00 mm，改变的是弹簧增量，不是液膜高度。</p><div class="sim-controls"><label>标定系数 k / (N/m) <input data-sk type="number" min="0.1" max="20" step="0.01" value="2"></label><label>两脚间距 s / mm <input data-ss type="number" min="10" max="200" step="1" value="50"></label><label>增量 lₘ−l₀ / mm <input data-sdl type="range" min="0.2" max="8" step="0.05" value="3.6"><output data-sdlo>3.60</output></label><button type="button" data-sfit>用模拟标定点拟合 k</button></div><p data-sfitread class="hint">可先使用 k＝2.00 N/m；下方“数据处理”保留全部模拟标定点。</p></div>
          <div data-scap hidden><p>练习把测得的 r、h 换成 σ。模型取完全润湿、ρ＝998.2 kg/m³、g＝9.81 m/s²。</p><div class="sim-controls"><label>内半径 r / mm <input data-sr type="number" min="0.1" max="2" step="0.05" value="0.5"></label><label>液面高度差 h / mm <input data-sh type="number" min="0.1" max="200" step="0.01" value="29.55"></label><button type="button" data-swater>填入20°C纯水的模型高度</button></div></div>
          <div data-ssvg></div><p class="reading" data-sread aria-live="polite"></p>
          <p class="hint" data-shint>观察：若漏掉液膜的第二个面，所得 σ 将大一倍。图上液膜形状仅作示意，不能用它反推伸长读数。</p>
        </div>`},
      {title:'操作与记录',pages:'pp.106–107',html:`
        <p><strong>基础任务一：标定弹簧。</strong>按顺序装锥形弹簧、带镜挂钩和小砝码盘。调底脚使秤框竖直，使小镜处在玻璃管中央，挂钩上下运动不摩擦管壁。逐次加0.5 g砝码，在0.5～5 g范围内测量；每次调升降钮、恢复三线对齐，记升降杆位置。记录零载读数，必要时作增减载比较。</p>
        <p><strong>基础任务二：测自来水。</strong></p>
        <ol><li>用游标卡尺测金属丝两脚间距 s，记录重复读数与仪器分辨率。</li><li>取下砝码，在砝码盘下挂洁净金属丝。三线对齐，记空挂读数 l₀。</li><li>把盛自来水的烧杯放平台上，调平台微调螺丝和升降钮，使金属丝浸入水面下。</li><li>缓慢下降烧杯并升高上端金属杆，始终恢复三线对齐。在液膜将破裂时读 lₘ；重复5次并求平均。</li></ol>
        <p><strong>基础任务三：测肥皂水。</strong>完成自来水后擦干金属丝，换成肥皂水，重复浸入、缓慢拉脱及读数。保持清洗和样品处理一致，避免把肥皂带进后续纯水样品；改变挂载后应核查空挂基线。</p>
        <p><strong>基础任务四：</strong>用作图或最小二乘法处理数据，计算 σ，与给定参考值比较、求相对误差；分析误差来源和不确定度。附表是空气接触纯水，不应把未知浓度肥皂水或自来水都当作同一个标准样品。</p>
        <div class="table-wrap"><table><thead><tr><th>记录组</th><th>必须保留的原始量</th></tr></thead><tbody><tr><td>标定</td><td>砝码质量m、F＝mg、杆位置、空载基准、三线对齐情况</td></tr><tr><td>各液体5次</td><td>液体/温度、s、l₀、每次lₘ、Δl、异常情况</td></tr><tr><td>毛细管法</td><td>多位置内径、管内凹面最低点/外液面读数、h、温度、ρ、清洗情况</td></tr></tbody></table></div>
        <details><summary>提升内容：力敏传感器拉脱与毛细管测量</summary>
          <ul><li><strong>力敏传感器：</strong>先标定拉力—电压曲线并拟合转换系数；测圆环拉脱前后电压，用电压差换成拉力，再按环的实际内外接触周长求 σ。研究拉力随液膜长度的变化，讨论各阶段的力，选取最佳读值并分析不确定度。不能直接把直金属丝的2s代入圆环装置。</li><li><strong>毛细管：</strong>搭建装置，测内径、上升高度和水温；作弯月面高度修正，并考虑有限截面外容器以及管内外压强差的修正。记录装置几何、分析误差和不确定度；具体附加修正式应按该装置模型推导。</li></ul>
        </details>
        <details><summary>进阶内容：教材列出的五项要求</summary><ol>
          <li>用各种拉脱法和毛细管法，更换样品测量 σ。</li><li>学习最大泡压法，自行搭建负压测量装置，可采用低成本 U 形压差计或高精度压力计；也可用气泵改成正压测量。核心是辨认气泡形成过程中最大压差与管口曲率的关系，并扣除液柱静压。</li><li>学习滴重法：了解滴落液滴重量、管径与 σ 的关系；搭装置、测管径、多滴称重求平均，再用依管径与液滴体积而定的校正系数求 σ。脱落液滴并不等于管口全部悬挂液体，不能无条件直接套理想平衡。</li><li>学习悬滴法：拍摄悬滴轮廓，做图像识别，取得形状因子与特征长度之比，再查表求 σ；记录图像比例尺与密度差。</li><li>提高实验设计能力，学习图像分析相关知识。</li></ol></details>
        <details><summary>高阶内容：教材列出的五项要求</summary><ol>
          <li>给拉脱/毛细管装置加温控，研究温度与 σ 的关系。</li><li>掌握悬滴、液桥、卧滴的形象识别方法。</li><li>激光衍射表面毛细波法：改变信号发生器频率，测衍射条纹间距，拟合频率与光斑间距，用表面波色散关系求 σ；进一步探索与黏度等物性参数的关系。</li><li>研究生活中的相关现象，如铝箔小船、曲别针/图钉/硬币漂浮；用托里拆利规律等方法探索测量，并查阅资料设计其他实验。</li><li>设计新仪器，例如接触角测量仪或旋转滴表面张力测量仪。</li></ol><p class="hint">教材对这些方法给出研究方向，未给通用参数。实验方案应分别明确可观测量、标定、模型条件与独立验证。</p></details>`},
      {title:'数据处理与误差',pages:'pp.106–108',html:`
        <p><strong>先标定后测量。</strong>以弹簧伸长或升降杆位置作横轴，以砝码重力 F 作纵轴，拟合 F＝kx＋b，斜率是 k。若位置用 mm、力用 mN，斜率的数值恰好等于 N/m。截距可吸收固定基线，不应未经检查强迫直线过原点；观察残差有无弯曲或增减载差异。</p>
        <details><summary>用于交互的全部模拟标定点（非教材实测）</summary>
          <p>教学数据取 g＝9.81 m/s²，杆位置含任意15 mm附近的基线。点击“用模拟标定点拟合 k”计算含截距的最小二乘直线。</p>
          <div class="table-wrap"><table><thead><tr><th>m / g</th><th>杆位置 / mm</th><th>F / mN</th></tr></thead><tbody>${calibration.map(([m,x])=>`<tr><td>${m.toFixed(1)}</td><td>${x.toFixed(2)}</td><td>${(m*9.81).toFixed(3)}</td></tr>`).join('')}</tbody></table></div>
        </details>
        <p>教学算例：k＝2.00 N/m，s＝50.0 mm，平均拉脱增量3.60 mm，则增力 ΔF＝7.20 mN，σ＝0.0720 N/m＝72.0 mN/m。若漏扣自重会偏大；若只算一个液膜面也会偏大。相对误差＝|测量值−参考值|/|参考值|；参考值须对应样品与温度。</p>
        <p>约利秤的主要误差来自三线未对齐、挂钩碰壁、未在弹性范围标定、拉脱太快、错过破裂前极值、金属丝不水平或不洁、s读数、温漂和样品污染。空挂基线与极值作差，两次读数的不确定度都要计入。</p>
        <div class="formula">σ＝kΔl/(2s)<br>[u(σ)/σ]²≈[u(k)/k]²＋[u(Δl)/Δl]²＋[u(s)/s]²</div>
        <p>上式按独立量传播。若两次读数相关，应按协方差处理；重复5次主要降低随机读数误差，不能替代清洁和仪器标定。</p>
        <p>毛细管法重点检查：内径不均匀/读数误差、管不竖直、内外液面高度差、弯月面最低点定位、接触角不为零、温度与密度变化、有限外容器和气泡。忽略正的 r/3 修正通常使算得的 σ 偏小；未完全润湿却仍用 cosθ＝1，也会使结果偏小（其余模型条件成立时）。</p>
        <details><summary>毛细管修正式的不确定度传播</summary><div class="formula">σ＝½ρgr(h＋r/3)<br>[u(σ)/σ]²≈[u(ρ)/ρ]²＋{[(h＋2r/3)/(r(h＋r/3))]u(r)}²＋[u(h)/(h＋r/3)]²</div><p>此式只表达独立测量量的传播，未把接触角、形状近似和有限容器的模型偏差自动算进去。若 r 与 h 在同一图像中测得，还应考虑比例尺带来的相关性。</p></details>
        <details><summary>教材附表6-1：不同温度下与空气接触纯水的 σ（p.108）</summary>${referenceTable(tension,'σ / mN·m⁻¹',2)}</details>
        <div class="sim"><label>纯水参考温度 / °C <input data-stemp type="number" min="0" max="45" step="0.1" value="20"></label><p class="reading" data-slookup aria-live="polite"></p></div>`},
      {title:'思考题',pages:'p.108',html:`
        <p>保留教材的两道预习题、两道过程题和一道报告题；下面是作答思路，不能替代对实际装置的观察。</p>
        <details><summary>预习1：约利弹簧秤测表面张力有什么优点？</summary><p>用已标定的弹簧把微小拉力转为可读的上端位移；每次恢复下端固定基准，以三线对齐减少视差；用空挂与拉脱前读数作差扣除自重。它适合缓慢读取临界拉力，但仍须及时捕捉破裂前读数并控制振动。</p></details>
        <details><summary>预习2：毛细管法适用于哪些液体？</summary><p>液体需能形成稳定、可读的弯月面，与毛细管材料相容，密度已知，接触角可确定。本节 σ＝ρgr(h＋r/3)/2 尤其适用于洁净玻璃中近乎完全润湿的液体；对不润湿液体可出现下降，要改用相应接触角和弯月面模型，不能直接套本式。</p></details>
        <details><summary>过程1：约利弹簧秤的弹簧为什么做成锥形？</summary><p>应结合实物观察各圈半径、圈间距和挂载方式。锥形使各圈的几何尺寸、受力响应不同，也影响稳定性和圈间干扰；“做成锥形就一定更灵敏”并不是普遍结论，实际灵敏度由标定得到的 k 决定，位移灵敏度为1/k。</p><p class="hint">教材只提出此题，未提供定量设计解释。不同仪器的锥形结构用途可能不同，正式作答还应核对本实验仪器说明书；不能把未核实的结构理由写成已知事实。</p></details>
        <details><summary>过程2：毛细管法有哪些误差？</summary><p>列出 r、h、ρ及温度的测量误差，再检查完全润湿、管径均匀、管竖直、弯月面形状和外容器无限大等假设。区分可重复读数减小的随机项，与接触角/容器修正等系统项；特别说明 h 从凹面最低点量起，r/3修正不能漏掉。</p></details>
        <details><summary>报告题：A管液面高于B管，B管就会持续滴水、构成“毛细管永动机”吗？</summary><p>不会。“连通器液面必等高”省略了弯曲液面两侧的表面张力压差。不同管径产生不同弯月面曲率和毛细压差，静止时水柱高度差正可与这些压差平衡；不能仅凭A管液面较高就断定B口会不断流出。</p><p>即使某次初始状态发生有限流动，形成/改变液面、生成液滴都需要改变表面能。系统达到平衡后停止，黏性还会耗散能量。没有持续外部能量输入就不能循环做功；毛细上升释放的润湿相关自由能不是无限能源。</p></details>`}
    ],
    mount(chapter) {
      const q=s=>chapter.querySelector(s);
      function update() {
        const cap=q('[data-smode]').value==='cap';q('[data-spull]').hidden=cap;q('[data-scap]').hidden=!cap;
        if(!cap){
          const k=Number(q('[data-sk]').value),s=Number(q('[data-ss]').value),dl=Number(q('[data-sdl]').value);q('[data-sdlo]').textContent=dl.toFixed(2);
          if(!(k>0&&s>0)){q('[data-sread]').textContent='k与两脚间距均须大于零。';q('[data-ssvg]').innerHTML='';return;}
          const f=k*dl,sigma=f/(2*s)*1000;
          q('[data-sread]').textContent=`lₘ＝${(20+dl).toFixed(2)} mm；ΔF＝kΔl＝${f.toFixed(3)} mN；σ＝${sigma.toFixed(2)} mN/m（${(sigma/1000).toFixed(5)} N/m）。这是模拟极限读数的换算结果。`;
          q('[data-shint]').textContent='观察：漏掉液膜第二个面会使σ大一倍。杆读数增量是弹簧伸长增量，图上液膜高度只是示意。';
          const spring=Array.from({length:15},(_,i)=>`${i%2?172:148},${35+i*4}`).join(' ');
          q('[data-ssvg]').innerHTML=svgStart('约利弹簧秤与双面液膜示意：两个向下箭头表示液膜两面的拉力')+`<path d="M110 25H220M160 25V35" stroke="currentColor" stroke-width="3"/><polyline points="${spring}" fill="none" stroke="#397baa" stroke-width="2"/><path d="M160 91V135M120 152V135H200V152" fill="none" stroke="currentColor" stroke-width="3"/><path d="M120 137H200L220 205H100Z" fill="#60b7c0" opacity=".27"/><path d="M60 180V250H260V180M61 205H259" fill="none" stroke="currentColor" stroke-width="2"/><path d="M142 149V175M137 168L142 176L147 168M178 149V175M173 168L178 176L183 168" fill="none" stroke="#25838a" stroke-width="2"/>`+svgEnd(`<div>弹簧 k＝${k.toFixed(3)} N/m。</div><div>杆读数增量 Δl＝${dl.toFixed(2)} mm。</div><div>金属丝两脚间距 s＝${s.toFixed(1)} mm。</div><div><strong>液膜的两个面</strong>各向下拉 σs，总拉力为 2σs。</div>`);
        } else {
          const r=Number(q('[data-sr]').value)/1000,h=Number(q('[data-sh]').value)/1000;
          if(!(r>0&&h>0)){q('[data-sread]').textContent='半径与上升高度均须大于零。';q('[data-ssvg]').innerHTML='';return;}
          const plain=.5*998.2*9.81*r*h,correct=.5*998.2*9.81*r*(h+r/3);
          q('[data-sread]').textContent=`h＋r/3＝${((h+r/3)*1000).toFixed(3)} mm；未加弯月面修正：${(plain*1000).toFixed(3)} mN/m；修正后 σ＝${(correct*1000).toFixed(3)} mN/m。修正相对未修正值增加 ${(r/(3*h)*100).toFixed(2)}%。`;
          q('[data-shint]').textContent='先改变管半径，再按“填入20°C纯水的模型高度”：同种液体管越细，上升越高。每次都根据r与h重新计算σ。';
          const yy=215-Math.min(150, h*3600), w=12+Math.min(24,r*12000);
          q('[data-ssvg]').innerHTML=svgStart('毛细管上升：蓝色标尺表示凹液面最低点到管外液面的高度差')+`<path d="M55 180V255H270V180M56 215H269" fill="none" stroke="currentColor" stroke-width="2"/><path d="M${160-w} 30V235M${160+w} 30V235" stroke="currentColor" stroke-width="2"/><path d="M${160-w+1} ${yy-9}Q160 ${yy+9} ${160+w-1} ${yy-9}V254H${160-w+1}Z" fill="#60b7c0" opacity=".35"/><path d="M${160-w} ${yy-9}Q160 ${yy+9} ${160+w} ${yy-9}" fill="none" stroke="#25838a" stroke-width="2"/><path d="M215 ${yy}V215M210 ${yy}H220M210 215H220" stroke="#397baa" stroke-width="2"/>`+svgEnd(`<div>内半径 r＝${(r*1000).toFixed(2)} mm。</div><div><strong>蓝色标尺 h＝${(h*1000).toFixed(2)} mm：</strong>从凹液面最低点量到管外液面。</div><div>计算时再补 r/3。</div><div>此图为示意，几何不按同一比例。</div>`);
        }
      }
      ['[data-smode]','[data-sk]','[data-ss]','[data-sdl]','[data-sr]','[data-sh]'].forEach(s=>q(s).addEventListener('input',update));
      q('[data-sfit]').addEventListener('click',()=>{const fit=fitCalibration();q('[data-sk]').value=fit.k.toFixed(5);q('[data-sfitread]').textContent=`模拟点最小二乘拟合：F/mN＝${fit.k.toFixed(5)} × 杆位置/mm ${fit.b<0?'−':'＋'} ${Math.abs(fit.b).toFixed(5)}；因此 k＝${fit.k.toFixed(5)} N/m。截距对应位置基线。`;update();});
      q('[data-swater]').addEventListener('click',()=>{const r=Number(q('[data-sr]').value)/1000;if(r>0){q('[data-sh]').value=PhysLabNoise.sample((2*.07275/(998.2*9.81*r)-r/3)*1000,.085,{min:0}).toFixed(4);update();}});
      function lookup(){const raw=String(q('[data-stemp]').value).trim(),t=Number(raw);if(raw===''||!Number.isFinite(t)){q('[data-slookup]').textContent='请输入有效温度。';return;}const v=interp(tension,t);q('[data-slookup]').textContent=v===null?'超出教材0～45°C表区间，不作外推。':`教材纯水参考值（相邻点线性内插）：${v.toFixed(3)} mN/m＝${(v/1000).toFixed(6)} N/m。`;}
      q('[data-stemp]').addEventListener('input',lookup);update();lookup();
    }
  });
})();

  function table(host,selector,rows){host.querySelector(selector).innerHTML=rows.length?rows.join(''):'<tr><td colspan="5">完成一次操作后，把读数记录在这里。</td></tr>';}
  function fallModel(dmm,L){

  registerBench('5',{
    title:'落球法：让球和秒表一起说话',
    intro:'先认出玻璃筒上的两条计时圈、投球导向口和秒表。球的位置与过线时刻由同一黏滞运动模型计算。',
    task:'点球盘换球，点下标圈切换10/20 cm区段，再点筒口释放。球越过下标圈后记录；比较“从上标圈计时”和“从释放计时”的差别。',
    question:{prompt:'用两条标线之间的距离L算速度时，应该采用哪段时间？',choices:[
      {label:'从球过上标线到过下标线',correct:true,feedback:'时间与距离必须对应同一区段。下一步换球径再测，检查所得黏度是否仍接近。'},
      {label:'从释放到过下标线',correct:false,feedback:'这段时间还包括液面到上标线的路程，若分子仍用L，就会低估速度、高估黏度。请切换错误计时模式验证。'},
      {label:'从释放到落到底部',correct:false,feedback:'总下落时间对应总路程，还可能包含加速和底部边界效应，不能配两线间的L。先让计时起止与距离端点一致。'}]},
    mount(host,{k,svgHit,bindHits,timeline}){
      const q=s=>host.querySelector(s),plan={x:-106,y:-62,w:212,d:124,r:7},G=drawing(k,plan,255),{P,at}=G;

      body+=G.ring(-5,0,17,207,'hi');

      const ca=P.azimuth*Math.PI/180;

      const announce=s=>{q('[data-fstatus]').textContent=s;};

      function reset(){halt();elapsed=0;recorded=false;phase='ready';model=fallModel(dmm,L);instruments.reset();clockOffset=PhysLabNoise.sample(0,.045);const b=at([-5,0,207]),r=dmm*1.85*k.cameraOf(P).k;q('[data-fball]').innerHTML=`<circle cx="${b[0]}" cy="${b[1]}" r="${r}" fill="var(--anatomy-paper)" stroke="currentColor" stroke-width="1.1"/><circle cx="${b[0]-r*.25}" cy="${b[1]-r*.28}" r="${r*.42}" fill="currentColor" opacity=".3"/>`;draw();announce('已复位。选球和计时区段后，再释放。');}

  });

  // Quasistatic teaching model: force grows as the meniscus turns vertical,
  // reaches 2σs at a 6 mm film span, ruptures beyond 6.8 mm. These geometric
  // thresholds are illustrative, not measured properties of this liquid.
  function pullModel(p,a,broken,sigma=.07275){
    const spring=2,s=.05,peak=2*sigma*s,peakStretch=peak/spring*1000;
    let extra=broken?0:peak*clamp((p+a)/(6+peakStretch),0,1);
    const stretch=extra/spring*1000,error=stretch-a,span=Math.max(0,p-error);

  registerBench('6',{

    question:{prompt:'金属丝自重已经扣除，拉脱前的附加拉力ΔF应如何换成σ？',choices:[
      {label:'σ＝ΔF/(2s)，液膜有两个面',correct:true,feedback:'两个面各拉σs。下一步比较破裂前和破裂后的附加伸长，说明为何必须读临界值。'},
      {label:'σ＝ΔF/s，一个金属丝只算一次',correct:false,feedback:'容易把“只有一根丝”误当成“只有一面膜”。拉起的液膜前后两面都在拉丝，各贡献σs。'},
      {label:'液膜破裂后弹簧稳定，等那时读',correct:false,feedback:'破裂后附加表面拉力已经消失。稳定不等于仍在测所需的力；请下降平台直到破裂，看附加力怎样归零。'}]},
    mount(host,{k,svgHit,bindHits,timeline}){
      const q=s=>host.querySelector(s),plan={x:-91,y:-65,w:182,d:130,r:7},G=drawing(k,plan,301),{P,at}=G;

      body+=G.box(-37,-34,60,7,237,7,'top-arm')+G.cyl(-33,-30,1.5,244,1,'arm-screw')+G.cyl(15,-30,1.5,244,1,'arm-end-screw');
      body+=G.box(-39,-29,60,6,145,5,'reference-arm')+G.box(18,-23,4,32,145,3,'reference-forward-arm');
      // Platform screw, guide columns and stage are separate mounted components.
      body+=G.box(-14,-22,58,53,0,4,'platform-lower-base','lo')+`<g data-pspindle>${G.cyl(15,4,3.3,4,47,'platform-spindle')}</g>`;
      for(const [x,y] of [[-8,-16],[38,-16],[-8,25],[38,25]])body+=G.cyl(x,y,2.1,4,47,'platform-guide-'+x+'-'+y);
      body+=G.knob(44,25,10,'platform-handwheel');
      let stage=G.box(-15,-23,60,56,51,5,'moving-platform','mid')+G.cyl(15,4,24,56,2,'beaker-bottom','hi');
      stage+=`<g opacity=".17">${G.cyl(15,4,24,58,45,'beaker-glass','hi')}</g><g opacity=".12">${G.cyl(15,4,22,58,34,'sample-water','hi')}</g>`+G.ring(15,4,24,103,'hi')+G.ring(15,4,22,92,'hi');
