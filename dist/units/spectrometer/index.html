<style id="physlab-bench-theme">
:root {
  color-scheme: light dark;
  --lab-page: light-dark(#f1f5f7, #111820);
  --lab-panel: light-dark(#fff, #18232d);

  --lab-ink: light-dark(#182832, #e7eef3);

  --lab-signal: light-dark(#17634c, #a9efce);

  --lab-signal-ink: light-dark(#fff, #132822);

  --lab-radius: 10px;
  --lab-key-radius: 7px;
  --bg: var(--lab-page);
  --paper: var(--lab-panel);
  --ink: var(--lab-ink);
  --muted: var(--lab-muted);
  --line: var(--lab-line);
  --accent: var(--lab-signal);
  --accent-soft: var(--lab-signal-soft);
  --accent-ink: var(--lab-signal-ink);
}

.iso:is(.rig-host, .cover-instrument) {
  --anatomy-card: var(--lab-stage);
  --anatomy-paper: var(--lab-stage);
  --anatomy-text: var(--lab-muted);
  --anatomy-strong: var(--lab-ink);
  --anatomy-muted: var(--lab-muted);
  --anatomy-face: light-dark(#d2e0e8, #314753);
  --anatomy-top: light-dark(#e0ebf1, #3a505d);
  --anatomy-shade-0: light-dark(#a2b6c3, #15212a);
  --anatomy-shade-1: light-dark(#b7c9d4, #1e2e3a);

  --anatomy-lit: light-dark(#153d3a, #effaff);
  --anatomy-lit-top: light-dark(#aad3c6, #3c5e63);
  --anatomy-lit-shade: light-dark(#8dbab2, #25454c);
  --anatomy-weight: .86px;
}

body { font-family: var(--lab-font); }
.unit-content { padding-block: clamp(16px, 2.8vw, 32px) 56px; }
.unit-content .hero { padding-bottom: 16px; }
.unit-content .lesson .hero h1 {
  font-size: clamp(1.65rem, 3vw, 2.5rem);
  margin: 4px 0 12px;
  font-weight: 650;
  letter-spacing: -.025em;
}
.unit-content .hero .kicker { margin: 0; }
.unit-content .hero .lead { margin: 0 0 8px; line-height: 1.65; }
.unit-content .hero .hint { margin: 0; }
.unit-content .parts { gap: 4px 16px; padding-block: 12px; }
.unit-content .parts a { color: var(--lab-muted); }
.unit-content .parts a:first-child, .unit-content .parts a:hover { color: var(--lab-signal); }
.unit-content .parts a:first-child { font-weight: 650; }
.unit-content .rig-lab { margin-top: 24px; }
.unit-content .rig-head { gap: 8px; margin-bottom: 12px; }
.unit-content .rig-head :is(h2, p) { line-height: 1.55; }
.unit-content .rig-instrument { border-radius: var(--lab-radius); }
.unit-content .rig-bar { padding: 12px clamp(12px, 2vw, 20px); }
.unit-content .rig-scene {
  background: var(--lab-stage);
  border-color: var(--lab-line);
  border-radius: var(--lab-key-radius);
}
.unit-content .rig-host { padding: clamp(9px, 2vw, 18px); }
.unit-content :is(button, select, input:not([type="range"]):not([type="radio"]):not([type="checkbox"])) {
  border-radius: var(--lab-key-radius);
  border-color: var(--lab-control-line);
}
.unit-content :is(button:hover:not(:disabled), button[aria-pressed="true"]) {
  border-color: var(--lab-signal);
}
.unit-content .rig-readout {
  border: 1px solid var(--lab-line);
  border-inline-start: 3px solid var(--lab-signal);
  border-radius: var(--lab-key-radius);
  padding: .48em .75em;
  background: var(--lab-stage);
  font-variant-numeric: tabular-nums;
}
.unit-content .rig-readout :is(strong, output) { color: var(--lab-signal); }
.unit-content :is(.rig-tools, .rig-choices) :is(button, select) { min-block-size: 40px; }
.unit-content .rig-choices button { line-height: 1.45; }
.unit-content :is(.sim, .formula, .equation) { border-color: var(--lab-line); }
.unit-content .sim { border-radius: var(--lab-radius); }
.unit-content .lesson-part { margin-block: 32px; }
.unit-content .part-head { margin-bottom: 4px; }

@media (max-width: 580px) {
  .unit-content .rig-bar { gap: 3px 12px; }
  .unit-content .rig-bar span { font-size: .83rem; }
  .unit-content :is(.rig-tools, .rig-choices) :is(button, select) { min-block-size: 44px; }
}

:root { background: var(--lab-page); }
body { color: var(--lab-ink); font-family: var(--lab-font); }
.learning-topbar { border-color: var(--lab-line); }
.learning-topbar a { color: var(--lab-signal); }
.learning-topbar a:focus-visible { outline-color: var(--lab-signal); }
.physlab-embedded .learning-topbar { display: none; }
.physlab-embedded #codex-visualization { min-height: 100vh; }

&lt;script&gt;
// Angles are degrees. Optical index is relative to surrounding air (n &gt;= 1).
const SpectrometerModel = (() =&gt; {
  const RAD=Math.PI/180, EPS=1e-12;
  const finite=x=&gt;typeof x===&#x27;number&#x27;&amp;&amp;Number.isFinite(x);
  const clamp=x=&gt;Math.max(-1,Math.min(1,x));
  const sin=x=&gt;Math.sin(x*RAD), asin=x=&gt;Math.asin(clamp(x))/RAD;
  const fail=(status,message,extra={})=&gt;({ok:false,status,message,...extra});
  function wrap360(angle){if(!finite(angle))throw new TypeError(&#x27;Angle must be finite degrees.&#x27;);return ((angle%360)+360)%360;}
  function signedDelta(to,from){return wrap360(to-from+180)-180;}
  function angleDifference(a,b){return Math.abs(signedDelta(a,b));}
  function readVernier(angle){
    const normalized=wrap360(angle),totalMinutes=Math.round(normalized*60+1e-10)%21600;
    const degree=Math.floor(totalMinutes/60),within=totalMinutes%60,half=within&gt;=30?1:0,minute=within%30;
    return {ok:true,degree,half,minute,index:minute,reading:totalMinutes/60,mainBase:degree+half*.5,totalMinutes,
      minutesWithinDegree:within,leastCount:1/60,mainDivision:.5,vernierDivision:29/60,
      errorMinutes:signedDelta(totalMinutes/60,normalized)*60,formatted:degree+&#x27;°&#x27;+String(within).padStart(2,&#x27;0&#x27;)+&#x27;′&#x27;};
  }
  function dualVernier(theta,{eccentricityMinutes=0,phase=0}={}){
    if(!finite(eccentricityMinutes)||!finite(phase))return fail(&#x27;invalid&#x27;,&#x27;偏心参数必须为有限数值。&#x27;);
    const angle=wrap360(theta),errorMinutes=eccentricityMinutes*sin(angle-phase);
    const raw1=wrap360(angle+errorMinutes/60),raw2=wrap360(angle+180-errorMinutes/60);
    return {ok:true,angle,raw1,raw2,errorMinutes,v1:readVernier(raw1),v2:readVernier(raw2)};
  }
  function dualAngles(value){return Array.isArray(value)?value:[value?.v1?.reading??value?.v1,value?.v2?.reading??value?.v2];}
  function differenceDual(before,after){
    const a=dualAngles(before),b=dualAngles(after);
    if(![...a,...b].every(finite))return fail(&#x27;invalid&#x27;,&#x27;需要两次观测的同侧游标读数。&#x27;);
    const d1=signedDelta(b[0],a[0]);
    // Near 180 degrees the two signed readings can straddle the branch cut.
    const d2=d1+signedDelta(signedDelta(b[1],a[1]),d1),delta=signedDelta((d1+d2)/2,0);
    return {ok:true,d1,d2,signed1:d1,signed2:d2,delta,average:delta,magnitude:Math.abs(delta),angle:Math.abs(delta)};
  }

const COURSE={&quot;title&quot;: &quot;实验20：分光计的调整与使用&quot;, &quot;scope&quot;: &quot;以用户提供的《分光计(1).pdf》10页扫描件为主。PDF第1页上部属于上一项LED实验，未纳入本课；本课起于该页下部实验20标题。解释性推导、模拟参数和标准原理扩展均与教材原文区分。&quot;, &quot;themes&quot;: [{&quot;key&quot;: &quot;instrument&quot;, &quot;title&quot;: &quot;先认清仪器：把光的方向变成角度&quot;, &quot;pages&quot;: &quot;PDF 1–4页｜原书174–177页&quot;, &quot;intro&quot;: &quot;分光计又称光学测角仪。它把光经过棱镜或光栅后的方向变化转成可读出的角度，从而求顶角、折射率、波长或光栅常量。仪器由底座、平行光管、望远镜、载物台和读数装置组成；望远镜、载物台与读数盘围绕同一主轴运动。先弄清谁与谁锁在一起，才能让转角对应真正要测的物理量。&quot;, &quot;details&quot;: [{&quot;title&quot;: &quot;一条测量链&quot;, &quot;text&quot;: &quot;光源照亮狭缝，平行光管把狭缝发出的光变成平行光束；中央试样改变传播方向；望远镜接收某一方向的平行光，在分划板处形成狭缝像；转动望远镜使竖直叉丝与像重合，刻度盘和两只游标给出角位置。中央物体可以换成双面平面镜、棱镜或光栅，不能把它们视为仪器永久固定的内部部件。&quot;}, {&quot;title&quot;: &quot;连接锁紧与转动制动有区别&quot;, &quot;text&quot;: &quot;7号把载物台与游标盘连接，15号把刻度盘与望远镜转座连接，测量时一般保持连接。16号制动望远镜转座；制动后用14号微调望远镜角度。23号制动游标盘；制动后用22号微调游标盘角度。先松开相应制动做大范围转动，再锁住并微调，不要在制动状态下强扭。&quot;}, {&quot;title&quot;: &quot;调节方向各有职责&quot;, &quot;text&quot;: &quot;12、25号分别调望远镜和平行光管俯仰；13、24号用于它们的水平调节。三只载物台调节螺钉改变台面倾斜，7号还涉及载物台高度固定。9号锁紧目镜管的轴向位置；11号使分划板清晰；26号调狭缝宽度。调焦、调角度、调宽度是不同动作，不能用一个旋钮补偿另一项未完成的调节。&quot;}, {&quot;title&quot;: &quot;粗调与收尾&quot;, &quot;text&quot;: &quot;先让两根光管大致水平且共轴、光轴经过主轴，三只载物台螺钉留有双向调节余量。台面标线与螺钉方位对齐后，通过游标盘带动台面转动，保持试样相对台面螺钉的方位。实验结束释放16、23号制动，并把微调螺钉回到适当中间位置。示意图不提供可据以认定的厂家型号或额定精度。&quot;}], &quot;questions&quot;: []}, {&quot;key&quot;: &quot;optics&quot;, &quot;title&quot;: &quot;阿贝自准直：让望远镜看清无限远&quot;, &quot;pages&quot;: &quot;PDF 3–5页｜原书176–178页&quot;, &quot;intro&quot;: &quot;自准直让望远镜自己发出测试光，再接收平面镜反射回来的光。目镜先把分划板看清，随后改变分划板相对物镜的位置，使发出的光平行、返回的绿色十字像清晰。教材的对准目标是上方横线与中央竖线的交点；中央水平线另有用途，不能混用。&quot;, &quot;details&quot;: [{&quot;title&quot;: &quot;三个光学角色&quot;, &quot;text&quot;: &quot;望远镜有物镜、分划板和目镜。目镜帮助眼睛看清分划板与像；物镜把来自无穷远方向的平行光聚焦在焦平面上。转动目镜调节手轮11，让固定叉丝清楚；这一步只解决眼睛看分划板的问题，尚未证明望远镜调焦于无穷远。&quot;}, {&quot;title&quot;: &quot;绿色十字为什么会回来&quot;, &quot;text&quot;: &quot;阿贝目镜内部有照明支路和45°全反射小棱镜，照亮分划板下方的绿色十字透光孔。该孔与上方目标十字关于中央水平线对称。孔位于物镜焦平面时，出射光平行；平面镜把光送回，物镜再成像。镜面法线与望远镜光轴一致时，返回绿十字与上方十字重合。&quot;}, {&quot;title&quot;: &quot;实际调焦顺序&quot;, &quot;text&quot;: &quot;把双面平面镜放在台面规定位置，固定望远镜，转游标盘使一个镜面朝向望远镜。打开照明、找到反射绿十字。若反射像模糊，松开9号锁紧螺钉，沿轴向移动目镜管，使反射像清晰，然后重新锁紧。不要靠转动已调好的目镜，把清晰分划板重新变模糊。&quot;}, {&quot;title&quot;: &quot;看不见像与看不清像&quot;, &quot;text&quot;: &quot;完全找不到绿十字，首先检查光源、粗调、镜面方向和高度；模糊的绿十字则主要提示焦面还未重合。两种问题不能都靠大幅拉动目镜管解决。观察时轻移眼睛，像与叉丝不发生相对移动是无视差的检验；这是检验像面与分划板面重合的解释性补充。&quot;}], &quot;questions&quot;: [{&quot;q&quot;: &quot;为什么要先调清分划板，再调反射像？&quot;, &quot;a&quot;: &quot;先确定眼睛通过目镜看到的分划板面，再让物镜所成的像落在同一平面。否则一次调节同时改变了两个判断基准，容易出现看似清晰却有视差的状态。&quot;}]}, {&quot;key&quot;: &quot;alignment&quot;, &quot;title&quot;: &quot;调半法：分开望远镜俯仰与镜面倾斜&quot;, &quot;pages&quot;: &quot;PDF 4–6页｜原书177–179页&quot;, &quot;intro&quot;: &quot;调半法的目标是让望远镜光轴垂直主轴。把双面镜转过180°，前后两个面的反射像都应落在上方目标十字。两次观察让望远镜自身的俯仰误差与镜面的倾斜误差呈现不同变化，从而可以交替消除。只把一个面的绿十字调到目标处，不能宣布调节完成。&quot;, &quot;details&quot;: [{&quot;title&quot;: &quot;镜子怎么放&quot;, &quot;text&quot;: &quot;按图20-4，将双面平面镜沿载物台a、b两螺钉连线的垂直平分线放置，保持镜子与螺钉的相对方位。之后转动游标盘，让游标盘、台面和镜子一起转动；不要在台面上随意转镜子。这个布局使a或b螺钉对镜面倾斜的作用明确。&quot;}, {&quot;title&quot;: &quot;教材的一轮调半&quot;, &quot;text&quot;: &quot;先用载物台a或b螺钉，把当前绿十字从A移到A与目标C的中点B；再调望远镜俯仰螺钉12，把绿十字从B移到C。随后把游标盘转180°，找到另一面的像，再按同样步骤调半。两面反复检验，直到两面都与上方目标十字重合。完成后不再动望远镜俯仰螺钉。&quot;}, {&quot;title&quot;: &quot;为何要看两个面&quot;, &quot;text&quot;: &quot;在小角度线性近似下，可把两面像的竖直偏移写成h₁=c+m、h₂=c−m：共同部分c反映望远镜光轴误差，差异部分m反映镜面倾斜。调台面主要改变差异，调望远镜俯仰主要改变共同偏移。因此也可以先让两面像等高，再把共同高度调到目标。这个分解用于理解，像位移与螺钉旋转量不是同一个角度。&quot;}, {&quot;title&quot;: &quot;不能只凭上下位置判断&quot;, &quot;text&quot;: &quot;只有镜面倾斜时，两面像位于目标两侧；只有望远镜俯仰误差时，两面像同高偏离目标。两种误差同时存在时，可能分居两侧，也可能都在同侧，取决于共同偏移与差异的大小。教材示意的“一上一下”是一种情形，不是所有混合误差的必要特征。&quot;}, {&quot;title&quot;: &quot;这一步还没有完成台面的全部调平&quot;, &quot;text&quot;: &quot;两面镜像都对准，保证的是望远镜光轴垂直主轴，并使镜面平行于主轴；台面仍可能沿另一方向倾斜。之后要利用棱镜两个不平行光学面继续调台面，不能直接把双面镜检验等同于载物台已完全垂直主轴。&quot;}], &quot;questions&quot;: [{&quot;q&quot;: &quot;教材预习题：双面平面镜应怎样放置，这样放有什么好处？&quot;, &quot;a&quot;: &quot;按图20-4，沿台面a、b两调节螺钉连线的垂直平分线放置，保持镜面与螺钉方位关系；转动时由游标盘带动镜子与台面共同转动，便于用a、b螺钉完成有明确方向的调半。&quot;}, {&quot;q&quot;: &quot;教材实验中思考题：双面镜两面的像都与上十字重合，能否说明台面已垂直主轴？&quot;, &quot;a&quot;: &quot;不能。它检验了望远镜光轴与主轴垂直，以及该镜面方向的倾斜。台面另一方向仍可能倾斜，需要棱镜两个不平行面的自准直检验。&quot;}, {&quot;q&quot;: &quot;教材报告题：两面反射像分别在目标上方3a和下方a，怎样调？&quot;, &quot;a&quot;: &quot;取向上为正，两像为3a与−a，平均值是a、半差是2a。先调台面，使较高的像下降2a，另一面的像相应上升2a，两面都在目标上方a；再调望远镜俯仰，使共同偏移下降a。随后翻转复核。这是小偏差下的像位移关系，并不表示螺钉应旋转2a或a。&quot;}]}, {&quot;key&quot;: &quot;collimator&quot;, &quot;title&quot;: &quot;平行光管：狭缝在焦面，光束才平行&quot;, &quot;pages&quot;: &quot;PDF 2、6–7页｜原书175、179–180页&quot;, &quot;intro&quot;: &quot;望远镜完成无限远调焦与轴线调节后，才用它检验平行光管。平行光管的狭缝必须位于透镜焦平面，才能让每个狭缝点发出的光形成平行光束。随后调平行光管俯仰，最后把狭缝恢复竖直。这个次序使每一步都有已经固定的参照。&quot;, &quot;details&quot;: [{&quot;title&quot;: &quot;轴向移动狭缝管&quot;, &quot;text&quot;: &quot;移开双面镜，用光源照亮狭缝，使望远镜正对平行光管。保持望远镜的目镜、无限远焦距和俯仰不变，松开狭缝装置锁紧螺钉2，沿光轴移动狭缝管，直到狭缝像清晰并与分划板没有视差。然后锁住轴向位置。这意味着物镜接收的是由狭缝发出的平行光。&quot;}, {&quot;title&quot;: &quot;为什么暂时转成水平狭缝&quot;, &quot;text&quot;: &quot;将狭缝暂时转为水平，通过25号俯仰螺钉使水平狭缝像与分划板中央水平线重合，从而让平行光管光轴也垂直主轴。这里的参照是中央水平线；自准直时反射绿十字的参照是上方十字，两者不要混淆。完成后把狭缝恢复竖直并锁紧。&quot;}, {&quot;title&quot;: &quot;宽度影响观察质量&quot;, &quot;text&quot;: &quot;26号手轮调狭缝宽度。较窄的像有利于精确瞄准和区分相邻谱线，但亮度会下降；过宽时像边界模糊、谱线重叠。教材最小偏向角操作给出的狭缝宽度约1 mm是起始参考，并非所有仪器的最佳精密测量宽度。应在亮度足够时选清楚、可重复瞄准的宽度。&quot;}, {&quot;title&quot;: &quot;调焦不是补偿轴线错误&quot;, &quot;text&quot;: &quot;狭缝像清晰而偏离中央水平线，优先检查俯仰；像在中央却模糊，检查狭缝轴向位置。不能重新调望远镜焦距去追随尚未准直的平行光管，否则此前的无限远参照会丢失。最终应同时满足像清晰、无视差、轴线合适以及狭缝竖直。&quot;}], &quot;questions&quot;: [{&quot;q&quot;: &quot;教材预习题：望远镜和平行光管各有哪些要求，怎样判断？&quot;, &quot;a&quot;: &quot;望远镜先使分划板清晰，再用清晰自准直像调焦于无穷远；双面镜翻转180°后两面像都与上十字重合，检验光轴垂直主轴。保持它不变，使平行光管狭缝像清晰且无视差，检验平行出射；暂时水平放置的狭缝像与中央水平线重合，检验平行光管轴线方向，最后恢复竖直狭缝。&quot;}]}, {&quot;key&quot;: &quot;vernier&quot;, &quot;title&quot;: &quot;游标读数：半度主尺与1′细分&quot;, &quot;pages&quot;: &quot;PDF 3–4页｜原书176–177页&quot;, &quot;intro&quot;: &quot;主刻度盘一周有720格，每格0.5°，也就是30′。游标补出主尺整格以外的角分。先看游标零线经过了主尺的哪一格，再找哪条游标线与主尺线对齐。读数必须把半度部分算进去；不能只抄主尺上的整数度数。&quot;, &quot;details&quot;: [{&quot;title&quot;: &quot;按两步读&quot;, &quot;text&quot;: &quot;第一步，沿刻度增加方向找到游标零线之前的主尺刻度，读出整数度或整数度加30′。第二步，找与主尺刻线最重合的游标刻线，读出它对应的角分，再与第一步相加。例如零线已越过115°30′、第14条游标线对齐，模拟读数为115°44′，而不是115°14′。&quot;}, {&quot;title&quot;: &quot;1′从何而来&quot;, &quot;text&quot;: &quot;教材图示游标有0至30的细分。标准直接游标可让30个游标间隔等于29个主尺间隔：一个游标间隔为29′，比主尺30′少1′，第k条重合就表示多出k′。这段是对标准游标结构的推导说明，教材文字本身主要给出读法和示例。1′是最小读数分度，不应直接当成整次实验的测量不确定度。&quot;}, {&quot;title&quot;: &quot;教材图与实际照片分开&quot;, &quot;text&quot;: &quot;图20-5正文给出的读数是115°14′，可用于核对教材示例。用户实物照片若不能可靠看清零线、刻度方向和重合线，就不能据此编造一个精确读数。交互练习中的读数来自明确设定的模拟刻度，必须标明是练习数据。&quot;}, {&quot;title&quot;: &quot;度分与跨零&quot;, &quot;text&quot;: &quot;1°=60′，不是100′。将读数化成角分或十进制度运算，最后再转回度分。跨0°的两次读数应按实际转动方向展开，例如359°50′到0°20′的小转角为30′。不要直接把绝对数值相减，误得到359°30′。&quot;}], &quot;questions&quot;: [{&quot;q&quot;: &quot;游标零线在115°与115°30′之间，第14条线重合，读多少？&quot;, &quot;a&quot;: &quot;115°14′。如果零线在115°30′与116°之间，同样第14条线重合，则是115°44′。关键是主尺半度格是否已经越过。&quot;}]}, {&quot;key&quot;: &quot;dual&quot;, &quot;title&quot;: &quot;双游标：先各算转角，再平均&quot;, &quot;pages&quot;: &quot;PDF 3–4、9–10页｜原书176–177、182–183页&quot;, &quot;intro&quot;: &quot;读数圆盘有两只相隔180°的游标。刻度盘中心与转轴略有偏离时，同一转角在两侧的读数误差方向相反，因此两侧结果平均能减小偏心误差。两只游标都要在转动前后读取，始终保留自己的编号。&quot;, &quot;details&quot;: [{&quot;title&quot;: &quot;四个原始读数不能省&quot;, &quot;text&quot;: &quot;在位置I读游标1、2，记θ₁、θ₂；在位置II仍读原来的游标1、2，记θ′₁、θ′₂。分别求Δ₁、Δ₂，再取转角Δ=(Δ₁+Δ₂)/2。若目标量只需要转角大小，可在完成方向一致的跨零处理后取相应正值。不能交换游标编号，也不能把相差约180°的两个绝对读数直接平均当成转角。&quot;}, {&quot;title&quot;: &quot;消除的误差有边界&quot;, &quot;text&quot;: &quot;对置游标平均主要抵消偏心造成的一阶误差。它不能消除狭缝太宽、视差、未对准谱线、未找到最小偏向位置、主轴倾斜、刻线误差和误读。两只游标的转角若明显不一致，应该检查读数、跨零与对准过程，而非只保留平均后的漂亮结果。&quot;}, {&quot;title&quot;: &quot;一个明确的练习例&quot;, &quot;text&quot;: &quot;模拟记录：位置I为350°10′、170°12′，位置II为20°20′、200°18′。同向跨零后，游标1给30°10′，游标2给30°06′，平均30°08′。这些数值仅用于计算演示，不是教材或用户实物照片中的测量数据。&quot;}, {&quot;title&quot;: &quot;可逆的记录方式&quot;, &quot;text&quot;: &quot;记录表保留原始度分读数、观察位置、谱线颜色、转动对象与方向，再另列展开后的角差和平均值。不要只抄最终平均角度；保留原始读数才能发现跨零、游标编号或抄写错误，也能在后续计算中重新核对。&quot;}], &quot;questions&quot;: [{&quot;q&quot;: &quot;为什么不能只读一只游标，再给结果附上1′误差？&quot;, &quot;a&quot;: &quot;另一只游标提供了减小偏心误差所需的独立几何信息。1′仅是读数分度，既不能代替第二只游标，也不能概括对准、重复性和仪器系统误差。&quot;}]}, {&quot;key&quot;: &quot;apex&quot;, &quot;title&quot;: &quot;棱镜顶角：教材采用自准直的补角法&quot;, &quot;pages&quot;: &quot;PDF 8–9页｜原书181–182页&quot;, &quot;intro&quot;: &quot;教材先用棱镜两个光学面的反射继续调平台面，再固定望远镜和刻度盘，转动载物台与游标盘，使两面先后正对望远镜。两次面的法线方向之间转角为Φ，棱镜顶角A=180°−Φ。这个实验中常见60°顶角对应约120°的台面转角。&quot;, &quot;details&quot;: [{&quot;title&quot;: &quot;棱镜放置与台面细调&quot;, &quot;text&quot;: &quot;把棱镜A、B、C三个顶点分别放在三只载物台调节螺钉的上方，先让第三只螺钉高度与另两只大致相当。打开阿贝照明并遮住狭缝光。观察AB面的反射，若绿十字未落在上方目标处，仅调C处螺钉；观察AC面时，仅调B处螺钉。反复检验两面，完成后保持望远镜俯仰不变。&quot;}, {&quot;title&quot;: &quot;先让两面都满足几何条件&quot;, &quot;text&quot;: &quot;两面反射像都与上十字重合，说明两个光学面都平行于主轴，棱边也平行于主轴，主截面垂直主轴。它补上了双面镜调节未约束的台面倾斜分量。玻璃面的绿十字反射可能较弱，适当遮光、先找反射再小幅调节，比大幅旋螺钉更可靠。&quot;}, {&quot;title&quot;: &quot;测量顺序&quot;, &quot;text&quot;: &quot;保持棱镜相对台面的位置不变，固定15、16号，使望远镜与刻度盘不转。转游标盘，让AC面反射绿十字对准上十字，锁定后读两个游标；再转游标盘，让AB面也自准直对准，再读两个游标。用同编号游标的角差求Φ=(Δ₁+Δ₂)/2，最后A=180°−Φ。跨0°时先按实际转动展开读数。&quot;}, {&quot;title&quot;: &quot;为什么是补角&quot;, &quot;text&quot;: &quot;这两次位置比较的是棱镜相邻两个面相应法线的方向。所选转动路径的法线夹角为180°−A，因此由台面转角求顶角需要取补角。教材“三棱镜位置要保持不动”应理解为棱镜不在台面上滑移或换放；测量本身仍要转动载物台和游标盘。&quot;}, {&quot;title&quot;: &quot;与2A反射法的界限&quot;, &quot;text&quot;: &quot;另有一种标准拓展：台面固定，让同一准直入射光分别被两面反射，转望远镜测量两支反射光的夹角，可按相应几何取2A来求顶角。它的照明方式、转动对象和角度关系与本教材自准直法不同。若展示该拓展，必须独立标明；不能把教材A=180°−Φ改写成A=Φ/2。&quot;}], &quot;questions&quot;: [{&quot;q&quot;: &quot;教材预习题：棱镜应怎样放置，这样放有什么好处？&quot;, &quot;a&quot;: &quot;三个顶点对着台面三只调节螺钉；检验AB面时调对面C处螺钉，检验AC面时调B处螺钉。利用两个不平行面的自准直反射，使两面的像都落在上十字。顶点对应螺钉，便于按观察面选择相应的调节，不必盲目联动。&quot;}, {&quot;q&quot;: &quot;教材实验中思考题：两面都与上十字重合说明什么？为什么换位置放棱镜后还要重调？&quot;, &quot;a&quot;: &quot;说明两光学面平行主轴、棱边平行主轴，主截面垂直主轴。真实棱镜底面与棱边可能不完全垂直，台面及接触也不理想；原先的台面倾斜补偿对应原放置方位。拿起换放后该补偿未必仍适用，所以要重新检验，必要时调节。&quot;}]}, {&quot;key&quot;: &quot;minimum&quot;, &quot;title&quot;: &quot;最小偏向角：在谱线折返处测折射率&quot;, &quot;pages&quot;: &quot;PDF 7、9–10页｜原书180、182–183页&quot;, &quot;intro&quot;: &quot;转动棱镜会改变入射角，出射谱线的方向随之改变。当谱线移动到一个极限后开始折返，其偏向角达到最小。此时光路关于棱镜的角平分线对称，入射角等于出射角，棱镜内两次折射角都等于A/2。测出顶角A与最小偏向角δmin，就能求该波长的折射率。&quot;, &quot;details&quot;: [{&quot;title&quot;: &quot;几何关系与公式&quot;, &quot;text&quot;: &quot;设外部入射角i、出射角e，内部折射角r₁、r₂，则r₁+r₂=A、δ=i+e−A。最小偏向时i=e、r₁=r₂=A/2，因此i=(A+δmin)/2。在空气中用折射定律得n=sin[(A+δmin)/2]/sin(A/2)。更严格地说，该式给出棱镜相对周围介质的折射率；普通实验近似空气折射率为1。&quot;}, {&quot;title&quot;: &quot;先寻找，再精确瞄准&quot;, &quot;text&quot;: &quot;用汞灯照亮狭缝，教材起始狭缝宽约1 mm。松开望远镜和游标盘的相应制动，转动棱镜并用望远镜跟随选定谱线；让谱线朝偏向角减小的方向移动，接近折返处时缓慢往返检验。教材选546.1 nm绿线。找到最小时固定游标盘23，再固定望远镜转座16并用14号微调，使中央竖线与绿线重合。&quot;}, {&quot;title&quot;: &quot;直射方向是角度基准&quot;, &quot;text&quot;: &quot;记录最小偏向位置的两只游标读数。保持台面状态，移去棱镜，把望远镜转向平行光管直接看到狭缝，再瞄准并读两只游标。各自计算偏向位置与直射位置的角差，处理跨零后取平均，得到δmin。不要把游标的某个绝对读数直接代入折射率公式。&quot;}, {&quot;title&quot;: &quot;最低点为何较稳定&quot;, &quot;text&quot;: &quot;最小值附近δ对入射角i的一阶变化率为零，微小的棱镜角度变化只引起较小的二阶偏向变化。这能减小入射设置误差的影响，但仍要通过来回观察确认真正的折返区；只有一段移动很慢的谱线，不足以证明已找到最小值。谱线宽度、瞄准和读数误差仍然存在。&quot;}, {&quot;title&quot;: &quot;不确定度的教学补充&quot;, &quot;text&quot;: &quot;教材要求计算n及其不确定度。对相互独立的A、δ测量，可用u(n)²=[∂n/∂A·u(A)]²+[∂n/∂δ·u(δ)]²，其中∂n/∂A=−sin(δ/2)/[2sin²(A/2)]，∂n/∂δ=cos[(A+δ)/2]/[2sin(A/2)]。这里角度不确定度必须换成弧度；若两量相关，还需协方差项。模拟器给出的理论值不能当成实验重复性数据。&quot;}], &quot;questions&quot;: [{&quot;q&quot;: &quot;教材实验中思考题：最小偏向附近δ对入射角变化不敏感，会降低精度吗？&quot;, &quot;a&quot;: &quot;这种驻值性质通常有利于减小入射角设置误差：小的入射角偏差不会带来一阶的δ变化。寻找精确转折位置可能显得平缓，仍应从两侧来回逼近；测量精度主要还受谱线瞄准、读数、顶角测量及装置调节等影响，不能把“移动慢”解释为必然测不准。&quot;}]}, {&quot;key&quot;: &quot;dispersion&quot;, &quot;title&quot;: &quot;色散：同一块棱镜有一条n(λ)曲线&quot;, &quot;pages&quot;: &quot;PDF 7–8、10页｜原书180–181、183页&quot;, &quot;intro&quot;: &quot;透明材料在可见光正常色散区通常对短波长光有较大的折射率，因此紫光的偏向大于红光。测量不同谱线各自的最小偏向角，就得到折射率随波长的关系。一次绿线测量只能给出绿光的折射率，不能代表所有颜色。&quot;, &quot;details&quot;: [{&quot;title&quot;: &quot;教材给出的谱线&quot;, &quot;text&quot;: &quot;提高性实验列出汞灯435.8 nm紫线、546.1 nm绿线，以及577.0 nm与579.0 nm两条黄线；还可选钠灯或氢灯的谱线。每条谱线应单独寻找自己的最小偏向位置，再与直射方向比较，不能固定在绿线的最小位置上，把其他颜色的方向差直接当作它们的最小偏向角。&quot;}, {&quot;title&quot;: &quot;柯西公式&quot;, &quot;text&quot;: &quot;教材用n(λ)=a+b/λ²+c/λ⁴描述材料在适用透明波段的色散。已知三组波长与折射率，可把x=1/λ²写入n=a+bx+cx²，解出三个材料系数；多于三组数据时可以作拟合，这是对教材步骤的延伸。它是有适用波段的经验公式，不能任意外推到吸收强的频段。&quot;}, {&quot;title&quot;: &quot;单位必须统一&quot;, &quot;text&quot;: &quot;所有波长计算时采用同一个单位。若λ用μm，b与c相应带μm²与μm⁴；若改用nm，系数数值随之改变。折射率n本身无量纲，a也无量纲。把nm数据与用μm得到的系数混用，会产生非常大的错误。&quot;}, {&quot;title&quot;: &quot;从数据到图&quot;, &quot;text&quot;: &quot;横轴取λ、纵轴取n，标出每条已识别谱线得到的测量点，再绘制柯西曲线；也可比较各色最小偏向角。两条黄线很近，分辨能力不足时不要虚构两个独立读数。离散线光谱、较宽的发光带和连续光谱应分别描述。教材建议比较汞灯、钠灯、手机照明或屏幕等光源，不能预先把每种实际设备的谱形当成完全固定。&quot;}], &quot;questions&quot;: [{&quot;q&quot;: &quot;为什么不能用同一个棱镜方位同时测所有颜色的δmin？&quot;, &quot;a&quot;: &quot;各颜色的n不同，对应的对称光路入射角也不同。某一颜色到达最小偏向时，其他颜色一般还未处于自己的最小值；需逐条跟踪并确认折返。&quot;}]}, {&quot;key&quot;: &quot;grating&quot;, &quot;title&quot;: &quot;光栅扩展：由衍射角反求刻线间距&quot;, &quot;pages&quot;: &quot;PDF 10页｜原书183页（公式与操作为明确标注的原理扩展）&quot;, &quot;intro&quot;: &quot;教材高阶实验提出：利用已知波长的汞绿光546.1 nm测量衍射角，求光栅常量，并进一步比较不同光源的光谱。该页没有展开光栅方程、给定刻线密度或具体级次。以下使用正入射、理想平面透射光栅的标准模型，作为理解这一任务的补充。&quot;, &quot;details&quot;: [{&quot;title&quot;: &quot;正入射方程&quot;, &quot;text&quot;: &quot;相邻刻线间距为d，光垂直光栅入射，m级明纹相对零级方向的角度为θm，则d sinθm=mλ。已知λ和级次m，测出θm即可求d=|m|λ/sin|θm|；再由每毫米刻线数N=1/d求密度，此时d应使用mm。零级m=0不能单独反推出d。&quot;}, {&quot;title&quot;: &quot;正入射是使用条件&quot;, &quot;text&quot;: &quot;开始前应完成望远镜、平行光管和台面的调节，并使光栅面垂直入射光、刻线方向合适。斜入射时，入射角也进入相邻光程差，不能继续套用正入射简式；具体符号取决于角度正方向的约定。图中若使用简式，应把正入射明确标为模型前提。&quot;}, {&quot;title&quot;: &quot;左右同级测量&quot;, &quot;text&quot;: &quot;正入射时，同一波长的+m与−m级关于零级对称，两侧方向夹角的一半就是|θm|。每个方向仍需读取两只游标并正确处理跨零。先找零级，再确认左右相同级次，不能把不同颜色或不同级次混配。对于不对称的实际观察，应先检查入射条件和级次识别。&quot;}, {&quot;title&quot;: &quot;可出现的级次有限&quot;, &quot;text&quot;: &quot;真实传播方向必须满足|mλ/d|≤1。超过这一范围的级次不存在，交互图应提示无该级衍射，而不是把反正弦输入强行截到1后画出虚假谱线。刻线密度增加使d变小，同一可见级次的衍射角一般增大，但可传播的最高级次也受到限制。&quot;}, {&quot;title&quot;: &quot;与棱镜色散比较&quot;, &quot;text&quot;: &quot;正入射光栅的同一非零级次中，较长波长对应较大的|θm|；可见光正常色散棱镜通常是较短波长偏向更大。两者角度排序的机制不同。模拟光栅的d、级次或谱线位置如未取自实测，应明确标注为练习设定。教材没有掠入射法，也没有给出本仪器的具体光栅刻线密度。&quot;}], &quot;questions&quot;: [{&quot;q&quot;: &quot;把左右一级夹角除以2后直接代入光栅方程，总是正确吗？&quot;, &quot;a&quot;: &quot;需要正入射、左右同一波长且同级、级次辨认正确等条件。斜入射时两边通常不再对称，不能用半夹角代替简式中的衍射角。&quot;}]}, {&quot;key&quot;: &quot;records&quot;, &quot;title&quot;: &quot;实验记录：保留原始读数与调节证据&quot;, &quot;pages&quot;: &quot;PDF 2、8–10页｜原书175、181–183页&quot;, &quot;intro&quot;: &quot;教材实验从仪器调节开始，依次测顶角、测绿线最小偏向角和折射率，再扩展到色散与光栅。记录应能回答三个问题：仪器怎样调到合适状态、每个角由哪些原始读数得到、由这些角怎样算出物理量。交互练习的理论数据可帮助核算，不能代替真实实验记录。&quot;, &quot;details&quot;: [{&quot;title&quot;: &quot;完整操作次序&quot;, &quot;text&quot;: &quot;粗调轴线与台面→调清分划板→阿贝自准直调焦于无穷远→双面镜调半，使望远镜光轴垂直主轴→固定望远镜状态并调平行光管焦距、俯仰和竖直狭缝→用棱镜两面完成台面细调→自准直法测顶角→测绿线最小偏向及直射方向→求n与不确定度→逐谱线测色散或换光栅做高阶实验。&quot;}, {&quot;title&quot;: &quot;顶角记录表应有什么&quot;, &quot;text&quot;: &quot;每次保留棱镜AC面与AB面两种自准直位置、两只游标的四个原始读数、各游标处理跨零后的转角Δ₁与Δ₂、平均转角Φ，以及A=180°−Φ。注明转动的是游标盘和台面，望远镜与刻度盘保持固定。重复次数按实际实验要求与完成情况填写，不编造重复测量。&quot;}, {&quot;title&quot;: &quot;折射率与色散记录表应有什么&quot;, &quot;text&quot;: &quot;每条谱线记录光源、颜色、已知波长、最小偏向方向的双游标读数、直射方向的双游标读数、两个角差、δmin、使用的A及算出的n。若拟合柯西公式，还应标明波长单位、所用数据点、系数和适用范围。精度报告区分读数分度、重复性和不确定度。&quot;}, {&quot;title&quot;: &quot;光栅记录表应有什么&quot;, &quot;text&quot;: &quot;注明正入射检验、已知波长、所用级次m、左右同级方向的双游标原始读数及零级方向。计算同级角距、θ、d和刻线密度，说明角度正方向。实际未观察到某级时记为未见或不满足传播条件，不填入模拟器的理论角当作实测值。&quot;}, {&quot;title&quot;: &quot;原文与教学补充的边界&quot;, &quot;text&quot;: &quot;本课全部页码对应所给10页扫描件；第1页上部LED内容不属于本实验。教材核心顶角法是A=180°−Φ，2A反射法仅作独立拓展；掠入射法没有出现在本PDF。光栅正入射方程、不确定度偏导数与误差共同/差异分解属于帮助理解的推导补充。所有模拟数值均应显式标注。&quot;}], &quot;questions&quot;: [{&quot;q&quot;: &quot;有了计算器显示的很多小数位，是否就能提高实验精度？&quot;, &quot;a&quot;: &quot;不能。计算位数只避免中间舍入损失；最终有效位数取决于角度读数、对准、重复性和不确定度。原始游标分度为1′时，不能把计算器输出的长小数误当作仪器真实分辨率。&quot;}]}], &quot;parts&quot;: {&quot;telescope&quot;: {&quot;title&quot;: &quot;望远镜&quot;, &quot;text&quot;: &quot;接收某一方向的平行光，把狭缝或谱线像与分划板比较。先调焦于无穷远，再调光轴垂直主轴；测量时转动它来瞄准光线方向。&quot;, &quot;pages&quot;: &quot;PDF 2–6页｜原书175–179页&quot;, &quot;numbers&quot;: [8, 12, 13, 14, 16]}, &quot;collimator&quot;: {&quot;title&quot;: &quot;平行光管&quot;, &quot;text&quot;: &quot;把位于透镜焦平面的狭缝变成平行光源。调节狭缝轴向位置使像清晰无视差，再调光管俯仰；望远镜已经调好的焦距保持不变。&quot;, &quot;pages&quot;: &quot;PDF 2、6–7页｜原书175、179–180页&quot;, &quot;numbers&quot;: [3, 24, 25]}, &quot;slit&quot;: {&quot;title&quot;: &quot;狭缝装置&quot;, &quot;text&quot;: &quot;宽度决定像的宽窄与亮度。测量时通常竖直；调平行光管俯仰时先临时转为水平，使像与中央水平线重合，再恢复竖直。&quot;, &quot;pages&quot;: &quot;PDF 2、7、9页｜原书175、180、182页&quot;, &quot;numbers&quot;: [1, 2, 26]}, &quot;table&quot;: {&quot;title&quot;: &quot;载物台与三只调节螺钉&quot;, &quot;text&quot;: &quot;承放双面镜、棱镜或光栅。三螺钉控制倾斜；试样方位应对应螺钉。双面镜完成的检验还不等于台面已在两个方向完全调平。&quot;, &quot;pages&quot;: &quot;PDF 3–6、8–9页｜原书176–179、181–182页&quot;, &quot;numbers&quot;: [5, 6, 7]}, &quot;prism&quot;: {&quot;title&quot;: &quot;三棱镜（可换试样）&quot;, &quot;text&quot;: &quot;两个光学面用于自准直测顶角，透射光用于最小偏向角和色散实验。拿起重新放置后需复核姿态；它不属于五大固定总成。&quot;, &quot;pages&quot;: &quot;PDF 7–10页｜原书180–183页&quot;, &quot;numbers&quot;: []}, &quot;circle&quot;: {&quot;title&quot;: &quot;刻度盘&quot;, &quot;text&quot;: &quot;全周720格，每格0.5°=30′。测量时通过15号与望远镜转座连接；必须结合游标和转动对象理解读数的变化。&quot;, &quot;pages&quot;: &quot;PDF 3–4页｜原书176–177页&quot;, &quot;numbers&quot;: [15, 19, 20]}, &quot;vernier&quot;: {&quot;title&quot;: &quot;游标盘与双游标&quot;, &quot;text&quot;: &quot;两只游标相隔180°，细分到1′。同一游标前后读数求角差，再把两侧角差平均，以减小偏心影响。&quot;, &quot;pages&quot;: &quot;PDF 3–4页｜原书176–177页&quot;, &quot;numbers&quot;: [21, 22, 23]}, &quot;clamp&quot;: {&quot;title&quot;: &quot;制动与微调&quot;, &quot;text&quot;: &quot;16锁住望远镜转座后用14微调；23锁住游标盘后用22微调。7和15负责连接部件，功能不同。粗转前释放相应制动。&quot;, &quot;pages&quot;: &quot;PDF 2、4页｜原书175、177页&quot;, &quot;numbers&quot;: [4, 7, 14, 15, 16, 17, 22, 23]}, &quot;focus&quot;: {&quot;title&quot;: &quot;阿贝目镜与调焦&quot;, &quot;text&quot;: &quot;先用11调清分划板，再松9轴向移动目镜管调清自准直反射像。绿十字照明与反射形成自检光路，正确目标是上方十字。&quot;, &quot;pages&quot;: &quot;PDF 3–5页｜原书176–178页&quot;, &quot;numbers&quot;: [9, 10, 11]}, &quot;feet&quot;: {&quot;title&quot;: &quot;底座与主轴&quot;, &quot;text&quot;: &quot;底座支撑共用的回转主轴。镜筒、台面和读数装置围绕它运动；光轴应垂直主轴。实物的支脚细节依照片绘制，不据此推断教材未给出的型号。&quot;, &quot;pages&quot;: &quot;PDF 2、4页｜原书175、177页&quot;, &quot;numbers&quot;: [18]}}, &quot;parts26&quot;: [{&quot;number&quot;: 1, &quot;name&quot;: &quot;狭缝装置&quot;, &quot;function&quot;: &quot;提供可调狭缝，能沿轴向移动并改变狭缝方向。&quot;}, {&quot;number&quot;: 2, &quot;name&quot;: &quot;狭缝装置锁紧螺钉&quot;, &quot;function&quot;: &quot;调好狭缝位置与方向后锁紧。&quot;}, {&quot;number&quot;: 3, &quot;name&quot;: &quot;平行光管&quot;, &quot;function&quot;: &quot;狭缝位于焦面时输出平行光。&quot;}, {&quot;number&quot;: 4, &quot;name&quot;: &quot;制动架（1）&quot;, &quot;function&quot;: &quot;与相应制动、调节机构组成机械支撑。&quot;}, {&quot;number&quot;: 5, &quot;name&quot;: &quot;载物台&quot;, &quot;function&quot;: &quot;放置并随游标盘转动光学试样。&quot;}, {&quot;number&quot;: 6, &quot;name&quot;: &quot;载物台调节螺钉&quot;, &quot;function&quot;: &quot;三只螺钉调节台面倾斜。&quot;}, {&quot;number&quot;: 7, &quot;name&quot;: &quot;载物台锁紧螺钉&quot;, &quot;function&quot;: &quot;固定载物台高度并连接载物台与游标盘。&quot;}, {&quot;number&quot;: 8, &quot;name&quot;: &quot;望远镜&quot;, &quot;function&quot;: &quot;观察与瞄准某方向的平行光。&quot;}, {&quot;number&quot;: 9, &quot;name&quot;: &quot;目镜锁紧螺钉&quot;, &quot;function&quot;: &quot;锁住目镜管轴向调焦位置。&quot;}, {&quot;number&quot;: 10, &quot;name&quot;: &quot;阿贝式自准直目镜&quot;, &quot;function&quot;: &quot;提供分划板观察与照明自准直光路。&quot;}, {&quot;number&quot;: 11, &quot;name&quot;: &quot;目镜调节手轮&quot;, &quot;function&quot;: &quot;调节目镜使分划板清晰。&quot;}, {&quot;number&quot;: 12, &quot;name&quot;: &quot;望远镜俯仰调节螺钉&quot;, &quot;function&quot;: &quot;调整望远镜光轴相对主轴的俯仰。&quot;}, {&quot;number&quot;: 13, &quot;name&quot;: &quot;望远镜水平调节螺钉&quot;, &quot;function&quot;: &quot;粗调望远镜光轴在水平方向的位置。&quot;}, {&quot;number&quot;: 14, &quot;name&quot;: &quot;望远镜微调螺钉&quot;, &quot;function&quot;: &quot;望远镜转座制动后精细调整其方位角。&quot;}, {&quot;number&quot;: 15, &quot;name&quot;: &quot;转座与刻度盘制动螺钉&quot;, &quot;function&quot;: &quot;把望远镜转座与刻度盘连接固定。&quot;}, {&quot;number&quot;: 16, &quot;name&quot;: &quot;望远镜制动螺钉（背面）&quot;, &quot;function&quot;: &quot;限制望远镜转座自由转动，配合14号微调。&quot;}, {&quot;number&quot;: 17, &quot;name&quot;: &quot;制动架（2）&quot;, &quot;function&quot;: &quot;与相应制动、调节机构组成机械支撑。&quot;}, {&quot;number&quot;: 18, &quot;name&quot;: &quot;底座&quot;, &quot;function&quot;: &quot;支撑整机与中央主轴。&quot;}, {&quot;number&quot;: 19, &quot;name&quot;: &quot;转座&quot;, &quot;function&quot;: &quot;承载望远镜并绕主轴回转。&quot;}, {&quot;number&quot;: 20, &quot;name&quot;: &quot;刻度盘&quot;, &quot;function&quot;: &quot;全周720格，每格半度。&quot;}, {&quot;number&quot;: 21, &quot;name&quot;: &quot;游标盘&quot;, &quot;function&quot;: &quot;携带对置游标，并可与载物台一起旋转。&quot;}, {&quot;number&quot;: 22, &quot;name&quot;: &quot;游标盘微调螺钉&quot;, &quot;function&quot;: &quot;游标盘制动后精细调整其方位。&quot;}, {&quot;number&quot;: 23, &quot;name&quot;: &quot;游标盘制动螺钉&quot;, &quot;function&quot;: &quot;限制游标盘自由转动，配合22号微调。&quot;}, {&quot;number&quot;: 24, &quot;name&quot;: &quot;平行光管水平调节螺钉&quot;, &quot;function&quot;: &quot;粗调平行光管的水平方向。&quot;}, {&quot;number&quot;: 25, &quot;name&quot;: &quot;平行光管俯仰调节螺钉&quot;, &quot;function&quot;: &quot;使平行光管光轴垂直主轴。&quot;}, {&quot;number&quot;: 26, &quot;name&quot;: &quot;狭缝宽度调节手轮&quot;, &quot;function&quot;: &quot;改变狭缝宽度，平衡像宽与亮度。&quot;}], &quot;textbookQuestions&quot;: [{&quot;group&quot;: &quot;预习&quot;, &quot;number&quot;: 1, &quot;pages&quot;: &quot;PDF 10页｜原书183页&quot;, &quot;q&quot;: &quot;望远镜与平行光管应满足哪些要求，如何判断？&quot;, &quot;a&quot;: &quot;分划板清晰；望远镜调焦于无穷远；双面镜翻转后两面绿十字都与上十字重合，检验望远镜光轴垂直主轴。保持望远镜状态，平行光管狭缝像清晰无视差，检验出射平行；水平狭缝像与中央水平线重合，检验其光轴方向，最后恢复竖直狭缝。&quot;}, {&quot;group&quot;: &quot;预习&quot;, &quot;number&quot;: 2, &quot;pages&quot;: &quot;PDF 10页｜原书183页&quot;, &quot;q&quot;: &quot;双面平面镜怎样放置，这样放有什么好处？&quot;, &quot;a&quot;: &quot;沿台面a、b两调节螺钉连线的垂直平分线放置，保持镜面与调节螺钉的方位关系；通过游标盘带动镜子与台面共同转动。这样可以明确台面螺钉对镜面倾斜的调节作用，方便翻转两面后比较并按调半法修正。&quot;}, {&quot;group&quot;: &quot;预习&quot;, &quot;number&quot;: 3, &quot;pages&quot;: &quot;PDF 10页｜原书183页&quot;, &quot;q&quot;: &quot;三棱镜怎样放置，这样放有什么好处？&quot;, &quot;a&quot;: &quot;棱镜A、B、C顶点分别位于三个台面螺钉上方。检验AB面调C处螺钉，检验AC面调B处螺钉，反复使两面绿十字与上十字重合。顶点与螺钉一一对应，便于按照所观察的光学面选定相应螺钉，减少盲目地同时调动多个螺钉。&quot;}, {&quot;group&quot;: &quot;实验中&quot;, &quot;number&quot;: 1, &quot;pages&quot;: &quot;PDF 10页｜原书183页&quot;, &quot;q&quot;: &quot;双面镜两面的像都对准上十字后，载物台平面一定垂直主轴吗？&quot;, &quot;a&quot;: &quot;不一定；这时望远镜光轴垂直主轴、镜面平行主轴，但台面另一方向仍可能倾斜。需要棱镜两个不平行面的检验 body { padding: 18px 24px 32px !important; }
#spectrometer-lab { max-width: 1480px; margin: 0 auto; gap: 22px; }
#spectrometer-lab .sp-heading { padding: 0 100px 16px 0; border-bottom: 1px solid var(--border); }
#spectrometer-lab .sp-learning-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); align-items: start; gap: 26px; }
#spectrometer-lab .sp-learning-nav { position: sticky; top: 16px; min-width: 0; }
#spectrometer-lab .sp-directory { border: 0; padding: 0; }
#spectrometer-lab .sp-directory-summary { padding: 0 0 14px; font-weight: 600; }
#spectrometer-lab .sp-directory-current { display: none; }
#spectrometer-lab .sp-nav-stage { display: grid; gap: 3px; margin: 0 0 17px; }
#spectrometer-lab .sp-nav-stage-title { font-size: 13px; margin: 0 0 5px; color: var(--muted-foreground); font-weight: 500; }
#spectrometer-lab .sp-topic-button { appearance: none; border: 0; border-radius: 7px; color: var(--foreground); background: transparent; padding: 9px 10px; font: inherit; font-size: 14px; line-height: 1.5; text-align: left; cursor: pointer; }
#spectrometer-lab .sp-topic-button:hover { background: var(--card); }
#spectrometer-lab .sp-topic-button[aria-current] { background: var(--accent); color: var(--accent-foreground); font-weight: 600; box-shadow: inset 3px 0 0 var(--primary); }
#spectrometer-lab :is(button, summary, select, input):focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; }
#spectrometer-lab .sp-learning-workspace { display: grid; gap: 20px; min-width: 0; }
#spectrometer-lab .sp-step-header { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 18px; align-items: center; scroll-margin-top: 16px; }
#spectrometer-lab .sp-step-context { min-width: 0; display: grid; gap: 4px; }
#spectrometer-lab .sp-step-meta { color: var(--muted-foreground); font-size: 13px; }
#spectrometer-lab .sp-current-topic { font-size: 20px; line-height: 1.5; }
#spectrometer-lab .sp-current-topic:focus { outline: none; }
#spectrometer-lab .sp-step-navigation { grid-column: 1 / -1; display: flex; gap: 10px; padding: 0 0 15px; border-bottom: 1px solid var(--border); }
#spectrometer-lab .sp-section-links { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 18px; }
#spectrometer-lab .sp-section-link { border: 0; border-bottom: 1px solid var(--border); background: none; padding: 3px 0; color: var(--foreground); font: inherit; font-size: 14px; cursor: pointer; }
#spectrometer-lab .sp-section-link:hover { border-bottom-color: var(--foreground); }
#spectrometer-lab :is(.sp-visual,.sp-operations,.sp-lesson-panel) { scroll-margin-top: 16px; }
#spectrometer-lab .sp-topic-position { min-width: 54px; color: var(--muted-foreground); font-size: 14px; }
#spectrometer-lab [data-sp=page] { margin-left: auto; }
#spectrometer-lab .sp-studio { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; align-items: start; }
#spectrometer-lab .sp-visual { grid-column: 1 / -1; min-width: 0; display: grid; gap: 16px; }
#spectrometer-lab .sp-instrument-panel { min-width: 0; display: grid; gap: 8px; }
#spectrometer-lab .sp-instrument-toolbar { display: flex; justify-content: flex-end; }
#spectrometer-lab .sp-instrument-viewport { width: 100%; min-width: 0; overflow: auto; scrollbar-width: thin; }
#spectrometer-lab .sp-instrument-viewport:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
#spectrometer-lab .sp-instrument-panel[data-zoomed=true] [data-sp=instrument] { min-width: 760px; width: 150%; }
#spectrometer-lab .sp-drawings { gap: 18px; }
#spectrometer-lab .sp-readout { padding: 12px 16px; background: var(--card); border-radius: 8px; row-gap: 8px; }
#spectrometer-lab [data-sp=parts] { gap: 6px; }
#spectrometer-lab [data-sp=parts] .btn { padding: 7px 10px; font-size: 14px; }
#spectrometer-lab .sp-operations { min-width: 0; display: grid; gap: 16px; padding: 18px; background: var(--card); border-radius: 10px; }
#spectrometer-lab .sp-panel-heading { font-size: 16px; }
#spectrometer-lab [data-sp=controls] { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
#spectrometer-lab [data-sp=controls] &gt; * { min-width: 0; width: 100%; }
#spectrometer-lab [data-sp=actions] { gap: 7px; }
#spectrometer-lab [data-sp=actions] .btn { white-space: normal; height: auto; min-height: 36px; }
#spectrometer-lab [data-sp=status]:empty { display: none; }
#spectrometer-lab [data-sp=status]:not(:empty) { padding: 12px 0 0; border-top: 1px solid var(--border); }
#spectrometer-lab .sp-lesson-panel { margin: 0; min-width: 0; padding: 16px 0 0; border-top: 2px solid var(--border); }
#spectrometer-lab .sp-lesson-panel &gt; summary { font-weight: 600; }
#spectrometer-lab [data-sp=lesson-text] { gap: 18px; line-height: 1.75; }
#spectrometer-lab .sp-section { gap: 6px; }
#spectrometer-lab .sp-studio-instrument .sp-lesson-panel { grid-column: 1 / -1; }
#spectrometer-lab .sp-reference-panel { padding: 16px 0 0; border-top: 1px solid var(--border); }
#spectrometer-lab .sp-reference-panel &gt; summary { font-weight: 500; }
#spectrometer-lab [data-sp=data] { overflow-wrap: anywhere; }
#spectrometer-lab .sp-instrument-return { max-width: 310px; white-space: normal; }
@media (min-width: 1400px) {
  #spectrometer-lab .sp-studio { grid-template-columns: minmax(0, 1fr) 320px; }
  #spectrometer-lab .sp-visual { grid-column: 1; }
  #spectrometer-lab .sp-operations { grid-column: 2; }
  #spectrometer-lab .sp-lesson-panel { grid-column: 1 / -1; }
  #spectrometer-lab .sp-studio-instrument .sp-visual { grid-column: 1 / -1; }
}
@media (max-width: 899px) {
  body { padding: 14px 16px 28px !important; }
  #spectrometer-lab { gap: 16px; }
  #spectrometer-lab .sp-learning-layout { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  #spectrometer-lab .sp-learning-nav { position: static; }
  #spectrometer-lab .sp-directory { padding: 12px 14px; background: var(--card); border-radius: 8px; }
  #spectrometer-lab .sp-directory-summary { padding: 0; }
  #spectrometer-lab .sp-directory-current { display: block; color: var(--muted-foreground); font-size: 13px; margin: 5px 0 0; font-weight: 400; }
  #spectrometer-lab .sp-directory[open] .sp-nav-stage:first-of-type { margin-top: 16px; }
  #spectrometer-lab .sp-nav-stage { margin-bottom: 12px; }
  #spectrometer-lab .sp-topic-button { min-height: 42px; }
  #spectrometer-lab .sp-studio { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  #spectrometer-lab .sp-current-topic { font-size: 18px; }
  #spectrometer-lab .sp-instrument-return { max-width: 200px; }
}
@media (max-width: 520px) {
  #spectrometer-lab .sp-step-header { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  #spectrometer-lab .sp-instrument-return { justify-self: start; max-width: 100%; }
  #spectrometer-lab .sp-step-navigation { gap: 8px; }
  #spectrometer-lab [data-sp=page] { width: 100%; margin-left: 0; }
  #spectrometer-lab .sp-operations { padding: 14px; }
  #spectrometer-lab .sp-readout { padding: 12px; }
  #spectrometer-lab .sp-heading { padding-right: 80px; }
}

&lt;script id=&quot;spectrometer-layout-adapter&quot;&gt;
/* Presentation adapter: the original model, course text and event handlers are unchanged. */
(() =&gt; {
  &#x27;use strict&#x27;;
  const root = document.getElementById(&#x27;spectrometer-lab&#x27;);
  if (!root || root.dataset.learningLayout) return;
  const q = name =&gt; root.querySelector(`[data-sp=&quot;${name}&quot;]`);
  const picker = q(&#x27;topic&#x27;);
  if (!picker?.options.length) return;
  root.dataset.learningLayout = &#x27;v1&#x27;;
  const topics = Array.from(picker.options, option =&gt; ({ key: option.value, title: option.textContent }));
  const stages = [
    { title: &#x27;认识仪器&#x27;, keys: [&#x27;instrument&#x27;] },
    { title: &#x27;调节仪器&#x27;, keys: [&#x27;optics&#x27;, &#x27;alignment&#x27;, &#x27;collimator&#x27;] },
    { title: &#x27;练习读数&#x27;, keys: [&#x27;vernier&#x27;, &#x27;dual&#x27;] },
    { title: &#x27;进行测量&#x27;, keys: [&#x27;apex&#x27;, &#x27;minimum&#x27;, &#x27;dispersion&#x27;, &#x27;grating&#x27;] },
    { title: &#x27;整理记录&#x27;, keys: [&#x27;records&#x27;] }
  ];
  const make = (tag, className, text) =&gt; {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text) node.textContent = text;
    return node;
  };
  const layout = make(&#x27;div&#x27;, &#x27;sp-learning-layout&#x27;);
  const nav = make(&#x27;nav&#x27;, &#x27;sp-learning-nav&#x27;);
  nav.setAttribute(&#x27;aria-label&#x27;, &#x27;分光计学习目录&#x27;);
  const directory = make(&#x27;details&#x27;, &#x27;sp-directory&#x27;);
  const directorySummary = make(&#x27;summary&#x27;, &#x27;sp-directory-summary&#x27;);
  directorySummary.append(make(&#x27;span&#x27;, &#x27;&#x27;, &#x27;学习目录&#x27;));
  const directoryCurrent = make(&#x27;span&#x27;, &#x27;sp-directory-current&#x27;);
  directorySummary.append(directoryCurrent);
  directory.append(directorySummary);
  const navButtons = [];
  stages.forEach((stage, index) =&gt; {
    const section = make(&#x27;section&#x27;, &#x27;sp-nav-stage&#x27;);
    const label = make(&#x27;h3&#x27;, &#x27;sp-nav-stage-title&#x27;, `${index + 1} · ${stage.title}`);
    section.append(label);
    stage.keys.forEach(key =&gt; {
      const topic = topics.find(item =&gt; item.key === key);
      if (!topic) return;
      const button = make(&#x27;button&#x27;, &#x27;sp-topic-button&#x27;, topic.title);
      button.type = &#x27;button&#x27;;
      button.dataset.topicTarget = key;
      button.setAttribute(&#x27;aria-controls&#x27;, &#x27;sp-learning-workspace&#x27;);
      navButtons.push(button);
      section.append(button);
    });
    directory.append(section);
  });
  nav.append(directory);
  const workspace = make(&#x27;main&#x27;, &#x27;sp-learning-workspace&#x27;);
  workspace.id = &#x27;sp-learning-workspace&#x27;;
  workspace.setAttribute(&#x27;aria-labelledby&#x27;, &#x27;sp-current-topic&#x27;);
  const stepHeader = make(&#x27;header&#x27;, &#x27;sp-step-header&#x27;);
  const stepMeta = make(&#x27;div&#x27;, &#x27;sp-step-meta&#x27;);
  stepMeta.setAttribute(&#x27;aria-live&#x27;, &#x27;polite&#x27;);
  const stepTitle = make(&#x27;h3&#x27;, &#x27;sp-current-topic&#x27;);
  stepTitle.id = &#x27;sp-current-topic&#x27;;
  stepTitle.tabIndex = -1;
  const context = make(&#x27;div&#x27;, &#x27;sp-step-context&#x27;);
  context.append(stepMeta, stepTitle);
  const instrumentReturn = make(&#x27;button&#x27;, &#x27;btn sp-instrument-return&#x27;, &#x27;回看仪器&#x27;);
  instrumentReturn.type = &#x27;button&#x27;;
  stepHeader.append(context, instrumentReturn);
  const originalNavigation = q(&#x27;navigation&#x27;);
  originalNavigation.classList.add(&#x27;sp-step-navigation&#x27;);
  const position = make(&#x27;span&#x27;, &#x27;sp-topic-position tabular-nums&#x27;);
  originalNavigation.insertBefore(position, originalNavigation.firstChild);
  stepHeader.append(originalNavigation);
  const studio = make(&#x27;div&#x27;, &#x27;sp-studio&#x27;);
  const visual = make(&#x27;section&#x27;, &#x27;sp-visual&#x27;);
  visual.setAttribute(&#x27;aria-label&#x27;, &#x27;仪器、图示与读数&#x27;);
  const instrumentPanel = make(&#x27;div&#x27;, &#x27;sp-instrument-panel&#x27;);
  const instrumentToolbar = make(&#x27;div&#x27;, &#x27;sp-instrument-toolbar&#x27;);
  const zoomButton = make(&#x27;button&#x27;, &#x27;btn sp-instrument-zoom&#x27;, &#x27;放大仪器图&#x27;);
  zoomButton.type = &#x27;button&#x27;;
  zoomButton.setAttribute(&#x27;aria-pressed&#x27;, &#x27;false&#x27;);
  zoomButton.setAttribute(&#x27;aria-controls&#x27;, &#x27;sp-instrument-viewport&#x27;);
  const instrumentViewport = make(&#x27;div&#x27;, &#x27;sp-instrument-viewport&#x27;);
  instrumentViewport.id = &#x27;sp-instrument-viewport&#x27;;
  instrumentViewport.tabIndex = 0;
  instrumentViewport.setAttribute(&#x27;role&#x27;, &#x27;region&#x27;);
  instrumentViewport.setAttribute(&#x27;aria-label&#x27;, &#x27;分光计整机图；放大后可横向滚动查看&#x27;);
  instrumentViewport.append(q(&#x27;instrument&#x27;));
  instrumentToolbar.append(zoomButton);
  instrumentPanel.append(instrumentToolbar, instrumentViewport);
  zoomButton.addEventListener(&#x27;click&#x27;, () =&gt; {
    const zoomed = instrumentPanel.dataset.zoomed !== &#x27;true&#x27;;
    instrumentPanel.dataset.zoomed = String(zoomed);
    zoomButton.setAttribute(&#x27;aria-pressed&#x27;, String(zoomed));
    zoomButton.textContent = zoomed ? &#x27;恢复全图&#x27; : &#x27;放大仪器图&#x27;;
    if (!zoomed) instrumentViewport.scrollLeft = 0;
  });
  [instrumentPanel, q(&#x27;parts&#x27;), root.querySelector(&#x27;.sp-drawings&#x27;), q(&#x27;readout&#x27;), q(&#x27;data&#x27;)].forEach(node =&gt; visual.append(node));
  const operations = make(&#x27;section&#x27;, &#x27;sp-operations&#x27;);
  const operationsTitle = make(&#x27;h3&#x27;, &#x27;sp-panel-heading&#x27;, &#x27;操作&#x27;);
  operationsTitle.id = &#x27;sp-operations-heading&#x27;;
  operations.setAttribute(&#x27;aria-labelledby&#x27;, operationsTitle.id);
  operations.append(operationsTitle, q(&#x27;controls&#x27;), q(&#x27;actions&#x27;), q(&#x27;status&#x27;));
  const lesson = q(&#x27;lesson&#x27;);
  const questions = q(&#x27;questions&#x27;);
  const sources = q(&#x27;source&#x27;).closest(&#x27;details&#x27;);
  lesson.classList.add(&#x27;sp-lesson-panel&#x27;);
  questions.classList.add(&#x27;sp-reference-panel&#x27;);
  sources.classList.add(&#x27;sp-reference-panel&#x27;);
  visual.id = &#x27;sp-visual-section&#x27;;
  operations.id = &#x27;sp-operation-section&#x27;;
  lesson.id = &#x27;sp-lesson-section&#x27;;
  const sectionLinks = make(&#x27;nav&#x27;, &#x27;sp-section-links&#x27;);
  sectionLinks.setAttribute(&#x27;aria-label&#x27;, &#x27;当前主题内容&#x27;);
  let operationsLink;
  for (const [label, target] of [[&#x27;图示&#x27;, visual], [&#x27;操作&#x27;, operations], [&#x27;本项原理与操作&#x27;, lesson]]) {
    const button = make(&#x27;button&#x27;, &#x27;sp-section-link&#x27;, label);
    button.type = &#x27;button&#x27;;
    button.setAttribute(&#x27;aria-controls&#x27;, target.id);
    button.addEventListener(&#x27;click&#x27;, () =&gt; {
      if (target === lesson) lesson.open = true;
      target.scrollIntoView({ block: &#x27;start&#x27;, behavior: &#x27;instant&#x27; });
      const focusTarget = target === lesson ? lesson.querySelector(&#x27;summary&#x27;) : target;
      if (focusTarget === target) target.tabIndex = -1;
      focusTarget.focus({ preventScroll: true });
    });
    sectionLinks.append(button);
    if (target === operations) operationsLink = button;
  }
  stepHeader.append(sectionLinks);
  studio.append(visual, operations, lesson);
  workspace.append(stepHeader, studio, questions, sources);
  layout.append(nav, workspace);
  root.append(layout);
  picker.closest(&#x27;label&#x27;).hidden = true;

  const wide = matchMedia(&#x27;(min-width: 900px)&#x27;);
  const syncDirectory = () =&gt; { directory.open = wide.matches; };
  syncDirectory();
  wide.addEventListener(&#x27;change&#x27;, syncDirectory);
  let previousStudyTopic = null;
  let lastTopic = picker.value;
  const go = (key, focus = false) =&gt; {
    if (!topics.some(topic =&gt; topic.key === key)) return;
    if (key === &#x27;instrument&#x27; &amp;&amp; picker.value !== &#x27;instrument&#x27;) previousStudyTopic = picker.value;
    picker.value = key;
    picker.dispatchEvent(new Event(&#x27;change&#x27;, { bubbles: true }));
    sync();
    if (!wide.matches) directory.open = false;
    if (focus) {
      stepTitle.focus({ preventScroll: true });
      stepHeader.scrollIntoView({ block: &#x27;start&#x27;, behavior: &#x27;instant&#x27; });
    }
  };
  function sync() {
    const key = root.dataset.topic || picker.value;
    const index = topics.findIndex(topic =&gt; topic.key === key);
    if (index &lt; 0) return;
    const stage = stages.find(item =&gt; item.keys.includes(key));
    const isInstrument = key === &#x27;instrument&#x27;;
    const title = topics[index].title;
    stepTitle.textContent = title;
    stepMeta.textContent = stage.title;
    position.textContent = `${index + 1} / ${topics.length}`;
    directoryCurrent.textContent = title;
    navButtons.forEach(button =&gt; {
      const selected = button.dataset.topicTarget === key;
      if (selected) button.setAttribute(&#x27;aria-current&#x27;, &#x27;step&#x27;);
      else button.removeAttribute(&#x27;aria-current&#x27;);
    });
    root.querySelector(&#x27;[data-act=&quot;previous&quot;]&#x27;).disabled = index === 0;
    root.querySelector(&#x27;[data-act=&quot;next&quot;]&#x27;).disabled = index === topics.length - 1;
    operations.hidden = isInstrument;
    operationsLink.hidden = isInstrument;
    instrumentPanel.hidden = !isInstrument;
    studio.classList.toggle(&#x27;sp-studio-instrument&#x27;, isInstrument);
    instrumentReturn.hidden = isInstrument &amp;&amp; !previousStudyTopic;
    instrumentReturn.textContent = isInstrument ? `返回 ${topics.find(topic =&gt; topic.key === previousStudyTopic)?.title || &#x27;&#x27;}` : &#x27;回看仪器&#x27;;
    // Keep the button selection accessible without changing the existing selection state.
    for (const button of q(&#x27;parts&#x27;).querySelectorAll(&#x27;[data-part-select]&#x27;)) {
      const selected = q(&#x27;instrument&#x27;).querySelector(`[data-part=&quot;${button.dataset.partSelect}&quot;].is-selected`);
      button.setAttribute(&#x27;aria-pressed&#x27;, String(!!selected));
    }
    if (lastTopic !== key) {
      lastTopic = key;
      // Topic navigation is a context change; the original explanation stays expanded.
      lesson.open = true;
    }
  }
  nav.addEventListener(&#x27;click&#x27;, event =&gt; {
    const button = event.target.closest(&#x27;[data-topic-target]&#x27;);
    if (button) go(button.dataset.topicTarget, true);
  });
  nav.addEventListener(&#x27;keydown&#x27;, event =&gt; {
    if (event.altKey || event.ctrlKey || event.metaKey) return;
    const index = navButtons.indexOf(document.activeElement);
    if (index &lt; 0) return;
    let next;
    if (event.key === &#x27;ArrowDown&#x27;) next = Math.min(index + 1, navButtons.length - 1);
    else if (event.key === &#x27;ArrowUp&#x27;) next = Math.max(index - 1, 0);
    else if (event.key === &#x27;Home&#x27;) next = 0;
    else if (event.key === &#x27;End&#x27;) next = navButtons.length - 1;
    else return;
    event.preventDefault();
    navButtons[next].focus();
  });
  instrumentReturn.addEventListener(&#x27;click&#x27;, () =&gt; go(picker.value === &#x27;instrument&#x27; ? previousStudyTopic : &#x27;instrument&#x27;, true));
  root.addEventListener(&#x27;click&#x27;, event =&gt; {
    if (event.target.closest(&#x27;[data-act=&quot;previous&quot;], [data-act=&quot;next&quot;]&#x27;)) {
      sync();
      if (!wide.matches) stepHeader.scrollIntoView({ block: &#x27;start&#x27;, behavior: &#x27;instant&#x27; });
    }
  });
  new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: [&#x27;data-topic&#x27;] });
  sync();
  window.dispatchEvent(new Event(&#x27;resize&#x27;));
